s2:[
 {sec:'Conversatorio',k:'cover',kick:'Etapa 1 · Entender y levantar · Sesión 2 · Sábado 7 de noviembre',title:'Mapear el proceso actual',sub:'¿Cómo se ve el proceso de punta a punta y dónde se pierde valor?'},
 {sec:'Conversatorio',k:'read1',br:'Buenos días. Empezamos con la lectura eje de esta etapa.',kick:'Conversatorio · lectura eje de la etapa 1',idx:0,min:20,n:'Si no recibieron la lectura, pasa a la siguiente lámina y explica tú las tres ideas en 5 minutos. Luego vuelve a la pregunta 2 y que cada quien comparta un paso de su organización.'},
 {sec:'Conversatorio',k:'list',br:'De Hammer, tres ideas que usaremos hoy mismo.',title:'Antes de automatizar, rediseñar',items:[['Organizar por resultados','No por tareas ni por áreas.'],['Captar la información una vez','Y en la fuente.'],['Decidir donde se hace el trabajo','Con el control dentro del proceso.']]},
 {sec:'Camila',k:'list',br:'Antes de su empresa, practiquemos con una sola historia. No necesitan ser expertos en herramientas: solo miren cómo se ve un proceso completo.',kick:'Ejemplo · así se ve un proceso de punta a punta',title:'La incorporación en Andes Contact',items:[['Quién aporta','Reclutamiento, salud ocupacional, formación y el supervisor.'],['Qué entra','Una candidata aceptada, sus documentos y un cupo de formación.'],['Los pasos','Postula → entrevistas → oferta → exámenes → espera → formación → piso.'],['Qué sale','Una agente productiva que sigue en la empresa a los 90 días.'],['Para quién','El supervisor de campaña y el cliente del contact center.']],n:'Esto es un SIPOC, pero no hace falta nombrarlo. Un minuto y avanza.'},
 {sec:'Camila',k:'list',br:'Esta es la historia. Ahora la resolvemos juntos.',title:'Los 66 días de Camila',items:[['Día 0','La empresa decide que necesita contratar a alguien.'],['Día 10','Camila ve el aviso y se postula.'],['Día 19','Le hacen pruebas y tres entrevistas.'],['Día 22','Le dicen por WhatsApp que quedó.'],['Día 29','Va a los exámenes médicos y le vuelven a pedir los mismos papeles.'],['Día 41','Nadie la llama para empezar. Mientras espera, le ofrecen otro trabajo.'],['Días 42 al 56','Por fin empieza la capacitación, con 25 compañeros y casi sin práctica.'],['Día 57','Su primer día de trabajo real. Su jefa tiene 23 personas a cargo y ya le exigen metas.']],cls:'tight',n:'Cuéntalo como una historia, en primera persona si te sale natural: “Me llamo Camila…”. Luego, cuatro preguntas.'},
 {sec:'Camila',k:'paso',tl:1,br:'Primera pregunta. Miren el calendario de arriba.',kick:'Paso 1 de 4',q:'¿Cuántos días pasó Camila esperando, sin que nadie hiciera nada por ella?',h:'Busquen en el calendario los días en que no pasa nada',a:'Unos 19 días: esperó los exámenes (día 22 al 29) y esperó que la llamaran para empezar (día 29 al 41).',c:'Cada día de espera es un día en que la persona puede irse. En cualquier proceso, primero busca dónde se espera.',min:10},
 {sec:'Camila',k:'paso',tl:1,br:'Segunda pregunta. Ahora piensen en quién la atendió.',kick:'Paso 2 de 4',q:'¿Por cuántas áreas distintas pasó Camila antes de empezar a trabajar?',h:'Cuenten cada área que tuvo que ver con ella',a:'Por cinco áreas: selección, contratación, exámenes médicos, capacitación y su jefa.',c:'Cada vez que el caso cambia de manos se pierde información y tiempo. Menos traspasos, menos errores.',min:10},
 {sec:'Camila',k:'paso',tl:1,br:'Tercera pregunta. Pónganse en su lugar.',kick:'Paso 3 de 4',q:'¿En qué dos momentos Camila pudo pensar “mejor me voy”?',h:'Digan el día y qué estaba pasando',a:'El día 41, cuando le ofrecieron otro trabajo mientras esperaba. Y el día 57, cuando empezó sin apoyo y ya con metas.',c:'La gente no se va por un solo motivo: se va en los momentos en que el proceso la deja sola.',min:10},
 {sec:'Camila',k:'paso',tl:1,br:'Última pregunta. Ahora ustedes son el gerente.',kick:'Paso 4 de 4',q:'¿Qué cambiarían primero para que la próxima Camila se quede?',h:'Una sola cosa, la más importante',a:'Lo que hizo la sede Sur: no dejarla esperar sin noticias y acompañarla en sus primeras semanas.',c:'Antes de pagar más, revisa el proceso. A veces la solución no cuesta dinero, sino organizarse mejor.',min:15},
 {sec:'Camila',k:'big',br:'Hay un dato que no les conté.',text:'Camila renunció en la <em>semana 5</em>. La causa no estaba en ella: estaba en el proceso.',min:5},
 {sec:'Camila',k:'chart',br:'Y así lo vivió ella.',kick:'Lo que vive la persona',title:'La curva emocional de Camila',chart:'journey',note:'Los momentos que definen si alguien se queda están en los valles: la espera sin noticias y las primeras semanas en piso.',n:'Cierra: “Estas mismas cuatro preguntas las harán hoy con su empresa”. Anuncia el break.'},
 {sec:'Pausa',k:'brk',min:30},
 {sec:'Los casos',k:'empresas',br:'Volvemos. Ya practicaron con Camila; ahora, su encargo real.',title:'Tres empresas, tres encargos',n:'Dos minutos por empresa: el cliente, el proceso y lo que pide. Di que uno de los casos está adaptado con la experiencia de un equipo. Luego envía a cada equipo su ficha completa por el chat (botón “Copiar ficha completa”).'},
 {sec:'Los casos',k:'caso1',ci:0,br:'El primero está adaptado con la experiencia de uno de sus equipos.'},
 {sec:'Los casos',k:'caso1',ci:1,br:'El segundo, una empresa de transporte de carga.'},
 {sec:'Los casos',k:'caso1',ci:2,br:'Y el tercero, una clínica.'},
 {sec:'Los casos',k:'guia',br:'Sea cual sea su caso, el trabajo se desarrolla igual: cinco pasos, uno por sesión.',title:'Cómo desarrollar su caso',n:'Lee solo las preguntas, en voz alta. Cierra: “Hoy hacemos los pasos 1 y 2”. El detalle está en su ficha.'},
 {sec:'Los casos',k:'act',br:'Les acabo de enviar su ficha completa. Primero, entiendan el encargo.',kick:'Equipos',title:'Lean su caso y llenen la ficha del encargo',steps:['Lean la ficha completa de su empresa','Llenen la ficha del encargo (pestaña Materiales)','Redacten su pregunta operacional: ¿qué en el proceso de ___ produce ___?'],min:20,out:'Diapositiva 1: el encargo y la pregunta operacional'},
 {sec:'Taller',k:'act',br:'Con el encargo claro, hagan con su empresa lo mismo que hicimos con Camila.',kick:'Equipos',title:'El proceso actual de su empresa',steps:['Dibujen los pasos en orden y quién hace cada uno','¿Dónde espera el caso? ¿Cuántas veces cambia de manos?','¿En qué momentos se pierde a la persona?','Lo que el caso no diga: supuesto explícito, y lo revisan conmigo'],min:45,out:'Diapositiva 2: proceso actual'},
 {sec:'Consultorio',k:'big',br:'Seguro aparecieron dudas con el caso. Este espacio es para eso.',kick:'Consultorio',text:'Sus <em>dudas y consultas</em>: sobre el caso, la exposición o la forma de trabajo.',sub:'Micrófono abierto o chat. Las dudas sobre su caso las vemos aquí o mientras los acompaño en sus salas.',min:15},
 {sec:'Cierre',k:'act',br:'Para cerrar, un espacio abierto entre consultoras.',kick:'Comentarios entre consultoras',title:'¿Qué descubrieron? ¿Dónde se trabaron?',steps:['Quien quiera comparte un hallazgo o una dificultad de su mapa','Las otras consultoras pueden sugerir: “¿Y si miran…?”','Diapositivas 1 y 2 completas antes del viernes 13','Lo que falte, lo revisamos juntos el viernes'],min:15}
],
s3:[
 {sec:'Apertura',k:'cover',kick:'Etapa 2 · Diagnosticar y validar · Sesión 3 · Viernes 13 de noviembre',title:'Encontrar el cuello de botella',sub:'¿Cuál es el cuello real del proceso y qué lo confirma o lo desmiente?'},
 {sec:'Apertura',k:'big',br:'Bienvenidos a la segunda etapa. Ya saben cómo es el proceso; ahora, dónde se rompe.',text:'Etapa 2: <em>diagnosticar y validar</em>.',sub:'Hoy buscamos el cuello de botella. Mañana lo ponemos a prueba con la evidencia.'},
 {sec:'Caso',k:'chart',br:'Volvamos a Andes Contact. Estos son los días que toma cada etapa.',kick:'Votación',title:'¿Dónde está el cuello de botella?',chart:'pipeline',note:'Días promedio por etapa.',min:3,n:'La mayoría vota la barra más larga.'},
 {sec:'Caso',k:'big',br:'La mayoría eligió la barra más larga. Miren de nuevo.',text:'La etapa más larga no es el cuello. El cuello está <em>donde se forma la fila</em>.',sub:'Doce días de espera antes de la formación: la formación no da abasto con lo que entra.'},
 {sec:'Caso',k:'big',br:'Y esa fila tiene un tamaño que se puede calcular.',kick:'Ley de Little',text:'Personas en espera = llegadas por día × días de espera',sub:'3,5 contrataciones por día × 12 días ≈ 42 personas con contrato firmado esperando. Cualquiera puede recibir otra oferta.'},
 {sec:'Caso',k:'list',br:'La espera es solo uno de los desperdicios que se esconden en gestión humana.',title:'Dónde se pierde valor sin que nadie lo vea',items:[['Esperas','Candidatos aceptados sin fecha de inicio.'],['Reprocesos','Documentos pedidos tres veces.'],['Sobreprocesamiento','Cinco entrevistas para un puesto operativo.'],['Talento no usado','Ideas de las personas que nadie recoge.']],n:'Pide a cada equipo un desperdicio de su empresa en el chat.'},
 {sec:'Caso',k:'sim',br:'Juguemos con la capacidad de formación. Ustedes deciden los cambios.',kick:'Simulador · modelo didáctico',title:'¿Qué pasa si cambiamos la capacidad?',min:10},
 {sec:'Detectives',k:'act',br:'Ya tienen las herramientas. Ahora investiguen el caso completo.',kick:'Rompecabezas',title:'Detectives del caso',steps:['Ronda 1 (15 min): cada sala analiza una pista','Ronda 2 (15 min): salas mixtas, con un experto de cada pista','Entregable: “El problema real es… porque…”'],min:35},
 {sec:'Detectives',k:'list',br:'Cada sala recibe una pista distinta.',title:'Las pistas',items:[['Pista A','Tiempos promedio por etapa.'],['Pista B','Permanencia por sede.'],['Pista C','Razones declaradas en la encuesta de salida.'],['Pista D','Cómo opera el piso en cada sede.']]},
 {sec:'Pausa',k:'brk',min:15},
 {sec:'Veredicto',k:'split',br:'Escuchemos los veredictos. Casi todos llegan a la misma tensión.',title:'Lo que dicen frente a lo que hacen',a:{h:'Lo que dicen',t:'38% marca “salario” en la encuesta de salida.'},b:{h:'Lo que hacen',t:'La sede que subió el salario casi no cambió. La que acompañó en piso bajó la salida de 41% a 24%.'},hi:'b'},
 {sec:'Veredicto',k:'big',br:'Si juntamos las pistas, la historia es otra.',text:'Dos cuellos encadenados: <em>capacidad de formación</em> y <em>acompañamiento en piso</em>.',sub:'Subir salarios costaría COP 3.400 millones al año (unos USD 1,1 millones) y atacaría un síntoma.'},
 {sec:'Veredicto',k:'list',br:'Para que esto no vuelva a sorprendernos, hay que medir antes.',title:'Tres tipos de indicadores, en este orden',items:[['De proceso','Días de espera, % con tutor activo. Avisan antes.'],['De resultado','Rotación a 90 días, costo de reemplazo. Confirman después.'],['De experiencia','Cómo vive la persona cada momento clave.']]},
 {sec:'Taller',k:'act',br:'Antes de buscar el cuello en su empresa, aseguremos que el mapa esté completo.',kick:'Equipos',title:'Clínica de mapas',steps:['Ajusten su mapa con lo que conversamos','Dos equipos lo muestran en 3 minutos','El grupo revisa límites, esperas, traspasos e indicadores'],min:20},
 {sec:'Taller',k:'act',br:'Con el mapa listo, llevemos todo esto a su empresa.',kick:'Equipos',title:'La hipótesis del cuello de botella',steps:['Marquen en su mapa dónde se forma la fila','Sosténganla con un dato del caso','Elijan 3 indicadores: de proceso, de resultado y de experiencia','Redacten la hipótesis con la estructura de la siguiente lámina'],min:60,out:'Diapositiva 3: cuello de botella'},
 {sec:'Taller',k:'big',br:'Esta es la estructura para escribirla.',kick:'Estructura',text:'Creemos que <em>[resultado]</em> se explica principalmente por <em>[cuello]</em> en <em>[etapa]</em>, porque <em>[dato]</em>.',sub:'Si es cierto, deberíamos observar [evidencia]. Lo desmentiría encontrar [dato].'},
 {sec:'Tribunal',k:'act',br:'Una hipótesis que nadie intentó poner a prueba todavía no es un diagnóstico.',kick:'Comentarios entre consultoras',title:'¿Qué dato pondría a prueba su hipótesis?',steps:['Una o dos consultoras que quieran comparten su hipótesis','El grupo comenta qué dato la pondría a prueba','Y sugiere cómo reforzarla'],min:20},
 {sec:'Consultorio',k:'big',br:'Después del tribunal seguro quedan preguntas. Este espacio es para eso.',kick:'Consultorio',text:'Sus <em>dudas y consultas</em>: sobre el caso, la exposición o la forma de trabajo.',sub:'Micrófono abierto o chat. Las dudas sobre su caso las vemos aquí o mientras los acompaño en sus salas.',min:15},
 {sec:'Cierre',k:'read1',br:'Mañana la validamos. La lectura eje de esta etapa nos dice cómo.',kick:'Lectura eje de la etapa 2',idx:1,min:10}
],
s4:[
 {sec:'Conversatorio',k:'cover',kick:'Etapa 2 · Diagnosticar y validar · Sesión 4 · Sábado 14 de noviembre',title:'Validar el diagnóstico',sub:'¿Qué evidencia sostiene el cuello y qué explicaciones alternativas quedan descartadas?'},
 {sec:'Conversatorio',k:'read1',br:'Buenos días. Abrimos con Rousseau y Barends, y con la hipótesis de ayer sobre la mesa.',kick:'Conversatorio · lectura eje de la etapa 2',idx:1,min:20,n:'Semáforo en el tablero: cada equipo califica su hipótesis en las cuatro fuentes y anota qué le falta. Ese faltante es lo que trabajarán hoy en consultoría.'},
 {sec:'Teoría',k:'big',br:'De la lectura nos quedamos con una idea para toda la mañana.',kick:'Avance teórico · 15 min',text:'Validar no es buscar lo que confirma la hipótesis: es <em>intentar desmentirla</em> y no lograrlo.',n:'Unos segundos de silencio. Luego: “Hoy lo hacemos en tres movimientos”.'},
 {sec:'Teoría',k:'list',br:'Para eso, tres movimientos.',title:'Validar un diagnóstico en tres movimientos',items:[['Abrir','Antes de quedarse con una causa, listar todas las posibles: el diagrama de Ishikawa.'],['Priorizar','Quedarse con máximo tres causas raíz: las que el proceso controla y tienen evidencia.'],['Triangular y descartar','Cada causa raíz con al menos dos fuentes de evidencia; cada explicación alternativa, descartada con un dato.']]},
 {sec:'Teoría',k:'list',br:'El Ishikawa viene de la fábrica. En un proceso de personas, sus seis espinas se ven así.',title:'Las seis espinas en un proceso de personas',items:[['Método y proceso','Pasos, secuencias, esperas y traspasos.'],['Personas y liderazgo','Capacidad, carga y acompañamiento.'],['Gobernanza y decisiones','Quién decide y quién es dueño del proceso.'],['Medición y control','Qué se mide, cuándo y quién lo mira.'],['Sistemas e información','Herramientas y cómo circula la información.'],['Entorno y mercado','Lo que la empresa no controla.']],cls:'two',n:'Las cinco primeras las controla la empresa. Si toda su explicación cae en “entorno”, todavía no encontraron la causa.'},
 {sec:'Dinámica',k:'act',br:'Practiquemos la validación con una fuente que suele engañar: lo que dicen las personas.',kick:'Dinámica guiada · en salas',title:'Ustedes frente a la máquina',steps:['Abran Claude, ChatGPT o Gemini con su cuenta gratuita','Peguen el prompt 1: ya trae los 20 comentarios de salida de Andes Contact','En la misma conversación, peguen el prompt 2: el consultor escéptico','Verifiquen: ¿citó bien los comentarios? ¿Vio el 18? ¿Qué dice que no se puede concluir?'],min:25,n:'Pega en el chat los dos prompts (siguientes láminas, botón Copiar). Quince minutos en salas y diez en plenaria con la revelación.'},
 {sec:'Dinámica',k:'prompt',br:'Este es el prompt 1. Se los pego en el chat.',kick:'Prompt 1 · el analista',title:'Agrupar los comentarios de salida',pid:'din1'},
 {sec:'Dinámica',k:'prompt',br:'Y este es el prompt 2, en la misma conversación.',kick:'Prompt 2 · el consultor escéptico',title:'Que la IA cuestione su propio análisis',pid:'din2'},
 {sec:'Dinámica',k:'list',br:'Volvamos a plenaria. Antes de concluir nada, pongamos a prueba lo que dijo la máquina.',kick:'Revelación · 10 min',title:'¿Qué hacemos con lo que dijo la IA?',cls:'tight',min:10,items:[['¿Están de acuerdo con el análisis?','¿Qué tema esperaban y cuál los sorprendió? ¿El salario dominó o no?'],['¿Lo cuestionan?','Elijan una cita de la IA y búsquenla en los 20 comentarios: ¿dice exactamente eso?'],['¿Apoyan la crítica del consultor escéptico?','¿Qué sesgo de los datos les parece más serio? ¿Qué no se puede concluir con 20 comentarios?'],['¿Qué les dice su experiencia?','¿Han visto en su organización una razón declarada que escondía otra causa?'],['Entonces, ¿subirían el salario 10%?','¿Qué dato le pedirían a Andes Contact antes de decidir?']],n:'Lo que deberían encontrar: solo 3 de 20 comentarios hablan de dinero, y uno de ellos (12) dice que se fue por las metas. Siete hablan de llegar al piso sin apoyo (2, 3, 9, 11, 15, 17 y 19), tres de información incompleta en la entrevista (6, 7, 16) y dos de esperas (1, 13). El 18 explica la encuesta: “marqué salario porque era lo más fácil”. Cierre: la razón declarada no es una causa demostrada; la IA ordena, pero cada cita se verifica en la fuente. Eso es validar.'},
 {sec:'Consultoría 1',k:'sprint',br:'Ahora, su caso. Hagan con su hipótesis lo mismo que hicimos con Andes Contact.',kick:'Consultoría 1 · en equipos',title:'Ishikawa del cuello de botella',tool:'ishikawa',tool2:'matriz',steps:['Escriban su problema y su hipótesis: de ahí salen las sugerencias','Seis espinas con al menos dos causas (botón “Sugerir”); a cada una, su fuente','Máximo tres causas raíz con evidencia; descarten las que no resisten un dato','Abran la matriz: sus causas ya están ahí. Escriban la mejora de cada una','Valoren de 1 a 5 costo, tiempo y personal: el nivel de restricción se calcula solo'],listo:'Todas las causas vigentes tienen su mejora valorada en la matriz.',min:60,out:'Diapositiva 4: Ishikawa, causas raíz y mejoras valoradas',n:'Pega en el chat los enlaces del Ishikawa y de la matriz. Sigue el avance desde el acceso docente (DNI) y recorre las salas con una pregunta: “¿qué dato desmentiría esta causa?”.'},
 {sec:'Consultoría 1',k:'prompt',br:'Si la herramienta falla o quieren otra mirada, este prompt hace lo mismo con su caso.',kick:'Prompt de respaldo · su caso',title:'Contraste de su hipótesis',pid:'contraste'},
 {sec:'Pausa',k:'brk',min:15},
 {sec:'Consultoría 2',k:'list',br:'Volvemos. Su causa raíz necesita una fuente más: la científica. Antes de citar un estudio, cuatro preguntas.',title:'Antes de citar un estudio',items:[['Diseño','¿Qué tipo de estudio es? Un metaanálisis no pesa igual que un caso.'],['Contexto','¿Su muestra se parece a nuestra empresa?'],['Efecto','¿Qué tan grande es el cambio que encontró?'],['Sesgos','¿Quién lo financió? ¿Qué limitaciones reconoce?']]},
 {sec:'Consultoría 2',k:'list',br:'Y para buscar bien, primero hay que preguntar bien.',title:'La pregunta PICO',items:[['Población','¿En quiénes? Conductores nuevos, auxiliares de enfermería, mandos medios…'],['Intervención','¿Qué práctica? Acompañamiento, turnos previsibles, despliegue estructurado…'],['Comparación','¿Frente a qué? La práctica actual.'],['Resultado','¿Qué cambia? Rotación temprana, tiempo de cobertura, implementación.']]},
 {sec:'Consultoría 2',k:'sprint',br:'Busquen evidencia para su causa raíz.',kick:'Consultoría 2 · en equipos',title:'Evidencia científica para su diagnóstico',steps:['Formulen su pregunta PICO (el prompt de la siguiente lámina ayuda)','Busquen en Consensus, Elicit o Google Scholar','Evalúen 3 a 5 estudios: diseño, contexto, efecto y sesgos','Completen: creíamos…, la evidencia dice…, en nuestro caso significa…'],listo:'Cada estudio está verificado en la fuente y tiene una línea sobre qué tanto aplica a su empresa.',min:70,out:'Diapositiva 4, parte B: 3 a 5 estudios evaluados',n:'Ninguna referencia sale de un chatbot sin verificar. Consensus y Elicit buscan en bases de artículos reales.'},
 {sec:'Consultoría 2',k:'prompt',br:'Este prompt les ayuda a preguntar bien. No les da referencias: esas las buscan ustedes.',kick:'Prompt · pregunta PICO',title:'De la causa raíz a la búsqueda',pid:'pico'},
 {sec:'Consultorio',k:'big',br:'Antes de cerrar la etapa, sus dudas y consultas.',kick:'Consultorio',text:'Sus <em>dudas y consultas</em>: sobre el caso, la exposición o la forma de trabajo.',sub:'Micrófono abierto o chat. Las dudas sobre su caso las vemos aquí o mientras los acompaño en sus salas.',min:15},
 {sec:'Cierre',k:'big',br:'Volvamos juntos. Espacio abierto: quien quiera, comparte.',kick:'Comentarios entre consultoras',text:'Creíamos <em>___</em>. La evidencia dice <em>___</em>. En nuestro caso significa <em>___</em>.',sub:'Las otras consultoras pueden comentar o sugerir.',min:15},
 {sec:'Cierre',k:'act',br:'Cerramos la segunda etapa.',kick:'Cierre de la etapa 2',title:'Lo que ya tienen',steps:['Un Ishikawa con causas raíz validadas y cada mejora valorada en la matriz','Explicaciones alternativas descartadas y 3 a 5 estudios evaluados','El viernes: rediseño del proceso sobre las mejoras que salieron con menor restricción'],min:5}
],
s5:[
 {sec:'Apertura',k:'cover',kick:'Etapa 3 · Rediseñar y convencer · Sesión 5 · Viernes 20 de noviembre',title:'Rediseñar el proceso',sub:'¿Cómo debe funcionar el proceso y qué mejoras se pueden implementar de verdad?'},
 {sec:'Teoría',k:'big',br:'Última etapa. Ya saben qué falla y por qué; ahora, cómo debería funcionar.',kick:'Avance teórico · 20 min',text:'Etapa 3: <em>rediseñar y convencer</em>.',sub:'Hoy rediseñamos y priorizamos. Mañana lo defienden ante la dirección.'},
 {sec:'Teoría',k:'split',br:'Así se ve un rediseño: no agrega programas, cambia cómo fluye el trabajo.',title:'Antes y después en Andes Contact',a:{h:'Antes',t:'Dos cohortes de 25 cada quince días. Doce días de espera sin contacto. Supervisor con 22 personas. Metas desde la semana 2.'},b:{h:'Después',t:'Cohortes semanales de 15. Preincorporación durante la espera. Tutor y líder con 12 personas en las primeras seis semanas. Metas desde la semana 5.'},hi:'b'},
 {sec:'Teoría',k:'list',br:'Detrás de ese rediseño hay principios que sirven para cualquier proceso.',title:'Principios de rediseño',items:[['ECRS','Eliminar, combinar, reordenar, simplificar. En ese orden.'],['Proteger el cuello','Que nunca espere ni haga trabajo innecesario.'],['Paralelizar','Lo que no depende entre sí, en simultáneo.'],['Decidir donde está la información','Quien ve el problema, con autoridad para resolverlo.']]},
 {sec:'Teoría',k:'sema',br:'Si su rediseño usa IA, un criterio práctico.',title:'Qué automatizar en un proceso de personas',items:[['#1d7552','Verde','Sintetizar documentos, agendar, recordar, codificar comentarios.'],['#F2B91F','Amarillo','Priorizar o recomendar, con revisión humana y monitoreo por grupo.'],['#FF7A6B','Rojo','Decidir sola contratar, despedir, ascender o sancionar.']],n:'Ejemplo rápido: una IA que descarta candidatos por “riesgo de renuncia” es roja. Amazon abandonó en 2018 una herramienta experimental de selección por sesgo.'},
 {sec:'Teoría',k:'list',br:'Pero no todo lo que se puede rediseñar se puede implementar. Para decidir, la matriz de restricciones.',title:'Matriz de restricciones: cómo se lee',items:[['Tres criterios','Costo, tiempo y personal que exige cada mejora, de 1 (poco) a 5 (mucho).'],['Pesos del cliente','Costo 40%, tiempo 30% y personal 30%.'],['Puntaje','Valoración por peso, sumada: más alto, más difícil de implementar.'],['Nivel','Intervalos por la regla de Sturges: muy baja, baja, media o muy alta restricción.'],['Decisión','Muy baja o baja: aplicar ya. Media: por fases. Muy alta: postergar o rediseñar.']],cls:'tight'},
 {sec:'Teoría',k:'pesos',br:'Y como su cliente, estos son los pesos que les doy.',title:'Los pesos de cada cliente',n:'Revélalos como cliente. Si un equipo discute un peso, que lo argumente como lo haría ante su cliente.'},
 {sec:'Dinámica',k:'sprint',br:'Practiquemos con Andes Contact antes de hacerlo con su empresa.',kick:'Dinámica guiada · en salas',title:'Matriz relámpago',tool:'matriz',steps:['Abran la matriz y activen el modo práctica (Andes Contact)','Hay seis mejoras ya escritas: valoren costo, tiempo y personal de 1 a 5','Marquen cuáles atacan el cuello de botella','Lean el nivel: ¿cuál aplicarían ya?'],listo:'En diez minutos tienen un orden de mejoras y pueden defenderlo.',min:15,n:'Pega el enlace de la matriz en el chat. Diez minutos en salas, cinco en plenaria.'},
 {sec:'Dinámica',k:'paso',kick:'Revelación',q:'¿Qué mejora quedó primero y dónde quedó el salario +10%?',h:'Cada sala, su primera mejora',a:'La preincorporación durante la espera y las metas progresivas salen con restricción baja y atacan el cuello. El salario +10% sale con restricción muy alta (COP 3.400 millones al año, toda la planilla) y no toca el cuello.',c:'La matriz no reemplaza el diagnóstico: ordena lo que el diagnóstico ya justificó. Una mejora fácil que no ataca el cuello no cambia el resultado.',min:5},
 {sec:'Consultoría 1',k:'sprint',br:'Ahora su empresa. Primero, cómo debería funcionar el proceso.',kick:'Consultoría 1 · en equipos',title:'El proceso futuro',steps:['De cada causa raíz de su Ishikawa, una o dos mejoras que cambien el proceso','Apliquen ECRS: ¿qué eliminan, combinan, reordenan o simplifican?','Dibujen el proceso futuro junto al actual: menos esperas, menos traspasos','Marquen dónde usarían IA y con qué color del semáforo'],listo:'Cada mejora responde a una causa raíz validada, y el dibujo muestra qué cambia.',min:55,out:'Diapositiva 5: proceso rediseñado',n:'Pregunta en cada sala: “¿esto cambia el proceso o agrega un programa?”. Plantilla del lienzo en Materiales.'},
 {sec:'Pausa',k:'brk',min:15},
 {sec:'Consultoría 2',k:'sprint',br:'Volvemos. ¿Cuáles de esas mejoras se pueden implementar de verdad?',kick:'Consultoría 2 · en equipos',title:'Matriz de restricciones de su caso',tool:'matriz',steps:['Sus causas y valoraciones del sábado ya están en la matriz: revísenlas','Ajusten las mejoras a la luz del proceso futuro','Revisen la valoración de 1 a 5 en costo, tiempo y personal','Lean el nivel y decidan: aplicar ya, por fases o postergar','Pidan la revisión del socio (Claude) y ajusten lo que no puedan defender'],listo:'Saben qué mejoras van primero y pueden explicar por qué las otras esperan.',min:45,out:'Diapositiva 5: mejoras priorizadas',n:'Los pesos ya están fijos en la herramienta: costo 40%, tiempo 30%, personal 30%.'},
 {sec:'Consultoría 3',k:'sprint',br:'Con las mejoras priorizadas, el plan.',kick:'Consultoría 3 · en equipos',title:'Implementación y métricas',steps:['Hoja de ruta: fase 1 (restricción baja), fase 2 (media), fase 3 o descarte (muy alta)','Responsables, recursos y quién gana o pierde con el cambio','Tres métricas (proceso, resultado y experiencia) con línea base, meta y plazo','Pre-mortem: “es junio de 2027 y fracasó, ¿por qué?”, y un ajuste por causa'],listo:'Cada fase tiene responsable y cada métrica tiene línea base, meta y plazo.',min:40,out:'Diapositivas 6 y 7: implementación y métricas'},
 {sec:'Consultoría 3',k:'prompt',br:'Para el pre-mortem, una mirada externa.',kick:'Prompt · pre-mortem',title:'Que alguien intente tumbar su plan',pid:'premortem'},
 {sec:'Armado',k:'act',br:'Con todo construido, armen su exposición aquí y no a medianoche.',kick:'Equipos',title:'Armado de la exposición',steps:['Ordenen sus 8 diapositivas con todo lo construido en las cinco sesiones','Repartan quién expone cada parte','Anoten lo que falta y cómo lo cierran esta noche'],min:20,out:'Exposición completa en borrador'},
 {sec:'Consultorio',k:'big',br:'Antes de cerrar, sus dudas sobre la exposición de mañana.',kick:'Consultorio',text:'Sus <em>dudas y consultas</em>: sobre el caso, la exposición o la forma de trabajo.',sub:'Micrófono abierto o chat. Las dudas sobre su caso las vemos aquí o mientras los acompaño en sus salas.',min:15},
 {sec:'Cierre',k:'list',br:'Mañana presentan. Así será.',title:'La exposición final',items:[['Entrega','Borrador antes de las 7:00 a.m.; versión final antes de las 9:35 a.m.'],['Tiempo','Diez minutos de exposición y cinco de preguntas.'],['Preguntas','Desde un rol de dirección: gerencia general, finanzas, colaboradores.'],['Evaluación','La rúbrica que ya conocen.']]},
 {sec:'Cierre',k:'read1',br:'Y una última lectura, para no caer en los errores de siempre al implementar.',kick:'Lectura eje de la etapa 3',idx:2,min:5}
],
s6:[
 {sec:'Conversatorio',k:'cover',kick:'Etapa 3 · Rediseñar y convencer · Sesión 6 · Sábado 21 de noviembre',title:'Exposición final del caso',sub:'¿El rediseño convence a una dirección exigente?'},
 {sec:'Conversatorio',k:'read1',br:'Buenos días. Última lectura, último ajuste antes de exponer.',kick:'Conversatorio · lectura eje de la etapa 3',idx:2,min:20,n:'Cada equipo, un minuto: el error de Kotter que amenaza su implementación y cómo lo evita.'},
 {sec:'Teoría',k:'list',br:'Antes de exponer, cómo se convence a una dirección.',kick:'Avance teórico · 10 min',title:'Una exposición que convence',items:[['La respuesta primero','La recomendación arriba; después, por qué.'],['El costo de no hacer nada','Un número que la dirección entienda.'],['Lo que pidió el cliente','Y por qué proponen otra cosa, con evidencia.'],['Un plan por fases','Lo que va ya y lo que espera, según su matriz.'],['Cómo sabrán que funcionó','Tres métricas con línea base, meta y plazo.']],cls:'tight',n:'Es el principio de la pirámide (Minto): la conclusión arriba y los argumentos debajo.'},
 {sec:'Dinámica',k:'act',br:'Probemos si su mensaje se entiende en un minuto.',kick:'Dinámica guiada · plenaria',title:'Pitch de 60 segundos',steps:['Cada equipo, 60 segundos: problema, causa raíz, propuesta y un número','El grupo responde en el chat: “me convenció…” o “me faltó…”','Anoten lo que deben aclarar en la exposición'],min:15},
 {sec:'Consultoría',k:'sprint',br:'Último espacio de consultoría antes de exponer.',kick:'Consultoría final · en equipos',title:'Ensayo con la rúbrica',steps:['Revisen su exposición contra los seis criterios de la rúbrica','Ensayen con cronómetro: diez minutos exactos','Preparen respuestas a tres preguntas difíciles: finanzas, gerencia y colaboradores','Envíen la versión final antes de las 9:35'],listo:'Cada criterio de la rúbrica tiene una diapositiva que lo responde.',min:35,n:'Pasa por cada sala unos minutos y haz una pregunta difícil desde un rol.'},
 {sec:'Consultoría',k:'prompt',br:'Si quieren entrenar las preguntas difíciles:',kick:'Prompt · la junta directiva',title:'Que la dirección los ponga a prueba',pid:'junta'},
 {sec:'Pausa',k:'brk',min:15},
 {sec:'Reglas',k:'eval',br:'Recordemos las reglas antes de empezar.',title:'Exposición final',n:'Asigna roles para preguntar: gerencia general, finanzas, voz de los colaboradores.'},
 {sec:'Exposiciones',k:'act',br:'Comenzamos.',kick:'Exposiciones',title:'Exposiciones',steps:['Diez minutos de exposición','Cinco minutos de preguntas desde un rol de dirección','Un minuto para el cambio de equipo'],min:100,n:'Con 4 equipos sobran unos 35 minutos: úsalos para preguntas más profundas o retroalimentación en vivo.'},
 {sec:'Síntesis',k:'act',br:'Ya escuchamos a todos. ¿Qué aprendimos como grupo?',kick:'Plenaria',title:'Lo que convenció y lo que faltó',steps:['Lo que más convenció a la dirección','Lo que faltó con más frecuencia','Una pregunta que nadie respondió bien'],min:20},
 {sec:'Síntesis',k:'list',br:'Si tuviera que resumir estas tres semanas en hábitos, serían estos.',title:'Cinco hábitos del gerente de personas con mirada de procesos',items:[['Proceso antes que programa','Pide el mapa antes de aprobar la iniciativa.'],['Busca la fila','Pregunta dónde espera el caso.'],['Declarado no es observado','Contrasta lo que la gente dice con lo que hace.'],['Evidencia antes que moda','Revisa qué dicen los estudios antes de copiar.'],['La IA analiza, tú decides','Nunca delegues una decisión sobre personas.']]},
 {sec:'Síntesis',k:'quote',br:'Y volvemos a donde empezamos:',text:'Gerenciar personas también es diseñar operaciones.',by:'La idea de la primera tarde, tres semanas después'},
 {sec:'Consultorio',k:'big',br:'Antes de despedirnos, sus preguntas: sobre la nota, la retroalimentación o lo que venga.',kick:'Consultorio',text:'Sus <em>dudas y consultas</em>: sobre el caso, la exposición o la forma de trabajo.',sub:'Micrófono abierto o chat. Las dudas sobre su caso las vemos aquí o mientras los acompaño en sus salas.',min:10},
 {sec:'Cierre',k:'act',br:'Una última tarea, solo para ustedes.',kick:'Cierre',title:'Carta a mi yo de 90 días',steps:['¿Qué habrá cambiado en un proceso de mi organización?','¿Qué número lo demostrará?'],min:10},
 {sec:'Cierre',k:'cover',kick:'Gracias',title:COURSE,sub:'Mg. Alexis Paúl Salinas Rojas · apsalinas@ucsp.edu.pe'}
]};

 ishikawa:{n:'Ishikawa asistido',e:'Etapa 2',url:'https://apsalinas-bot.github.io/UNISABANA-MAE-GERENCIA-PERSONAS/sabana-ishikawa.html',p:'Sugiere causas por espina, dibuja el diagrama, marca la evidencia de cada causa y hace de abogado del diablo.'},
 matriz:{n:'Matriz de restricciones',e:'Etapa 3',url:'https://apsalinas-bot.github.io/UNISABANA-MAE-GERENCIA-PERSONAS/sabana-matriz.html',p:'Trae solas las causas del Ishikawa; cada mejora se valora de 1 a 5 en costo, tiempo y personal y la escala de restricción se calcula sola.'}

  for(let w=0;w<=13;w++)if(w%2===0||w===13)g+=`<text x="${xs(w)}" y="${y1+20}" text-anchor="middle" font-size="12" fill="var(--ch-text)">${w}</text>`;

  g+=ln(SURV.centro,'var(--ch-b)',2.5)+ln(SURV.norte,'var(--ch-c)',2.5)+ln(SURV.sur,'var(--ch-a)',3.5);

  lg.forEach(([c,t,step])=>{g+=`<rect x="${lx}" y="${H-12}" width="12" height="12" rx="2" fill="${c}"/><text x="${lx+18}" y="${H-2}" font-size="12.5" fill="var(--ch-text)">${t}</text>`;lx+=step;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Permanencia por sede">${g}</svg>`;
}
function barsSVG(rows,max,lx,unit,hiFn){
  const W=640,rowH=32,H=rows.length*rowH+16,bx=lx+8,bw=W-bx-60;let g='';
  rows.forEach(([n,d],i)=>{const y=8+i*rowH,hi=hiFn(n,i),w=bw*d/max;
    g+=`<text x="${lx}" y="${y+19}" text-anchor="end" font-size="13" fill="var(--ch-text)"${hi?' font-weight="700"':''}>${n}</text><rect x="${bx}" y="${y+5}" width="${w}" height="20" rx="3" fill="${hi?'var(--ch-hi)':'var(--ch-c)'}" opacity="${hi?1:.75}"/><text x="${bx+w+8}" y="${y+19}" font-size="13" font-family="JetBrains Mono, monospace" fill="var(--ch-text)">${d}${unit}</text>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

function simBind(p,root){const g=id=>root.querySelector('#'+p+id);const calc=()=>{const d=+g('d').value,c=+g('c').value,s=+g('s').value;g('dv').textContent=d;g('cv').textContent=c;g('sv').textContent=s;
  const cap=c*s*(365/12/14),rho=d/cap;g('cap').textContent=Math.round(cap);g('u').textContent=Math.round(rho*100)+'%';const ga=g('g');ga.classList.remove('warn','bad');ga.querySelector('i').style.width=Math.min(100,rho*100)+'%';
  if(rho>=1){g('w').textContent='∞';g('q').textContent='crece';g('a').textContent='> 60%';ga.classList.add('bad');g('m').textContent='Entra más gente de la que la formación puede atender: la fila crece cada mes.';return;}
  const W=0.4*rho/(1-rho);g('w').textContent=W.toFixed(1);g('q').textContent=Math.round(d/30.4*W);g('a').textContent=Math.min(60,1.5*W).toFixed(0)+'%';
  if(rho>0.9){ga.classList.add('warn');g('m').textContent='Zona crítica: cerca del 100% de utilización, cada pequeño aumento de demanda multiplica la espera.';}
  else if(rho>0.8){ga.classList.add('warn');g('m').textContent='Utilización alta: la espera ya depende de la variabilidad de la demanda.';}
  else g('m').textContent='Holgura suficiente: la espera se mantiene en pocos días.';};
  ['d','c','s'].forEach(k=>g(k).addEventListener('input',calc));calc();}

document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return;}

document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.store;if(k)store(k,e.target.checked?'1':'0');});

function slideHTML(s){const k=s.kick?`<div class="kick">${s.kick}</div>`:'',br=s.br?`<p class="bridge">${s.br}</p>`:'';
 switch(s.k){

  case 'act':return `<div class="sl">${br}<span class="badge">${s.kick} · ${s.min} min</span><h2>${s.title}</h2>${itemsHTML(s.steps)}${s.out?`<div class="outbox"><b>Avance:</b> ${s.out}</div>`:''}</div>`;

  case 'reform':return `<div class="sl tight">${br}${k}<h2>${s.title}</h2><div class="reform">${s.items.map(([a,b])=>`<div><span>${a}</span><i>${b}</i></div>`).join('')}</div><p class="hint">R para revelar</p></div>`;
  case 'chart':return `<div class="sl">${br}${k}<h2>${s.title}</h2><div class="chartbox">${CHARTS[s.chart]()}</div>${s.note?`<p class="note2">${s.note}</p>`:''}</div>`;
  case 'nums':return `<div class="sl center">${br}${k}<h2>${s.title}</h2><div class="numsg">${s.nums.map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join('')}</div></div>`;

  case 'eval':return `<div class="sl">${br}<h2>${s.title}</h2><div class="rcols"><div><h3>Qué presentan</h3><ol><li>Sábado 21, en equipos de 2 a 3</li><li>10 minutos de exposición y 5 de preguntas</li><li>Máximo 8 diapositivas</li><li>Nota de 0,0 a 5,0; los avances no se califican</li></ol></div><div><h3>Rúbrica</h3><div class="rw">${RUBRIC.map(([c,w])=>`<div><b>${w}%</b><span>${c}</span></div>`).join('')}</div></div></div></div>`;
  case 'empresas':return `<div class="sl">${br}<h2>${s.title}</h2><div class="rcols"><div><h3>Tres casos</h3><div class="rw">${CASES.map(c=>`<div style="grid-template-columns:1fr"><span><b style="color:#0b2447;font-family:var(--body)">${c.nombre.replace(' S.A.S.','')}</b><br>${c.proceso}</span></div>`).join('')}</div></div><div><h3>Cómo trabajamos</h3><ol><li><b>Interpretar:</b> lo que el caso no diga, se declara como supuesto.</li><li><b>Avanzar acompañados:</b> los acompaño en sus salas como asesor de la consultora.</li><li><b>Cuestionar el encargo:</b> el cliente pide una solución; ustedes deciden si es la correcta.</li><li><b>Ayudarse entre consultoras:</b> al cierre de cada sesión, un espacio abierto para comentarios y sugerencias.</li></ol></div></div></div>`;
  case 'guia':return `<div class="sl tight">${br}<h2 class="wide">${s.title}</h2><div class="gsl">${GUIA.map((g,i)=>`<div><span class="n">${i+1}</span><b>${g[0]}</b><em>${g[1]}</em><span class="q">${g[2]}</span></div>`).join('')}</div><p class="sub" style="font-size:1.55cqw;margin-top:auto">${GUIA_CIERRE}</p></div>`;
  case 'caso1':{const c=CASES[s.ci];return `<div class="sl">${br}<div class="kick">${c.ciudad} · ${c.sector}</div><h2 class="wide">${c.nombre}</h2><div class="cgrid"><div><h3>Cliente</h3><p><b>${c.cliente[0]}</b><br>${c.cliente[1]}</p><h3>Proceso</h3><p>${c.proceso}</p></div><div><h3>La situación</h3><p>${c.contexto}</p></div></div><div class="ask"><span>Lo que pide el cliente</span>${c.encargo}</div></div>`;}
  case 'paso':return `<div class="sl paso">${br}${s.tl?`<div class="ptl">${[['Día 0','buscan a alguien'],['Día 10','se postula'],['Día 19','entrevistas'],['Día 22','le dicen que quedó'],['Día 29','exámenes y papeles'],['Día 41','sigue esperando'],['Días 42–56','capacitación'],['Día 57','empieza a trabajar']].map(([d,t])=>`<span><b>${d}</b>${t}</span>`).join('')}</div>`:''}<span class="badge">${s.kick} · ${s.min} min</span><p class="claim">${s.q}</p><p class="hint">${s.h||'Respondan en el chat'} · respondan en el chat · R para revelar</p>${fbBox('Lo que dice el grupo','Escribe aquí lo que responden…')}<div class="verdict"><span class="tag" style="color:#0b4da2">Respuesta</span><p>${s.a}</p>${s.c?`<p class="crit"><b>Criterio:</b> ${s.c}</p>`:''}</div></div>`;
  case 'sprint':{const a=s.tool?APPS[s.tool]:null;return `<div class="sl">${br}<span class="badge${/Dinámica/.test(s.kick)?'':' cn'}">${s.kick} · ${s.min} min</span><h2 class="wide">${s.title}</h2><div class="spg"><div>${itemsHTML(s.steps)}</div><div class="spside${s.tool2?' two':''}">${[a,s.tool2?APPS[s.tool2]:null].filter(Boolean).map(t=>`<div class="tool"><span>${t.e} · herramienta</span><b><a href="${t.url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;text-decoration-color:#f2b91f;text-underline-offset:.3cqw">${t.n}</a></b><a class="turl" href="${t.url}" target="_blank" rel="noopener">${t.url.replace(/^https:\/\/([^/]+)\/.*\/([^/]+)$/,'$1/…/$2')}</a><a class="rbtn" href="${t.url}" target="_blank" rel="noopener">Abrir ↗</a></div>`).join('')}${s.listo?`<div class="listo"><b>Listo cuando</b>${s.listo}</div>`:''}</div></div>${s.out?`<div class="outbox"><b>Avance:</b> ${s.out}</div>`:''}</div>`;}
  case 'prompt':{const p=PR[s.pid];return `<div class="sl">${br}<span class="badge">${s.kick}</span><h2 class="wide">${s.title}</h2><pre class="pbox">${escT(p[1])}</pre><div class="pact"><button class="rbtn" data-pcopy="${s.pid}">Copiar prompt completo</button><small>Pégalo en el chat de la sesión. Funciona en Claude, ChatGPT o Gemini.</small></div></div>`;}
  case 'pesos':return `<div class="sl">${br}<h2>${s.title}</h2><div class="pesos">${Object.entries(PESOS).map(([id,p])=>`<div class="prow"><b>${p.n}</b>${[['inv','Costo'],['tie','Tiempo'],['per','Personal']].map(([x,l])=>`<div class="pcell"><span>${l}</span><div class="ptrk"><i style="width:${p[x]}%"></i></div><em>${p[x]}%</em></div>`).join('')}</div>`).join('')}</div><p class="note2" style="margin-top:auto">Los fija el cliente y suman 100%. Ya están cargados en la matriz de restricciones.</p></div>`;
  case 'read1':{const r=READ[s.idx];return `<div class="sl">${br}<span class="badge">${s.kick} · ${s.min} min</span><p class="readref"><a class="refa" href="${r.link}" target="_blank" rel="noopener">${r.ref}</a> <a class="rbtn inline" href="${r.link}" target="_blank" rel="noopener">${r.lab.startsWith('PDF')?'Abrir PDF':'Abrir lectura'} ↗</a></p><p class="sub" style="font-size:1.7cqw;color:#0b2447"><b>Para qué:</b> ${r.para}</p><div class="rcols"><div><h3>Preguntas guía</h3><ol>${r.qs.map(q=>`<li>${q}</li>`).join('')}</ol></div><div><h3>Conversatorio</h3><p>${r.din}</p></div></div></div>`;}
 }return '';}
const fmtClock=sec=>{const n=sec<0;sec=Math.abs(sec);return(n?'−':'')+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');};
function paintTimer(){const c=$('#timerchip'),b=$('#bigclock');if(c){c.textContent=fmtClock(D.left);c.classList.toggle('run',D.run&&D.left>=0);c.classList.toggle('over',D.left<0);}if(b)b.textContent=fmtClock(D.left);}
function stopTimer(){clearInterval(D.timer);D.timer=null;D.run=false;}
function toggleTimer(){const s=DECKS[D.id][D.i];if(!s.min)return;if(D.run)stopTimer();else{D.run=true;D.timer=setInterval(()=>{D.left--;paintTimer();},1000);}paintTimer();}
function railHTML(L,cur){const secs=[...new Set(L.map(x=>x.sec))];return `<div class="rail">${secs.map(x=>`<span class="${x===cur?'on':''}">${x}</span>`).join('')}</div>`;}
function render(dir){const L=DECKS[D.id],s=L[D.i],nx=L[D.i+1];stopTimer();stage.classList.remove('rev');
  stage.innerHTML=`<div class="navzone l" data-nav="-1"></div><div class="navzone r" data-nav="1"></div><div class="slwrap ${dir<0?'back':''}">${slideHTML(s)}</div>${s.min&&s.k!=='brk'?'<div class="timerchip" id="timerchip"></div>':''}${s.k!=='cover'?railHTML(L,s.sec):''}<div class="pagenum">${D.id==='curso'?'Curso':'S'+D.id.slice(1)} · ${D.i+1}/${L.length}</div>`;
  D.left=(s.min||0)*60;paintTimer();$('#dCount').textContent=`${D.i+1} / ${L.length}`;
  $('#dNotesBox').innerHTML=`<b>Diapositiva ${D.i+1} · ${s.sec}.</b> ${s.n||''}${nx&&nx.br?`<div class="nx">Para pasar a la siguiente: «${nx.br}»</div>`:''}`;
  $('#dRev').hidden=!(s.k==='myth'||s.k==='reform'||s.k==='paso');$('#dTimer').hidden=!s.min;
  if(s.k==='sim')simBind('sd',stage);store('deck-'+D.id,String(D.i));
  stage.querySelectorAll('[data-fb]').forEach(el=>el.addEventListener('input',()=>store(el.dataset.fb,el.innerText)));
  stage.querySelectorAll('[data-vote]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();const v=votes(),l=el.dataset.vote;v[l]=Math.max(0,(v[l]||0)+(ev.shiftKey?-1:1));store('poll-'+D.id+'-'+D.i,JSON.stringify(v));
    const mx=Math.max(1,...Object.values(v));stage.querySelectorAll('[data-vote]').forEach(o=>{const n=v[o.dataset.vote]||0;o.querySelector('.vc').textContent=n;o.style.setProperty('--w',Math.round(n/mx*100)+'%');});}));}
function go(n){const L=DECKS[D.id].length,j=Math.max(0,Math.min(L-1,D.i+n));if(j===D.i)return;D.i=j;render(n);}
function openDeck(id){D.id=id;const v=parseInt(store('deck-'+id)||'0',10);D.i=isNaN(v)?0:Math.min(v,DECKS[id].length-1);deck.hidden=false;document.body.style.overflow='hidden';render(1);}
function closeDeck(){stopTimer();deck.hidden=true;document.body.style.overflow='';if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});}
function toggleNotes(){const b=$('#dNotesBox');b.hidden=!b.hidden;deck.classList.toggle('notes-open',!b.hidden);}
function toggleFull(){try{if(document.fullscreenElement)document.exitFullscreen();else deck.requestFullscreen().catch(()=>{});}catch(e){}}
stage.addEventListener('click',e=>{const pc=e.target.closest('[data-pcopy]');if(pc){e.stopPropagation();const t=PR[pc.dataset.pcopy][1];(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{pc.textContent='Copiado ✓';setTimeout(()=>pc.textContent='Copiar prompt completo',1800);}).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');pc.textContent='Copiado ✓';}catch(x){pc.textContent='No se pudo copiar';}ta.remove();});return;}const z=e.target.closest('[data-nav]');if(z)go(+z.dataset.nav);});
$('#dPrev').onclick=()=>go(-1);$('#dNext').onclick=()=>go(1);$('#dRev').onclick=()=>stage.classList.toggle('rev');$('#dTimer').onclick=toggleTimer;$('#dNotes').onclick=toggleNotes;$('#dFull').onclick=toggleFull;$('#dClose').onclick=closeDeck;
document.addEventListener('keydown',e=>{if(deck.hidden)return;if(e.target.matches('input,textarea,[contenteditable]')){if(e.key==='Escape')e.target.blur();return;}
  const k=e.key.toLowerCase();if(k==='arrowright'||k===' '||k==='pagedown'){e.preventDefault();go(1);}else if(k==='arrowleft'||k==='pageup'){e.preventDefault();go(-1);}
  else if(k==='r')stage.classList.toggle('rev');else if(k==='t')toggleTimer();else if(k==='n')toggleNotes();else if(k==='f')toggleFull();else if(k==='escape')closeDeck();else if(k==='home'){D.i=0;render(-1);}});
let tx=null;stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)go(dx<0?1:-1);tx=null;});
route();
</script>
