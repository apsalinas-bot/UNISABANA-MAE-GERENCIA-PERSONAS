<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Consultoría y Rediseño de Procesos en la Gestión de Personas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: plano de procesos sobrio. Barra de pestañas fija, columna de 1000px; el modo presentación es un escenario 16:9 con paleta propia para proyectar. */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --ink:#0b2447; --muted:#51607a; --line:#d7deea; --grid:#e8edf5;
  --accent:#0b4da2; --accent-soft:#e4edf9; --signal:#a67800; --signal-soft:#fbf1d2; --ok:#1d7552; --ok-soft:#e1f1e9;
  --pause:#7a8497; --pause-soft:#edf0f4;
  --ch-a:#c99400; --ch-b:#8a93a5; --ch-c:#0b4da2; --ch-grid:#d7deea; --ch-text:#51607a; --ch-hi:#c99400;
  --cons:#6b3fa0; --cons-soft:#efe7f8; --navy:#0b2447; --gold:#f2b91f; --navy-2:#12305c; --gold:#f2b91f; --on-navy:#eaf0f8; --on-navy-muted:#afc0da;
  color-scheme:light;
  --display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{font-family:var(--display);font-weight:800;font-size:15px;white-space:nowrap}
.brand span{color:var(--signal)}
.brand{font-family:var(--display)!important;font-weight:700!important}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid transparent;background:none;color:var(--muted);padding:6px 11px;border-radius:8px;white-space:nowrap;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink);background:var(--bg)}
.tab[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}
.tab .d{font-family:var(--mono);font-weight:400;font-size:11.5px;opacity:.8}
.dot{width:7px;height:7px;border-radius:50%;background:var(--signal);display:inline-block}

main{padding-block:28px 80px}
section.view{display:flex;flex-direction:column;gap:34px}
.block{display:flex;flex-direction:column;gap:14px}
.block>h2{font-size:22px;font-weight:800}
.block>.lead{color:var(--muted);max-width:66ch}

.hero{border-radius:16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-top:5px solid var(--gold,#f2b91f);padding:clamp(24px,4.5vw,44px);position:relative;overflow:hidden}
.hero .label{color:var(--signal)}
.hero .thesis{color:var(--muted)!important}
.hero .thesis b{color:var(--ink)!important}
.hero .pill{background:var(--bg);border-color:var(--line);color:var(--ink)}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;border:26px solid var(--gold,#f2b91f);opacity:.16;pointer-events:none}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;opacity:.5;pointer-events:none}
.hero h1{font-size:clamp(30px,5vw,50px);font-weight:700;letter-spacing:-.01em;max-width:18ch;margin-top:12px;color:var(--ink)}
.hero .thesis{margin-top:14px;font-size:clamp(16px,2vw,18px);max-width:58ch;color:var(--muted)}
.hero .thesis b{color:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:500}

.route{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.stop{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:6px;position:relative}
.stop:hover{border-color:var(--accent)}
.stop .num{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stop h3{font-size:16px}
.stop .adv{font-size:12.5px;color:var(--ok);font-weight:600;line-height:1.35}
.stop .when{font-family:var(--mono);font-size:12px;color:var(--accent);margin-top:auto;padding-top:4px}
.stop.today{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
.stop .flag{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:700;color:var(--signal);letter-spacing:.08em;text-transform:uppercase}
@media (max-width:900px){.route{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.route{grid-template-columns:repeat(2,minmax(0,1fr))}}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:17px;font-weight:700}
.card p,.card li{font-size:14px}
.card ul,.card ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.card .muted{color:var(--muted)}

.eval{border:1px solid var(--accent);border-radius:14px;background:var(--accent-soft);padding:clamp(18px,3vw,26px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px}
@media (max-width:760px){.eval{grid-template-columns:minmax(0,1fr)}}
.eval h3{font-size:clamp(20px,2.6vw,26px);font-weight:800}
.eval .facts{display:flex;flex-direction:column;gap:8px}
.fact{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;font-size:14px;border-top:1px solid var(--line);padding-top:8px}
.fact b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:420px){.fact{grid-template-columns:minmax(0,1fr);gap:2px}}

.stage-card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stage-card h3{font-size:24px;font-weight:700}
.block>h2{font-weight:700!important;font-size:24px!important}
.stage-card .sq{font-size:14.5px;color:var(--muted)}
.sbtns{display:flex;flex-direction:column;gap:8px}
.sbtn{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.sbtn:hover{border-color:var(--accent)}
.sbtn .mono{font-size:12px;color:var(--accent)}
.sbtn b{font-size:14px}
.sbtn.today{border-color:var(--signal);background:var(--signal-soft)} .sbtn.today .mono{color:var(--signal)}
.eje{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.eje a{color:var(--accent);font-weight:600;font-size:13.5px}
.prod{font-size:13.5px;color:var(--ok);margin-top:auto}
.flowv{display:flex;flex-direction:column;gap:8px}
.tl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.tl-seg{padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;border-right:1px dashed var(--line);min-width:0}
.tl-seg:last-child{border-right:0}
.tl-head{display:flex;flex-direction:column;gap:2px}
.tl-head b{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.15}
.tl-track{display:flex;flex-direction:column;position:relative;padding-left:18px;gap:10px}
.tl-track::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:2px;background:var(--line)}
.tl-node{position:relative;text-align:left;background:none;border:0;padding:4px 0;color:var(--ink);display:flex;flex-direction:column;gap:1px}
.tl-node::before{content:"";position:absolute;left:-18px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl-node.today::before{background:var(--gold,#f2b91f);border-color:var(--signal)}
.tl-node:hover .tl-t{color:var(--accent);text-decoration:underline}
.tl-d{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600}
.tl-t{font-size:14px;font-weight:600;line-height:1.35}
.tl-hoy{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--signal)}
.tl-read{position:relative;background:var(--signal-soft);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.tl-read::before{content:"";position:absolute;left:-17px;top:13px;width:10px;height:10px;transform:rotate(45deg);background:var(--gold,#f2b91f)}
.tl-read span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--signal);width:100%}
.tl-read b{font-family:var(--display);font-size:16px}
.tl-para{width:100%;font-size:12.5px;color:var(--ink)}
.rlinks{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:12.5px}
.rlinks a{font-weight:600;color:var(--accent)}
.tl-read .note{font-size:11.5px;width:100%}
.sl .refa{color:inherit;text-decoration:none;border-bottom:1px dotted #8a97ad;position:relative;z-index:4}
.sl .refa:hover{color:#0b4da2}
.tl-read a{font-size:12.5px;font-weight:600;color:var(--accent)}
.tl-prod{font-size:13px;color:var(--ok);margin-top:auto}
@media (max-width:760px){.tl{grid-template-columns:minmax(0,1fr)}.tl-seg{border-right:0;border-bottom:1px dashed var(--line)}.tl-seg:last-child{border-bottom:0}}
.flowv .eje{border:0;border-radius:10px;background:var(--signal-soft);padding:12px;margin:0}
.flowv .eje .label{color:var(--signal)}
.conv{font-size:12.5px;color:var(--muted);padding-left:12px;border-left:2px solid var(--signal)}
.rit-page{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.rit-page .rrow{display:grid;grid-template-columns:150px minmax(0,1fr) 64px minmax(0,1.2fr);gap:14px;align-items:center}
.rit-page b{font-family:var(--display);font-size:16px}
.rit-page .trk{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.rit-page .trk i{display:block;height:100%;border-radius:6px}
.rit-page .mono{font-size:12.5px;color:var(--muted)}
.rit-page small{font-size:13px;color:var(--muted)}
@media (max-width:700px){.rit-page .rrow{grid-template-columns:110px minmax(0,1fr) 56px}.rit-page small{grid-column:1/-1;margin-top:-6px}}
.case{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:clamp(18px,3vw,26px);display:flex;flex-direction:column;gap:14px}
.case-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.case-h h3{font-size:22px;font-weight:800;margin:4px 0 2px}
.case p{font-size:14.5px;max-width:75ch}
.case blockquote{margin:0;border-left:3px solid var(--signal);padding:6px 0 6px 14px;font-size:15.5px;font-family:var(--display);font-weight:600;max-width:70ch}
.case ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.case details{border:1px dashed var(--line);border-radius:10px;padding:10px 14px}
.case details summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.case details[open] summary{margin-bottom:10px}
.case .behind{margin-top:10px;font-size:14px}
.case .behind b{color:var(--signal)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.rub{min-width:820px;font-size:13.5px}
table.rub td:first-child{font-weight:600;min-width:170px}
table.rub td:first-child span{display:block;font-family:var(--mono);font-weight:400;color:var(--accent);font-size:12.5px}

.reading{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.reading .when{font-family:var(--mono);font-size:12px;color:var(--signal);font-weight:600}
.reading .ref{font-size:14.5px;line-height:1.5}
.reading .why{font-size:13.5px;color:var(--muted)}
.reading ol{margin:0;padding-left:20px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.reading .dyn{font-size:13px;border-top:1px dashed var(--line);padding-top:8px}

/* sesión */
.s-head{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.s-head{grid-template-columns:minmax(0,1fr)}}
.s-title{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:clamp(20px,3vw,28px);display:flex;flex-direction:column;gap:12px}
.s-title h1{font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.02em}
.s-title .q{font-size:16.5px;max-width:54ch;color:var(--muted)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:9px;padding:10px 16px;font-weight:600;font-size:14.5px;align-self:flex-start}
.btn:hover{filter:brightness(1.08)}
.s-side{display:flex;flex-direction:column;gap:12px}
.box{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.box.ok{border-color:var(--ok);background:var(--ok-soft)} .box.ok .label{color:var(--ok)}
.box.rd{border-color:var(--signal);background:var(--signal-soft)} .box.rd .label{color:var(--signal)}

.ribbon{display:flex;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.ribbon div{min-width:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;overflow:hidden;white-space:nowrap;border-right:1px solid var(--surface)}
.ribbon div:last-child{border-right:0}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.t-expo{background:var(--accent-soft);color:var(--accent)} .t-din{background:var(--signal-soft);color:var(--signal)}
.t-taller{background:var(--ok-soft);color:var(--ok)} .t-pausa{background:var(--pause-soft);color:var(--pause)} .t-plen{background:var(--bg);color:var(--ink)}
.t-cons{background:var(--cons-soft);color:var(--cons)} .sw-cons{background:var(--cons)}
.sw-expo{background:var(--accent)} .sw-din{background:var(--signal)} .sw-taller{background:var(--ok)} .sw-pausa{background:var(--pause)} .sw-plen{background:var(--ink)}

.guion{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:16px;padding:13px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .time{font-family:var(--mono);font-size:13.5px;font-weight:600}
.row .time small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.row h3{font-size:15.5px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{font-family:var(--body);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px}
.row p{font-size:14px;color:var(--muted);margin-top:3px;max-width:72ch}
.row.pausa{background:var(--pause-soft)}
@media (max-width:520px){.row{grid-template-columns:minmax(0,1fr);gap:4px}}

details.prep{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.prep summary{padding:12px 16px;cursor:pointer;font-weight:600;font-size:14px}
details.prep .inner{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.cut{font-size:14px;color:var(--muted)} .cut b{color:var(--signal)}

.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.nums{grid-template-columns:repeat(2,minmax(0,1fr))}}
.numc{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px}
.numc b{display:block;font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.numc span{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body)}
.note{font-size:13px;color:var(--muted)}

.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:700px){.sim{grid-template-columns:minmax(0,1fr)}}
.sim label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:600}
.sim label span.v{font-family:var(--mono);color:var(--accent)}
.sim input[type=range]{width:100%;accent-color:var(--accent)}
.sim .ins{display:flex;flex-direction:column;gap:14px}
.sim .outs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.sim .o{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sim .o b{font-family:var(--mono);font-size:20px;display:block}
.sim .o span{font-size:12px;color:var(--muted)}
.gauge{grid-column:1/-1;height:10px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--ok);transition:width .2s}
.gauge.warn i{background:var(--signal)} .gauge.bad i{background:#c0392b}
.sim .msg{grid-column:1/-1;font-size:13.5px}

.copybox{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;min-width:0}
.copybox pre{margin:0;padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;color:var(--ink)}
.copybox .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
.copybox .bar b{font-size:13.5px}
.cbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:4px 10px;font-size:12.5px;font-weight:600;flex:none}
.cbtn.done{border-color:var(--ok);color:var(--ok)}

/* ===== modo presentación ===== */
#deck{position:fixed;inset:0;z-index:100;background:#e9eef5;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --ch-a:#8f6700; --ch-b:#6b7a93; --ch-c:#0b4da2; --ch-grid:#dfe6f0; --ch-text:#51607a; --ch-hi:#8f6700; color-scheme:light}
.stage-wrap{flex:1;display:grid;place-items:center;min-height:0;padding:10px}
.stage{width:min(calc(100vw - 20px),calc((100dvh - 86px) * 16 / 9));aspect-ratio:16/9;max-width:100%;container-type:inline-size;background:#ffffff;color:#0b2447;position:relative;overflow:hidden;border-radius:10px;
  background-image:linear-gradient(#eef2f8 1px,transparent 1px),linear-gradient(90deg,#eef2f8 1px,transparent 1px);background-size:3.2cqw 3.2cqw}
#deck.notes-open .stage{width:min(calc(100vw - 20px),calc((100dvh - 250px) * 16 / 9))}
.sl{position:absolute;inset:0;padding:5cqw 6cqw;display:flex;flex-direction:column;gap:1.6cqw;font-family:var(--body)}
.sl .kick{font-family:var(--mono);font-size:1.25cqw;letter-spacing:.14em;text-transform:uppercase;color:#8f6700}
.sl h1{font-family:var(--display);font-weight:800;font-size:5.6cqw;letter-spacing:-.025em;line-height:1.03;max-width:17ch}
.sl h2{font-family:var(--display);font-weight:800;font-size:3.3cqw;letter-spacing:-.015em;line-height:1.1;max-width:30ch}
.sl .sub{font-size:2cqw;color:#51607a;max-width:54ch;line-height:1.4}
.sl.cover,.sl.center{justify-content:center}
.sl.cover .bar{width:8cqw;height:.45cqw;background:#f2b91f;border-radius:1cqw}
.sl .foot{font-size:1.2cqw;color:#6b7a93;font-family:var(--mono);margin-top:3cqw}
.sl .bigtext{font-family:var(--display);font-weight:800;font-size:4.2cqw;line-height:1.13;letter-spacing:-.02em;max-width:25ch}
.sl .bigtext em{font-style:normal;color:#8f6700}
.sl ol.items{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1.2cqw;font-size:2cqw;line-height:1.35}
.sl .items li{display:grid;grid-template-columns:3.2cqw minmax(0,1fr);align-items:baseline}
.sl .items li::before{content:attr(data-n);font-family:var(--mono);font-size:1.3cqw;color:#0b4da2}
.sl .items b{color:#0b2447}
.sl .items .t{color:#3d4b63}
.sl .items.two{display:grid;grid-template-columns:1fr 1fr;column-gap:4cqw;row-gap:1.3cqw}
.sl.tight ol.items{gap:.85cqw;font-size:1.72cqw}
.sl .chain{display:flex;gap:.8cqw;margin-top:1cqw}
.sl .chain div{flex:1;border:1px solid #d5dde9;border-radius:.8cqw;padding:1.3cqw 1cqw;background:#f3f6fb;font-size:1.55cqw;font-weight:700;display:flex;flex-direction:column;gap:.6cqw}
.sl .chain div small{font-weight:400;color:#51607a;font-size:1.25cqw;line-height:1.3}
.sl .chain div span{font-family:var(--mono);color:#0b4da2;font-size:1.1cqw;font-weight:400}
.sl .split{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw;margin-top:1cqw}
.sl .split>div{border:1px solid #d5dde9;border-radius:1cqw;padding:2.2cqw;background:#f3f6fb;display:flex;flex-direction:column;gap:1cqw}
.sl .split h3{font-family:var(--display);font-size:2.3cqw}
.sl .split p{font-size:1.75cqw;color:#3d4b63;line-height:1.4}
.sl .split>div.hi{border-color:#8f6700} .sl .split>div.hi h3{color:#8f6700}
.sl .opts{display:grid;grid-template-columns:1fr 1fr;gap:1.4cqw;margin-top:1cqw}
.sl .opts div{border:1px solid #d5dde9;border-radius:1cqw;padding:1.6cqw 2cqw;background:#f3f6fb;font-size:1.9cqw;display:flex;gap:1.6cqw;align-items:baseline}
.sl .opts div b{font-family:var(--mono);color:#8f6700;font-size:2cqw}
.sl .badge{align-self:flex-start;font-family:var(--mono);font-size:1.25cqw;padding:.5cqw 1.1cqw;border-radius:.6cqw;background:#f2b91f;color:#0b2447;font-weight:600;letter-spacing:.05em}
.sl .badge.blue{background:#0b4da2}
.sl .outbox{margin-top:auto;border-left:.4cqw solid #1d7552;padding:.8cqw 1.4cqw;font-size:1.7cqw;background:#e6f4ee;border-radius:0 .8cqw .8cqw 0}
.sl .outbox b{color:#1d7552}
.sl .claim{font-family:var(--display);font-size:3.9cqw;font-weight:800;line-height:1.13;letter-spacing:-.02em;max-width:26ch}
.sl .verdict{border:1px solid #d5dde9;border-radius:1cqw;padding:1.8cqw 2.2cqw;background:#f3f6fb;display:flex;flex-direction:column;gap:.8cqw;opacity:0;transform:translateY(1cqw);transition:opacity .35s,transform .35s;margin-top:auto}
.sl .verdict .tag{font-family:var(--mono);font-size:1.4cqw;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.sl .verdict p{font-size:1.9cqw;line-height:1.4}
.sl .verdict small{font-size:1.3cqw;color:#51607a;font-family:var(--mono)}
.stage.rev .verdict{opacity:1;transform:none}
.sl .hint{font-size:1.2cqw;color:#6b7a93;font-family:var(--mono)}
.stage.rev .hint{visibility:hidden}
.sl .reform{display:flex;flex-direction:column;gap:1.05cqw}
.sl .reform div{display:grid;grid-template-columns:1fr 1.3fr;gap:2cqw;font-size:1.7cqw;border-bottom:1px solid #e1e7f0;padding-bottom:1cqw;align-items:baseline}
.sl .reform div i{font-style:normal;color:#8f6700;opacity:0;transition:opacity .35s}
.stage.rev .reform div i{opacity:1}
.sl .chartbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.sl .chartbox svg{max-height:100%;width:auto;max-width:100%}
.sl .note2{font-size:1.5cqw;color:#51607a}
.sl .quote{font-family:var(--display);font-size:4.4cqw;font-weight:800;line-height:1.1;letter-spacing:-.02em;max-width:22ch}
.sl .by{font-size:1.6cqw;color:#51607a;font-family:var(--mono)}
.sl .numsg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2cqw;margin-top:2cqw}
.sl .numsg div{border-top:.3cqw solid #8f6700;padding-top:1.2cqw}
.sl .numsg b{display:block;font-family:var(--display);font-size:4.6cqw;font-weight:800;letter-spacing:-.03em;line-height:1}
.sl .numsg span{font-size:1.55cqw;color:#3d4b63;display:block;margin-top:.8cqw;line-height:1.35}
.sl.brk{justify-content:center}
.sl.brk .bigclock{font-family:var(--mono);font-size:13cqw;font-weight:600;line-height:1;color:#8f6700}
.sl .sema{display:flex;flex-direction:column;gap:1.4cqw;margin-top:1cqw}
.sl .sema div{display:grid;grid-template-columns:2.2cqw 13cqw minmax(0,1fr);gap:1.6cqw;align-items:baseline;font-size:1.8cqw}
.sl .sema i{width:2cqw;height:2cqw;border-radius:50%;display:block;transform:translateY(.3cqw)}
.sl .sema b{font-family:var(--display);font-size:2.1cqw}
.sl .sema span{color:#3d4b63}
.sl .stg{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin-top:1.5cqw}
.sl .stg>div{border:1px solid #d5dde9;border-radius:1cqw;padding:2cqw;background:#f3f6fb;display:flex;flex-direction:column;gap:1cqw}
.sl .stg span{font-family:var(--mono);font-size:1.2cqw;letter-spacing:.12em;text-transform:uppercase;color:#8f6700}
.sl .stg h3{font-family:var(--display);font-size:2.5cqw;line-height:1.1}
.sl .stg p{font-size:1.6cqw;color:#3d4b63;line-height:1.35}
.sl .stg small{font-family:var(--mono);font-size:1.2cqw;color:#0b4da2}
.sl .stg em{font-style:normal;font-size:1.35cqw;color:#1c2d4a;border-top:1px solid #d5dde9;padding-top:1cqw;margin-top:auto}
.sl .readref{font-size:1.9cqw;line-height:1.45;border-left:.4cqw solid #8f6700;padding-left:1.6cqw;max-width:60ch}
.sl .readref i{color:#3d4b63}
.sl .rcols{display:grid;grid-template-columns:1fr 1fr;gap:3cqw;margin-top:1cqw}
.sl .rcols h3{font-family:var(--mono);font-size:1.25cqw;letter-spacing:.12em;text-transform:uppercase;color:#0b4da2;margin-bottom:1cqw;font-weight:600}
.sl .rcols p,.sl .rcols li{font-size:1.75cqw;line-height:1.4;color:#1c2d4a}
.sl .rcols ol{margin:0;padding-left:2.2cqw;display:flex;flex-direction:column;gap:.8cqw}
.sl .rtable{display:grid;grid-template-columns:auto 1fr auto;gap:.7cqw 2cqw;font-size:1.65cqw;align-items:baseline;margin-top:1cqw}
.sl .rtable span{color:#3d4b63} .sl .rtable b{font-family:var(--mono);color:#8f6700;font-weight:600}
.sl .simwrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:3cqw;font-size:1.7cqw}
.sl .simwrap label{display:flex;flex-direction:column;gap:.5cqw;font-weight:600}
.sl .simwrap label span.v{font-family:var(--mono);color:#0b4da2}
.sl .simwrap input[type=range]{width:100%;accent-color:#0b4da2}
.sl .simwrap .ins{display:flex;flex-direction:column;gap:2cqw}
.sl .simwrap .outs{display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw;align-content:start}
.sl .simwrap .o{border:1px solid #d5dde9;border-radius:.8cqw;padding:1cqw 1.3cqw;background:#f3f6fb}
.sl .simwrap .o b{font-family:var(--mono);font-size:2.6cqw;display:block}
.sl .simwrap .o span{font-size:1.25cqw;color:#51607a}
.sl .simwrap .gauge{height:1.1cqw;background:#f3f6fb;border:1px solid #d5dde9}
.sl .simwrap .msg{font-size:1.5cqw;color:#3d4b63}
.timerchip{position:absolute;top:2.4cqw;right:3cqw;font-family:var(--mono);font-size:2cqw;font-weight:600;padding:.5cqw 1.2cqw;border-radius:.7cqw;background:#f3f6fb;border:1px solid #d5dde9;color:#0b2447;z-index:3}
.timerchip.run{border-color:#1d7552;color:#1d7552}
.timerchip.over{border-color:#c0392b;color:#c0392b;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.pagenum{position:absolute;bottom:2.2cqw;right:3cqw;font-family:var(--mono);font-size:1.1cqw;color:#8a97ad;z-index:3}
.deckbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;padding:8px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));color:#3d4b63}
.deckbar button{background:#f3f6fb;border:1px solid #d5dde9;color:#0b2447;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600}
.deckbar button:hover{border-color:#0b4da2}
.deckbar .cnt{font-family:var(--mono);font-size:13px;min-width:70px;text-align:center}
.deckbar .sep{width:1px;height:22px;background:#d5dde9;margin:0 4px}
.notes{height:160px;overflow:auto;background:#ffffff;border-top:1px solid #d5dde9;color:#0b2447;padding:12px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));font-size:15px;line-height:1.55}
.notes b{color:#8f6700}
.navzone{position:absolute;top:0;bottom:0;width:16%;z-index:2;cursor:pointer}
.navzone.l{left:0}.navzone.r{right:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.sl{animation:slIn .5s cubic-bezier(.2,.7,.2,1)}
.slwrap.back .sl{animation-name:slBack}
@keyframes slIn{from{opacity:0;transform:translateX(2cqw)}to{opacity:1;transform:none}}
@keyframes slBack{from{opacity:0;transform:translateX(-2cqw)}to{opacity:1;transform:none}}
.sl .bridge{font-family:var(--display);font-style:italic;font-size:1.75cqw;line-height:1.35;color:#8f6700;max-width:62ch;opacity:.95;border-left:.3cqw solid #8f6700;padding-left:1.2cqw;margin-bottom:.4cqw}
.sl.center .bridge{margin-bottom:1.2cqw}
.sl h1,.sl h2,.sl .bigtext,.sl .claim,.sl .quote{font-family:var(--display)}
.sl h1{font-weight:700;letter-spacing:-.01em}
.sl h2{font-weight:700;letter-spacing:-.005em}
.sl .bigtext,.sl .claim,.sl .quote{font-weight:600;letter-spacing:-.01em}
.sl .bigtext em,.sl .quote em{font-style:italic}
.rail{position:absolute;left:6cqw;bottom:2cqw;display:flex;gap:.2cqw;z-index:3;flex-wrap:nowrap;max-width:82cqw;overflow:hidden}
.rail span{white-space:nowrap;font-family:var(--mono);font-size:.9cqw;letter-spacing:.06em;text-transform:uppercase;color:#8a97ad;padding:.25cqw .7cqw;border-radius:.4cqw;border:1px solid transparent}
.rail span.on{color:#0b2447;background:#f2b91f;font-weight:600}
.sl{padding-bottom:6.5cqw}
.sl .stg{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin-top:1cqw}
.sl .stg>div{border:1px solid #d5dde9;border-radius:1cqw;padding:1.8cqw;background:#f3f6fb;display:flex;flex-direction:column;gap:1cqw}
.sl .stg span{font-family:var(--mono);font-size:1.15cqw;letter-spacing:.12em;text-transform:uppercase;color:#8f6700}
.sl .stg h3{font-family:var(--display);font-size:2.3cqw;line-height:1.1}
.sl .stg p{font-size:1.4cqw;color:#3d4b63;line-height:1.35;margin-top:auto}
.sl .flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6cqw}
.sl .flow li{display:grid;grid-template-columns:6.5cqw 1fr;gap:1cqw;font-size:1.35cqw;line-height:1.3;color:#0b2447;padding:.7cqw .9cqw;border-radius:.6cqw;background:#ffffff}
.sl .flow li b{font-family:var(--mono);font-size:1.1cqw;color:#0b4da2;font-weight:600}
.sl .flow li.rd{background:#f2b91f;color:#0b2447;font-weight:600}
.sl .flow li.rd b{color:#0b2447}
.sl .flow li.rd small{grid-column:2;font-weight:400;font-size:1.15cqw;line-height:1.3;color:#0b2447;opacity:.85}
.sl .rit{display:flex;flex-direction:column;gap:1cqw;margin-top:1.5cqw}
.sl .rrow{display:grid;grid-template-columns:17cqw 28cqw 7cqw 1fr;gap:1.4cqw;align-items:center}
.sl .rrow b{font-family:var(--display);font-size:1.9cqw;font-weight:600}
.sl .rrow .trk{height:1.8cqw;background:#eef2f8;border-radius:.5cqw;overflow:hidden}
.sl .rrow i{display:block;height:100%;border-radius:.5cqw}
.sl .rrow span{font-family:var(--mono);font-size:1.3cqw;color:#0b4da2}
.sl .rrow small{font-size:1.4cqw;color:#3d4b63}
.sl .r-cons{background:#c9a7f2;color:#24113f}.sl .r-din{background:#f2b91f;color:#0b2447}.sl .r-taller{background:#8fd9b6;color:#082a1e}.sl .r-plen{background:#cfe0f6;color:#0b2447}.sl .r-pausa{background:#dfe6f0;color:#51607a}
.sl .rds{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin-top:1cqw}
.sl .rds>div{border-top:.35cqw solid #8f6700;padding-top:1.4cqw;display:flex;flex-direction:column;gap:.8cqw}
.sl .rds span{font-family:var(--mono);font-size:1.1cqw;letter-spacing:.08em;text-transform:uppercase;color:#0b4da2}
.sl .rds h3{font-family:var(--display);font-size:2.6cqw;line-height:1.05}
.sl .rds p{font-family:var(--display);font-style:italic;font-size:1.6cqw;color:#0b2447;line-height:1.3}
.sl .rds small{font-size:1.35cqw;color:#51607a;line-height:1.4}
.sl .rw{display:flex;flex-direction:column;gap:.7cqw}
.sl .rw div{display:grid;grid-template-columns:5cqw 1fr;font-size:1.7cqw;align-items:baseline;border-bottom:1px solid #e1e7f0;padding-bottom:.6cqw}
.sl .rw b{font-family:var(--mono);color:#8f6700}
.sl .simwrap{gap:2cqw;font-size:1.5cqw}
.sl .simwrap .ins{gap:1.2cqw}
.sl .simwrap .outs{gap:.8cqw}
.sl .simwrap .o{padding:.6cqw 1cqw}
.sl .simwrap .o b{font-size:2.1cqw}
.sl .simwrap .msg{font-size:1.3cqw}
.fbwrap{position:relative;z-index:4;display:flex;flex-direction:column;gap:.5cqw;margin-top:1.2cqw;width:100%;max-width:80cqw}
.fblbl{font-family:var(--mono);font-size:1cqw;letter-spacing:.1em;text-transform:uppercase;color:#8f6700}
.fb{min-height:5cqw;max-height:11cqw;overflow:auto;border:1.5px dashed #e3c76a;background:#fffbea;border-radius:.8cqw;padding:1cqw 1.3cqw;font-size:1.6cqw;line-height:1.4;color:#0b2447;outline:none;white-space:pre-wrap}
.fb:focus{border-style:solid;border-color:#f2b91f;box-shadow:0 0 0 .3cqw rgba(242,185,31,.25)}
.fb:empty::before{content:attr(data-ph);color:#8a97ad}
.sl .verdict .fbwrap{margin-top:.4cqw}.sl .verdict .fb{min-height:3cqw;max-height:6cqw;font-size:1.4cqw;padding:.6cqw 1cqw}
.sl .claim{font-size:3.3cqw!important}
.sl .verdict{padding:1.3cqw 1.8cqw!important;gap:.5cqw!important}
.sl .verdict p{font-size:1.55cqw!important;line-height:1.35!important}
.sl .verdict{margin-bottom:1cqw}
.sl .opts{position:relative;z-index:4}
.sl .opt{cursor:pointer;position:relative;overflow:hidden;user-select:none}
.sl .opt::after{content:"";position:absolute;left:0;bottom:0;height:.45cqw;width:var(--w,0%);background:#f2b91f;transition:width .25s}
.sl .opt .vc{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:2cqw;color:#0b4da2;font-weight:600}
.sl .opt:hover{border-color:#f2b91f}
.sl.stgsl{gap:1.2cqw}
.sl h2.wide{max-width:none}
.sl .stg{gap:1.6cqw!important;margin-top:.4cqw!important}
.sl .stg>div{padding:1.4cqw 1.5cqw!important;gap:.8cqw!important}
.sl .stg h3{font-size:2.1cqw!important}
.sl .flow{gap:.5cqw!important}
.sl .flow li{padding:.6cqw .8cqw!important;font-size:1.3cqw!important;align-items:baseline}
.sl .flow li.rd{row-gap:.4cqw}
.sl .flow li.rd .rt{font-weight:700;font-family:var(--body)}
.sl .flow li.rd small{grid-column:2;font-family:var(--body)!important;font-size:1.2cqw!important;line-height:1.3;opacity:.9}
.sl .rbtn{grid-column:2;justify-self:start;position:relative;z-index:5;display:inline-block;font-family:var(--body);font-size:1.2cqw;font-weight:700;color:#ffffff;background:#0b2447;border-radius:.6cqw;padding:.45cqw 1cqw;text-decoration:none;margin-top:.2cqw}
.sl .rbtn:hover{background:#0b4da2}
.sl .rbtn.inline{font-size:1.25cqw;vertical-align:middle;margin-left:.6cqw}
.sl .stg .flow li.rd .rt{font-family:var(--body);text-transform:none;letter-spacing:0;color:#0b2447;font-size:1.35cqw;font-weight:700}
.sl .opts{gap:1cqw!important}
.sl .opts div{padding:1cqw 1.6cqw!important;font-size:1.75cqw!important}
.sl .opts~.fbwrap .fb{min-height:3.2cqw;max-height:7cqw}
.sl .verdict .fb{min-height:2.6cqw!important}
.sl .hint{margin:0}
.sl .ptl{display:flex;flex-wrap:wrap;gap:.4cqw;margin-bottom:.4cqw}
.sl .ptl span{font-size:1.05cqw;color:#3d4b63;background:#f3f6fb;border:1px solid #d5dde9;border-radius:.4cqw;padding:.25cqw .6cqw}
.sl .ptl b{font-family:var(--mono);color:#0b4da2;margin-right:.35cqw}
.sl.paso .claim{font-size:2.9cqw!important;max-width:34ch}
.sl.paso .hint{font-size:1.4cqw;color:#51607a}
.sl.paso .crit{font-size:1.55cqw!important;border-top:1px solid #d5dde9;padding-top:.6cqw;color:#0b2447}
.sl.paso .crit b{color:#8f6700}
.sl.paso .fb{min-height:3cqw!important;max-height:5.5cqw!important}
.sl.paso .fbwrap{margin-top:.6cqw}
.sl.paso{gap:1cqw!important}

 {sec:'Caso de apertura',k:'chart',br:'Antes de que el comité decidiera, dos sedes probaron caminos distintos. Esto pasó.',title:'Agentes que siguen en la empresa, semana a semana',chart:'survival',note:'Norte subió el salario 10%: pasó de 41% a 39% de salida. Sur no tocó el salario y estructuró el acompañamiento en piso: 24%.',n:'Deja 10 segundos de silencio. Pregunta: “¿Qué ven? ¿En qué semanas se van?”. Respuesta: entre la 3 y la 6, justo cuando salen de la formación al piso. Luego: “Norte subió el salario y casi no cambió. ¿Qué hizo Sur?”. Sur: líder con 12 personas, tutor activo y metas recién desde la semana 5.'},
 {sec:'Caso de apertura',k:'split',br:'Si subir el salario casi no cambió nada, quizá la pregunta estaba mal planteada.',title:'Dos preguntas frente al mismo problema',a:{h:'Pregunta convencional',t:'¿Qué les pasa a las personas? ¿Por qué no se comprometen? ¿Cuánto más hay que pagarles?'},b:{h:'Pregunta del consultor',t:'¿Qué proceso está produciendo esta rotación, y dónde se forma su cuello de botella?'},hi:'b',q:'¿qué habría cambiado su voto?',n:'Pregunta abierta: ¿qué hubiera cambiado en su voto si la pregunta hubiera sido la segunda?'},
 {sec:'Discusión',k:'myth',br:'Decidimos a menudo con lo que parece obvio. Tres afirmaciones; la primera, sobre cómo elegimos personas.',kick:'Mito, evidencia o depende · 1 de 3',claim:'Las entrevistas no estructuradas predicen bien el desempeño en el puesto.',tag:'Mito',verdict:'Predicen poco. Las entrevistas estructuradas, con preguntas y criterios definidos, tienen una validez bastante mayor.',src:'Sackett, Zhang, Berry y Lievens (2022), Journal of Applied Psychology',n:'Votan, dos personas defienden su voto y recién revelas (R).'},
 {sec:'Discusión',k:'myth',br:'Segunda, sobre lo que contamos a los candidatos antes de contratarlos.',kick:'Mito, evidencia o depende · 2 de 3',claim:'Mostrar el trabajo tal como es antes de contratar reduce la rotación.',tag:'Evidencia',verdict:'Las vistas previas realistas tienen un efecto modesto pero consistente sobre la rotación temprana.',src:'Phillips (1998), Academy of Management Journal; Earnest, Allen y Landis (2011), Personnel Psychology'},
 {sec:'Discusión',k:'myth',br:'Y la tercera nos devuelve a Andes Contact.',kick:'Mito, evidencia o depende · 3 de 3',claim:'Si en la encuesta de salida la mayoría marca “salario”, el salario es la causa de la rotación.',tag:'Depende',verdict:'Es una razón declarada, no una causa demostrada. Hay que contrastarla con el comportamiento observado.',src:'Principio de triangulación de fuentes'},
 {sec:'Discusión',k:'list',br:'Lo que separa una opinión de un diagnóstico es de dónde sale la evidencia. Un consultor mira cuatro fuentes.',title:'Cuatro fuentes de evidencia',items:[['Organizacional','Los datos del propio proceso.'],['Grupos de interés','Lo que viven y dicen quienes pasan por él.'],['Científica','Lo que muestran los estudios rigurosos.'],['Experiencial','El juicio de profesionales con experiencia.']],n:'No expliques: pregunta. ¿Cuáles usó su organización en su última gran decisión de personas? Fuente: Barends, Rousseau y Briner (2014), CEBMa.'},
 {sec:'Discusión',k:'quote',br:'Y cuando un resultado se repite año tras año, no es mala suerte:',text:'Todo sistema está perfectamente diseñado para obtener los resultados que obtiene.',by:'Frase atribuida a Paul Batalden',n:'Silencio de unos segundos. Luego anuncia la pausa.'},
 {sec:'Pausa',k:'brk',min:15},
 {sec:'Auditoría',k:'act',br:'Volvemos. Ahora lo aplicamos a ustedes: cada uno trae una decisión real de su organización.',kick:'Salas de 3',title:'Auditoría de una decisión',steps:['Elige una decisión reciente de gestión humana de tu organización','4 minutos para exponerla; los otros dos la auditan durante 8 con la guía','Roles que rotan: facilitador, escriba, abogado del diablo','La sala elige un patrón común para la plenaria'],min:40,n:'Avisa por difusión a los 10, 20 y 30 minutos. Visita 3–4 salas: escucha, deja una pregunta, sal.'},
 {sec:'Auditoría',k:'list',br:'Esta es la guía para auditarla. También está en el tablero de cada sala.',title:'Seis preguntas para auditar una decisión',items:[['La decisión','¿Qué se decidió y quién decidió?'],['El problema','¿Qué buscaba resolver? ¿Estaba medido?'],['El supuesto','¿Qué tenía que ser cierto para que funcionara?'],['La evidencia','¿Qué fuentes se usaron? Verde, amarillo o rojo.'],['El faltante','¿Qué dato habría cambiado la decisión?'],['El proceso','¿Qué proceso estaba detrás del problema?']],cls:'tight'},
 {sec:'Auditoría',k:'act',br:'Volvamos juntos. No me cuenten casos: cuéntenme qué se repite.',kick:'Plenaria',title:'Patrones, no casos',steps:['Cada sala comparte un patrón en un minuto','Lo agrupamos en el tablero','Buscamos qué se repite entre industrias'],min:15,n:'Patrones esperables: solución antes que problema, copiar al líder del sector, medir el resultado y no el proceso.'},
 {sec:'Auditoría',k:'reform',br:'Esos patrones casi siempre empiezan con una queja mal formulada. Entrenemos el oído.',kick:'Reformula en 60 segundos',title:'De la queja a la pregunta sobre el proceso',items:[['“Los nuevos no se adaptan.”','¿Qué ocurre entre la firma del contrato y el día 30, y quién responde por cada paso?'],['“Los líderes no dan retroalimentación.”','¿En qué momento del ciclo debería ocurrir, con qué formato y qué lo impide?'],['“Nadie se postula a vacantes internas.”','¿Cómo circula la información de vacantes y qué aprobación frena la postulación?']],n:'Una queja a la vez, 60 segundos en el chat, lees 3–4 respuestas y al final R muestra las versiones.'},
 {sec:'Equipos',k:'act',br:'Ya tienen la mirada. Ahora, su encargo. Formemos los equipos.',kick:'Equipos de 2 a 3',title:'Su empresa y su encargo',steps:['Formamos equipos y cada uno recibe una empresa con lo que pide su cliente','Acuerden cómo trabajarán: roles, canal y horarios','Con solo el encargo: ¿qué sospechan que está pasando?','¿Qué necesitarían saber? Anoten sus primeras preguntas','El caso completo les llega hoy al cierre o esta noche'],min:50,out:'Una sospecha inicial y las preguntas del equipo',n:'En clase entrega solo el encargo (botón “Copiar encargo” en la pestaña Empresas). Máximo 2 equipos por empresa. Envía las fichas completas al cierre o esta noche.'},
 {sec:'Consultorio',k:'big',br:'Ya leyeron su caso y seguro aparecieron dudas. Este espacio es para eso.',kick:'Consultorio',text:'Sus <em>dudas y consultas</em>: sobre el caso, la exposición o la forma de trabajo.',sub:'Micrófono abierto o chat. Las preguntas al cliente van aparte y cuentan para el límite de la etapa.',min:15},
 {sec:'Cierre',k:'act',br:'Resueltas las dudas, escuchemos a cada equipo de consultores.',kick:'Un minuto por equipo',title:'Nuestro encargo en tres frases',steps:['Nuestra empresa es…','El cliente nos pide…','Sospechamos que el problema está en…'],min:15,n:'Anota las sospechas: mañana las contrastamos con Hammer.'},
 {sec:'Cierre',k:'read1',br:'Para mañana, una sola lectura. Es el eje de esta primera etapa.',kick:'Lectura eje de la etapa 1',idx:0,min:5},
 {sec:'Cierre',k:'cover',kick:'Mañana · Sábado 7 · 8:00 a.m.',title:'Conversatorio y levantamiento del proceso actual',sub:'Gracias por esta primera tarde.'}
],
s2:[
 {sec:'Conversatorio',k:'cover',kick:'Etapa 1 · Entender y levantar · Sesión 2 · Sábado 7 de noviembre',title:'Mapear el proceso actual',sub:'¿Cómo se ve el proceso de punta a punta y dónde se pierde valor?'},
 {sec:'Conversatorio',k:'read1',br:'Buenos días. Empezamos con la lectura eje de esta etapa.',kick:'Conversatorio · lectura eje de la etapa 1',idx:0,min:20,n:'Si no recibieron la lectura, pasa a la siguiente lámina y explica tú las tres ideas en 5 minutos. Luego vuelve a la pregunta 2 y que cada quien comparta un paso de su organización.'},
 {sec:'Conversatorio',k:'list',br:'De Hammer, tres ideas que usaremos hoy mismo.',title:'Antes de automatizar, rediseñar',items:[['Organizar por resultados','No por tareas ni por áreas.'],['Captar la información una vez','Y en la fuente.'],['Decidir donde se hace el trabajo','Con el control dentro del proceso.']]},
 {sec:'Camila',k:'list',br:'Antes de su empresa, practiquemos con una sola historia. No necesitan ser expertos en herramientas: solo miren cómo se ve un proceso completo.',kick:'Ejemplo · así se ve un proceso de punta a punta',title:'La incorporación en Andes Contact',items:[['Quién aporta','Reclutamiento, salud ocupacional, formación y el supervisor.'],['Qué entra','Una candidata aceptada, sus documentos y un cupo de formación.'],['Los pasos','Postula → entrevistas → oferta → exámenes → espera → formación → piso.'],['Qué sale','Una agente productiva que sigue en la empresa a los 90 días.'],['Para quién','El supervisor de campaña y el cliente del contact center.']],n:'Esto es un SIPOC, pero no hace falta nombrarlo. Un minuto y avanza.'},
 {sec:'Camila',k:'list',br:'Esta es la historia. Ahora la resolvemos juntos.',title:'Los 66 días de Camila',items:[['Día 0','La empresa decide que necesita contratar a alguien.'],['Día 10','Camila ve el aviso y se postula.'],['Día 19','Le hacen pruebas y tres entrevistas.'],['Día 22','Le dicen por WhatsApp que quedó.'],['Día 29','Va a los exámenes médicos y le vuelven a pedir los mismos papeles.'],['Día 41','Nadie la llama para empezar. Mientras espera, le ofrecen otro trabajo.'],['Días 42 al 56','Por fin empieza la capacitación, con 25 compañeros y casi sin práctica.'],['Día 57','Su primer día de trabajo real. Su jefa tiene 23 personas a cargo y ya le exigen metas.']],cls:'tight',n:'Cuéntalo como una historia, en primera persona si te sale natural: “Me llamo Camila…”. Luego, cuatro preguntas.'},
 {sec:'Camila',k:'paso',tl:1,br:'Primera pregunta. Miren el calendario de arriba.',kick:'Paso 1 de 4',q:'¿Cuántos días pasó Camila esperando, sin que nadie hiciera nada por ella?',h:'Busquen en el calendario los días en que no pasa nada',a:'Unos 19 días: esperó los exámenes (día 22 al 29) y esperó que la llamaran para empezar (día 29 al 41).',c:'Cada día de espera es un día en que la persona puede irse. En cualquier proceso, primero busca dónde se espera.',min:10},
 {sec:'Camila',k:'paso',tl:1,br:'Segunda pregunta. Ahora piensen en quién la atendió.',kick:'Paso 2 de 4',q:'¿Por cuántas áreas distintas pasó Camila antes de empezar a trabajar?',h:'Cuenten cada área que tuvo que ver con ella',a:'Por cinco áreas: selección, contratación, exámenes médicos, capacitación y su jefa.',c:'Cada vez que el caso cambia de manos se pierde información y tiempo. Menos traspasos, menos errores.',min:10},
 {sec:'Camila',k:'paso',tl:1,br:'Tercera pregunta. Pónganse en su lugar.',kick:'Paso 3 de 4',q:'¿En qué dos momentos Camila pudo pensar “mejor me voy”?',h:'Digan el día y qué estaba pasando',a:'El día 41, cuando le ofrecieron otro trabajo mientras esperaba. Y el día 57, cuando empezó sin apoyo y ya con metas.',c:'La gente no se va por un solo motivo: se va en los momentos en que el proceso la deja sola.',min:10},
 {sec:'Camila',k:'paso',tl:1,br:'Última pregunta. Ahora ustedes son el gerente.',kick:'Paso 4 de 4',q:'¿Qué cambiarían primero para que la próxima Camila se quede?',h:'Una sola cosa, la más importante',a:'Lo que hizo la sede Sur: no dejarla esperar sin noticias y acompañarla en sus primeras semanas.',c:'Antes de pagar más, revisa el proceso. A veces la solución no cuesta dinero, sino organizarse mejor.',min:15},
 {sec:'Camila',k:'big',br:'Hay un dato que no les conté.',text:'Camila renunció en la <em>semana 5</em>. La causa no estaba en ella: estaba en el proceso.',min:5},
 {sec:'Camila',k:'chart',br:'Y así lo vivió ella.',kick:'Lo que vive la persona',title:'La curva emocional de Camila',chart:'journey',note:'Los momentos que definen si alguien se queda están en los valles: la espera sin noticias y las primeras semanas en piso.',n:'Cierra: “Estas mismas cuatro preguntas las harán hoy con su empresa”. Anuncia el break.'},
 {sec:'Pausa',k:'brk',min:30},
 {sec:'Los casos',k:'empresas',br:'Volvemos. Ya practicaron con Camila; ahora, su encargo real.',title:'Seis empresas, seis encargos',n:'Un minuto por empresa: ciudad, proceso y lo que pide el cliente. Luego envía a cada equipo su ficha completa por el chat (botón “Copiar ficha completa”).'},
 {sec:'Los casos',k:'act',br:'Les acabo de enviar su ficha completa. Primero, entiendan el encargo.',kick:'Equipos',title:'Lean su caso y llenen la ficha del encargo',steps:['Lean la ficha completa de su empresa','Llenen la ficha del encargo (pestaña Materiales)','Redacten su pregunta operacional: ¿qué en el proceso de ___ produce ___?'],min:20,out:'Diapositiva 1: el encargo y la pregunta operacional'},
 {sec:'Taller',k:'act',br:'Con el encargo claro, hagan con su empresa lo mismo que hicimos con Camila.',kick:'Equipos',title:'El proceso actual de su empresa',steps:['Dibujen los pasos en orden y quién hace cada uno','¿Dónde espera el caso? ¿Cuántas veces cambia de manos?','¿En qué momentos se pierde a la persona?','Lo que no sepan: supuesto explícito o pregunta al cliente'],min:45,out:'Diapositiva 2: proceso actual'},
 {sec:'Consultorio',k:'big',br:'Seguro aparecieron dudas con el caso. Este espacio es para eso.',kick:'Consultorio',text:'Sus <em>dudas y consultas</em>: sobre el caso, la exposición o la forma de trabajo.',sub:'Micrófono abierto o chat. Las preguntas al cliente van aparte y cuentan para el límite de la etapa.',min:15},
 {sec:'Cierre',k:'act',br:'Cerramos la primera etapa.',kick:'Cierre de la etapa 1',title:'Lo que ya tienen y lo que sigue',steps:['Dos equipos muestran su mapa en 3 minutos','Diapositivas 1 y 2 completas antes del viernes 13','Preguntas al cliente: hasta 3, por escrito, hasta el miércoles 11'],min:15}
],
s3:[
 {sec:'Apertura',k:'cover',kick:'Etapa 2 · Diagnosticar y validar · Sesión 3 · Viernes 13 de noviembre',title:'Encontrar el cuello de botella',sub:'¿Cuál es el cuello real del proceso y qué lo confirma o lo desmiente?'},
 {sec:'Apertura',k:'big',br:'Bienvenidos a la segunda etapa. Ya saben cómo es el proceso; ahora, dónde se rompe.',text:'Etapa 2: <em>diagnosticar y validar</em>.',sub:'Hoy buscamos el cuello de botella. Mañana lo ponemos a prueba con la evidencia.'},
 {sec:'Caso',k:'chart',br:'Volvamos a Andes Contact. Estos son los días que toma cada etapa.',kick:'Votación',title:'¿Dónde está el cuello de botella?',chart:'pipeline',note:'Días promedio por etapa.',min:3,n:'La mayoría vota la barra más larga.'},
 {sec:'Caso',k:'big',br:'La mayoría eligió la barra más larga. Miren de nuevo.',text:'La etapa más larga no es el cuello. El cuello está <em>donde se forma la fila</em>.',sub:'Doce días de espera antes de la formación: la formación no da abasto con lo que entra.'},
 {sec:'Caso',k:'big',br:'Y esa fila tiene un tamaño que se puede calcular.',kick:'Ley de Little',text:'Personas en espera = llegadas por día × días de espera',sub:'3,5 contrataciones por día × 12 días ≈ 42 personas con contrato firmado esperando. Cualquiera puede recibir otra oferta.'},
 {sec:'Caso',k:'list',br:'La espera es solo uno de los desperdicios que se esconden en gestión humana.',title:'Dónde se pierde valor sin que nadie lo vea',items:[['Esperas','Candidatos aceptados sin fecha de inicio.'],['Reprocesos','Documentos pedidos tres veces.'],['Sobreprocesamiento','Cinco entrevistas para un puesto operativo.'],['Talento no usado','Ideas de las personas que nadie recoge.']],n:'Pide a cada equipo un desperdicio de su empresa en el chat.'},
 {sec:'Caso',k:'sim',br:'Juguemos con la capacidad de formación. Ustedes deciden los cambios.',kick:'Simulador · modelo didáctico',title:'¿Qué pasa si cambiamos la capacidad?',min:10},
 {sec:'Detectives',k:'act',br:'Ya tienen las herramientas. Ahora investiguen el caso completo.',kick:'Rompecabezas',title:'Detectives del caso',steps:['Ronda 1 (15 min): cada sala analiza una pista','Ronda 2 (15 min): salas mixtas, con un experto de cada pista','Entregable: “El problema real es… porque…”'],min:35},
 {sec:'Detectives',k:'list',br:'Cada sala recibe una pista distinta.',title:'Las pistas',items:[['Pista A','Tiempos promedio por etapa.'],['Pista B','Permanencia por sede.'],['Pista C','Razones declaradas en la encuesta de salida.'],['Pista D','Cómo opera el piso en cada sede.']]},
 {sec:'Pausa',k:'brk',min:15},
 {sec:'Veredicto',k:'split',br:'Escuchemos los veredictos. Casi todos llegan a la misma tensión.',title:'Lo que dicen frente a lo que hacen',a:{h:'Lo que dicen',t:'38% marca “salario” en la encuesta de salida.'},b:{h:'Lo que hacen',t:'La sede que subió el salario casi no cambió. La que acompañó en piso bajó la salida de 41% a 24%.'},hi:'b'},
 {sec:'Veredicto',k:'big',br:'Si juntamos las pistas, la historia es otra.',text:'Dos cuellos encadenados: <em>capacidad de formación</em> y <em>acompañamiento en piso</em>.',sub:'Subir salarios costaría COP 3.400 millones al año (unos USD 1,1 millones) y atacaría un síntoma.'},
 {sec:'Veredicto',k:'list',br:'Para que esto no vuelva a sorprendernos, hay que medir antes.',title:'Tres tipos de indicadores, en este orden',items:[['De proceso','Días de espera, % con tutor activo. Avisan antes.'],['De resultado','Rotación a 90 días, costo de reemplazo. Confirman después.'],['De experiencia','Cómo vive la persona cada momento clave.']]},
 {sec:'Taller',k:'act',br:'Antes de buscar el cuello en su empresa, aseguremos que el mapa esté completo.',kick:'Equipos',title:'Clínica de mapas',steps:['Ajusten su mapa con las respuestas del cliente','Dos equipos lo muestran en 3 minutos','El grupo revisa límites, esperas, traspasos e indicadores'],min:20},
 {sec:'Taller',k:'act',br:'Con el mapa listo, llevemos todo esto a su empresa.',kick:'Equipos',title:'La hipótesis del cuello de botella',steps:['Marquen en su mapa dónde se forma la fila','Sosténganla con el caso y las respuestas del cliente','Elijan 3 indicadores: de proceso, de resultado y de experiencia','Redacten la hipótesis con la estructura de la siguiente lámina'],min:60,out:'Diapositiva 3: cuello de botella'},
 {sec:'Taller',k:'big',br:'Esta es la estructura para escribirla.',kick:'Estructura',text:'Creemos que <em>[resultado]</em> se explica principalmente por <em>[cuello]</em> en <em>[etapa]</em>, porque <em>[dato]</em>.',sub:'Si es cierto, deberíamos observar [evidencia]. Lo desmentiría encontrar [dato].'},
 {sec:'Tribunal',k:'act',br:'Una hipótesis que nadie intentó derribar todavía no es un diagnóstico.',kick:'Tribunal de hipótesis',title:'¿Sobrevive su hipótesis?',steps:['El equipo la lee en 30 segundos','El grupo tiene 3 minutos para buscar el dato que la tumbaría','El equipo no se defiende: toma nota'],min:20},
 {sec:'Consultorio',k:'big',br:'Después del tribunal seguro quedan preguntas. Este espacio es para eso.',kick:'Consultorio',text:'Sus <em>dudas y consultas</em>: sobre el caso, la exposición o la forma de trabajo.',sub:'Micrófono abierto o chat. Las preguntas al cliente van aparte y cuentan para el límite de la etapa.',min:15},
 {sec:'Cierre',k:'read1',br:'Mañana la validamos. La lectura eje de esta etapa nos dice cómo.',kick:'Lectura eje de la etapa 2',idx:1,min:10}
],
s4:[
 {sec:'Conversatorio',k:'cover',kick:'Etapa 2 · Diagnosticar y validar · Sesión 4 · Sábado 14 de noviembre',title:'Validar el diagnóstico',sub:'¿Qué evidencia sostiene el cuello y qué explicaciones alternativas quedan descartadas?'},
 {sec:'Conversatorio',k:'read1',br:'Buenos días. Abrimos con Rousseau y Barends, y con la hipótesis de ayer sobre la mesa.',kick:'Conversatorio · lectura eje de la etapa 2',idx:1,min:20,n:'Semáforo en el tablero: cada equipo califica su hipótesis en las cuatro fuentes y anota qué le falta.'},
 {sec:'Laboratorio',k:'act',br:'Una de las cuatro fuentes es lo que dicen las personas. Veamos qué tan bien la leemos.',kick:'Dinámica',title:'Humano frente a máquina',steps:['Una sala codifica a mano 12 comentarios de salida en 7 minutos','En paralelo, corro el mismo análisis con IA','Comparamos coincidencias, omisiones y exageraciones'],min:15,n:'Busca el comentario 18: “marqué salario porque era lo más fácil”.'},
 {sec:'Laboratorio',k:'list',br:'La IA ayuda si se usa como asistente del consultor, no como oráculo.',title:'Cuatro reglas de uso',items:[['Datos','Nada personal ni confidencial.'],['Prompt','Rol, contexto, tarea, formato y límites: “dime lo que no puedes concluir”.'],['Verificación','Cada afirmación se comprueba en la fuente.'],['Decisión','La IA analiza; el consultor decide.']]},
 {sec:'Taller',k:'act',br:'Úsenla para atacar su propia hipótesis.',kick:'Equipos',title:'Contraste con IA',steps:['Entreguen a la IA el caso y su hipótesis','Pídanle tres explicaciones alternativas y el dato que distinguiría cada una','Decidan cuáles descartan y con qué argumento','Redacten sus preguntas de la etapa 2 al cliente'],min:50},
 {sec:'Pausa',k:'brk',min:15},
 {sec:'Evidencia',k:'list',br:'Otra fuente es la científica. Antes de citar un estudio, cuatro preguntas.',title:'Antes de citar un estudio',items:[['Diseño','¿Qué tipo de estudio es? Un metaanálisis no pesa igual que un caso.'],['Contexto','¿Su muestra se parece a nuestra empresa?'],['Efecto','¿Qué tan grande es el cambio que encontró?'],['Sesgos','¿Quién lo financió? ¿Qué limitaciones reconoce?']]},
 {sec:'Evidencia',k:'act',br:'Y una advertencia práctica antes de buscar.',kick:'Dinámica',title:'Cazador de alucinaciones',steps:['Pido en vivo a un chatbot sin búsqueda web tres referencias','En parejas, cinco minutos para verificarlas','¿Existe? ¿Dice lo que el chatbot afirma?'],min:10},
 {sec:'Taller',k:'list',br:'Para buscar bien, primero hay que preguntar bien.',title:'La pregunta PICO',items:[['Población','¿En quiénes?'],['Intervención','¿Qué práctica?'],['Comparación','¿Frente a qué?'],['Resultado','¿Qué cambia?']]},

function survivalSVG(){
  const W=640,H=340,x0=48,x1=620,y0=24,y1=262,xs=w=>x0+(x1-x0)*w/13,ys=v=>y1-(y1-y0)*(v-50)/50;let g='';
  for(let v=50;v<=100;v+=10)g+=`<line x1="${x0}" x2="${x1}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--ch-grid)"/><text x="${x0-8}" y="${ys(v)+4}" text-anchor="end" font-size="12" fill="var(--ch-text)">${v}%</text>`;
  for(let w=0;w<=13;w++)if(w%2===0||w===13)g+=`<text x="${xs(w)}" y="${y1+20}" text-anchor="middle" font-size="12" fill="var(--ch-text)">${w}</text>`;
  g+=`<text x="${(x0+x1)/2}" y="${y1+40}" text-anchor="middle" font-size="12" fill="var(--ch-text)">Semanas desde el inicio de la formación</text>`;
  const ln=(a,c,w)=>`<polyline fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" points="${a.map((v,i)=>xs(i)+','+ys(v)).join(' ')}"/><circle cx="${xs(13)}" cy="${ys(a[13])}" r="4.5" fill="${c}"/>`;
  g+=ln(SURV.centro,'var(--ch-b)',2.5)+ln(SURV.norte,'var(--ch-c)',2.5)+ln(SURV.sur,'var(--ch-a)',3.5);
  const lg=[['var(--ch-a)','Sur · acompañamiento · 76%',200],['var(--ch-c)','Norte · salario +10% · 61%',200],['var(--ch-b)','Centro · sin cambios · 59%',0]];let lx=x0;
  lg.forEach(([c,t,step])=>{g+=`<rect x="${lx}" y="${H-12}" width="12" height="12" rx="2" fill="${c}"/><text x="${lx+18}" y="${H-2}" font-size="12.5" fill="var(--ch-text)">${t}</text>`;lx+=step;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Permanencia por sede">${g}</svg>`;
}
function barsSVG(rows,max,lx,unit,hiFn){
  const W=640,rowH=32,H=rows.length*rowH+16,bx=lx+8,bw=W-bx-60;let g='';
  rows.forEach(([n,d],i)=>{const y=8+i*rowH,hi=hiFn(n,i),w=bw*d/max;
    g+=`<text x="${lx}" y="${y+19}" text-anchor="end" font-size="13" fill="var(--ch-text)"${hi?' font-weight="700"':''}>${n}</text><rect x="${bx}" y="${y+5}" width="${w}" height="20" rx="3" fill="${hi?'var(--ch-hi)':'var(--ch-c)'}" opacity="${hi?1:.75}"/><text x="${bx+w+8}" y="${y+19}" font-size="13" font-family="JetBrains Mono, monospace" fill="var(--ch-text)">${d}${unit}</text>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
const pipeHi=()=>barsSVG(PIPE,15,228,' d',n=>n.startsWith('Espera'));
const pipePlain=()=>barsSVG(PIPE,15,228,' d',()=>false);
const reasonsSVG=()=>barsSVG(REASONS,40,150,'%',(n,i)=>i===0);
function journeySVG(){
  const pts=[['Ve el aviso',1],['Entrevistas',0],['Oferta',2],['Exámenes y papeles',-1],['Espera sin noticias',-3],['Inicia formación',2],['Pocas prácticas',0],['Primer día en piso',-2],['Metas desde sem. 2',-3],['Un compañero ayuda',1]];
  const W=660,H=300,x0=30,x1=630,ym=150,k=30,xs=i=>x0+(x1-x0)*i/(pts.length-1);
  let g=`<line x1="${x0}" x2="${x1}" y1="${ym}" y2="${ym}" stroke="var(--ch-grid)" stroke-dasharray="4 4"/><polyline fill="none" stroke="var(--ch-c)" stroke-width="3" stroke-linejoin="round" points="${pts.map((p,i)=>xs(i)+','+(ym-p[1]*k)).join(' ')}"/>`;
  pts.forEach((p,i)=>{const x=xs(i),y=ym-p[1]*k,low=p[1]<0;g+=`<circle cx="${x}" cy="${y}" r="6" fill="${low?'var(--ch-a)':'var(--ch-c)'}"/>`;
    const w=p[0].split(' '),m=Math.ceil(w.length/2),l1=w.slice(0,m).join(' '),l2=w.slice(m).join(' '),ty=low?y+22:y-28,an=i===0?'start':(i===pts.length-1?'end':'middle');
    g+=`<text x="${x}" y="${ty}" text-anchor="${an}" font-size="11.5" fill="var(--ch-text)">${l1}${l2?`<tspan x="${x}" dy="13">${l2}</tspan>`:''}</text>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva emocional">${g}</svg>`;
}

function simHTML(p){return `<div class="ins">
  <label for="${p}d">Contrataciones requeridas por mes <span class="v" id="${p}dv"></span><input type="range" id="${p}d" min="60" max="160" step="5" value="105"></label>
  <label for="${p}c">Cohortes de formación cada quince días <span class="v" id="${p}cv"></span><input type="range" id="${p}c" min="1" max="4" step="1" value="2"></label>
  <label for="${p}s">Cupo por cohorte <span class="v" id="${p}sv"></span><input type="range" id="${p}s" min="10" max="35" step="5" value="25"></label></div>
  <div class="outs"><div class="o"><b id="${p}cap">–</b><span>capacidad de formación al mes</span></div><div class="o"><b id="${p}u">–</b><span>utilización</span></div>
  <div class="o"><b id="${p}w">–</b><span>días de espera estimados</span></div><div class="o"><b id="${p}q">–</b><span>personas esperando (Little)</span></div>
  <div class="o" style="grid-column:1/-1"><b id="${p}a">–</b><span>abandono estimado antes de iniciar</span></div><div class="gauge" id="${p}g"><i></i></div><p class="msg" id="${p}m"></p></div>`;}
function simBind(p,root){const g=id=>root.querySelector('#'+p+id);const calc=()=>{const d=+g('d').value,c=+g('c').value,s=+g('s').value;g('dv').textContent=d;g('cv').textContent=c;g('sv').textContent=s;
  const cap=c*s*(365/12/14),rho=d/cap;g('cap').textContent=Math.round(cap);g('u').textContent=Math.round(rho*100)+'%';const ga=g('g');ga.classList.remove('warn','bad');ga.querySelector('i').style.width=Math.min(100,rho*100)+'%';
  if(rho>=1){g('w').textContent='∞';g('q').textContent='crece';g('a').textContent='> 60%';ga.classList.add('bad');g('m').textContent='Entra más gente de la que la formación puede atender: la fila crece cada mes.';return;}
  const W=0.4*rho/(1-rho);g('w').textContent=W.toFixed(1);g('q').textContent=Math.round(d/30.4*W);g('a').textContent=Math.min(60,1.5*W).toFixed(0)+'%';
  if(rho>0.9){ga.classList.add('warn');g('m').textContent='Zona crítica: cerca del 100% de utilización, cada pequeño aumento de demanda multiplica la espera.';}
  else if(rho>0.8){ga.classList.add('warn');g('m').textContent='Utilización alta: la espera ya depende de la variabilidad de la demanda.';}
  else g('m').textContent='Holgura suficiente: la espera se mantiene en pocos días.';};
  ['d','c','s'].forEach(k=>g(k).addEventListener('input',calc));calc();}

  <details class="prep"><summary>Solo docente · carga de trabajo por etapa</summary><div class="inner"><p class="lead">Casi todo el caso se construye en clase. Fuera de clase queda la lectura de cada etapa y cerrar lo avanzado: unas dos horas por semana, pensado para profesionales que trabajan.</p>

   </tbody></table></div>

  const ct=e.target.closest('[data-copyteaser]');if(ct){const pre=document.getElementById('teaser-'+ct.dataset.copyteaser);copyText(pre.textContent,ct,pre);return;}
  const cc=e.target.closest('[data-copycase]');if(cc){const pre=document.getElementById('case-'+cc.dataset.copycase);copyText(pre.textContent,cc,pre);return;}
  const c=e.target.closest('[data-copy]');if(c){const pre=document.getElementById(c.dataset.copy);copyText(pre.textContent,c,pre);}});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.store;if(k)store(k,e.target.checked?'1':'0');});

const deck=$('#deck'),stage=$('#stage');let D={id:null,i:0,timer:null,left:0,run:false};
const RITMO=[['Apertura',20,'Dinámica o conversatorio','din'],['Caso y discusión',40,'Se discute, no se expone','din'],['Pausa',15,'','pausa'],['Taller en equipos',95,'Avanzan su empresa','taller'],['Plenaria',35,'Lo que se repite','plen'],['Consultorio',15,'Sus dudas','cons'],['Cierre',20,'Siguiente paso','plen']];
const itemsHTML=(items,cls)=>`<ol class="items ${cls||''}">${items.map((it,i)=>`<li data-n="${String(i+1).padStart(2,'0')}"><span>${Array.isArray(it)?`<b>${it[0]}.</b> <span class="t">${it[1]}</span>`:it}</span></li>`).join('')}</ol>`;

const escT=t=>(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
function fbBox(lbl,ph){return `<div class="fbwrap"><span class="fblbl">${lbl}</span><div class="fb" contenteditable="true" spellcheck="false" data-fb="${fbKey()}" data-ph="${ph}">${escT(store(fbKey()))}</div></div>`;}
function votes(){try{return JSON.parse(store('poll-'+D.id+'-'+D.i)||'{}')}catch(e){return {}}}
function slideHTML(s){const k=s.kick?`<div class="kick">${s.kick}</div>`:'',br=s.br?`<p class="bridge">${s.br}</p>`:'';
 switch(s.k){
  case 'cover':return `<div class="sl cover"><div class="bar"></div>${k}<h1>${s.title}</h1>${s.sub?`<p class="sub">${s.sub}</p>`:''}<div class="foot">Universidad de La Sabana · Maestría en Gerencia y Desarrollo de Personas<br>${COURSE}</div></div>`;
  case 'big':return `<div class="sl center">${br}${s.min?`<span class="badge">${s.min} min</span>`:''}${k}<p class="bigtext">${s.text}</p>${s.sub?`<p class="sub">${s.sub}</p>`:''}${s.min?fbBox('En vivo · lo que dice el grupo y tu complemento','Escribe aquí las ideas del grupo y lo que quieras agregar…'):''}</div>`;
  case 'list':return `<div class="sl${s.cls&&s.cls.includes('tight')?' tight':''}">${br}${k}<h2>${s.title}</h2>${itemsHTML(s.items,s.cls&&s.cls.includes('two')?'two':'')}</div>`;
  case 'split':return `<div class="sl">${br}${k}<h2>${s.title}</h2><div class="split"><div class="${s.hi==='a'?'hi':''}"><h3>${s.a.h}</h3><p>${s.a.t}</p></div><div class="${s.hi==='b'?'hi':''}"><h3>${s.b.h}</h3><p>${s.b.t}</p></div></div>${s.q?fbBox('En vivo · '+s.q,'Escribe aquí lo que responde el grupo…'):''}</div>`;
  case 'poll':{const v=votes(),mx=Math.max(1,...s.opts.map(([l])=>v[l]||0));return `<div class="sl">${br}<span class="badge">Encuesta · clic suma un voto, Mayús + clic resta</span><h2>${s.title}</h2><div class="opts">${s.opts.map(([l,t])=>`<div class="opt" data-vote="${l}" style="--w:${Math.round((v[l]||0)/mx*100)}%"><b>${l}</b><span>${t}</span><em class="vc">${v[l]||0}</em></div>`).join('')}</div>${fbBox('En vivo · por qué votaron así','Escribe los argumentos que den…')}</div>`;}
  case 'act':return `<div class="sl">${br}<span class="badge">${s.kick} · ${s.min} min</span><h2>${s.title}</h2>${itemsHTML(s.steps)}${s.out?`<div class="outbox"><b>Avance:</b> ${s.out}</div>`:''}</div>`;
  case 'myth':return `<div class="sl">${br}${k}<p class="claim">“${s.claim}”</p><p class="hint">¿Mito, evidencia o depende? · R para revelar</p><div class="verdict"><span class="tag" style="color:${s.tag==='Mito'?'#c0392b':(s.tag==='Evidencia'?'#1d7552':'#8f6700')}">${s.tag}</span><p>${s.verdict}</p><small>${s.src}</small>${fbBox('Tu complemento','Agrega un ejemplo o lo que dijo el grupo…')}</div></div>`;
  case 'reform':return `<div class="sl tight">${br}${k}<h2>${s.title}</h2><div class="reform">${s.items.map(([a,b])=>`<div><span>${a}</span><i>${b}</i></div>`).join('')}</div><p class="hint">R para revelar</p></div>`;
  case 'chart':return `<div class="sl">${br}${k}<h2>${s.title}</h2><div class="chartbox">${CHARTS[s.chart]()}</div>${s.note?`<p class="note2">${s.note}</p>`:''}</div>`;
  case 'nums':return `<div class="sl center">${br}${k}<h2>${s.title}</h2><div class="numsg">${s.nums.map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join('')}</div></div>`;
  case 'quote':return `<div class="sl center">${br}<p class="quote">“${s.text}”</p><p class="by">${s.by}</p></div>`;

  case 'sema':return `<div class="sl">${br}<h2>${s.title}</h2><div class="sema">${s.items.map(([c,a,b])=>`<div><i style="background:${c}"></i><b>${a}</b><span>${b}</span></div>`).join('')}</div></div>`;
  case 'sim':return `<div class="sl">${br}${k}<h2>${s.title}</h2><div class="simwrap sim">${simHTML('sd')}</div></div>`;
  case 'etapas':return `<div class="sl stgsl">${br}<h2 class="wide">${s.title}</h2><div class="stg">${ETAPAS.map(e=>{const r=READ[e.read],a=SES.find(q=>q.id===e.ses[0]),b=SES.find(q=>q.id===e.ses[1]);return `<div><span>Etapa ${e.n}</span><h3>${e.nombre}</h3><ol class="flow"><li><b>Vie ${a.date.slice(8)}</b>Sesión ${a.n} · ${a.fase}</li><li class="rd"><b>Lectura</b><span class="rt">${r.au} (${yr(r)})</span><small>${r.para}</small><a class="rbtn" href="${r.link}" target="_blank" rel="noopener">${r.lab.startsWith('PDF')?'Abrir PDF':'Abrir lectura'} ↗</a></li><li><b>Sáb ${b.date.slice(8)}</b>Conversatorio + Sesión ${b.n} · ${b.fase}</li></ol></div>`;}).join('')}</div></div>`;
  case 'ritmo':return `<div class="sl">${br}<h2>${s.title}</h2><div class="rit">${RITMO.map(([n,m,d,t])=>`<div class="rrow"><b>${n}</b><div class="trk"><i class="r-${t}" style="width:${m}%"></i></div><span>${m} min</span><small>${d}</small></div>`).join('')}</div><p class="sub" style="margin-top:1.5cqw">Más de 80% del tiempo trabajan ustedes.</p></div>`;
  case 'reads':return `<div class="sl">${br}<h2>${s.title}</h2><div class="rds">${READ.map((r,i)=>`<div><span>Etapa ${i+1} · conversatorio el sábado ${SES.find(q=>q.id===ETAPAS[i].ses[1]).date.slice(8)}</span><h3>${r.au} (${yr(r)})</h3><p>${r.tit}</p><small>${r.por}</small></div>`).join('')}</div><p class="sub" style="margin-top:1.5cqw">Se entrega el viernes que abre la etapa · 20 minutos de conversatorio al inicio del sábado · sin control de lectura.</p></div>`;
  case 'parts':return `<div class="sl tight">${br}<h2>${s.title}</h2><ol class="items">${PARTS.map((p,i)=>`<li data-n="${String(i+1).padStart(2,'0')}"><span><b>${p[0]}</b> <span class="t" style="font-family:var(--mono);font-size:1.3cqw;color:#0b4da2">· ${p[1]}</span></span></li>`).join('')}</ol></div>`;
  case 'eval':return `<div class="sl">${br}<h2>${s.title}</h2><div class="rcols"><div><h3>Qué presentan</h3><ol><li>Sábado 21, en equipos de 2 a 3</li><li>10 minutos de exposición y 5 de preguntas</li><li>Máximo 8 diapositivas</li><li>Nota de 0,0 a 5,0; los avances no se califican</li></ol></div><div><h3>Rúbrica</h3><div class="rw">${RUBRIC.map(([c,w])=>`<div><b>${w}%</b><span>${c}</span></div>`).join('')}</div></div></div></div>`;
  case 'empresas':return `<div class="sl">${br}<h2>${s.title}</h2><div class="rcols"><div><h3>Seis empresas</h3><div class="rw">${CASES.map(c=>`<div style="grid-template-columns:1fr"><span><b style="color:#0b2447;font-family:var(--body)">${c.nombre.replace(' S.A.S.','')}</b> · ${c.ciudad.split(',')[0]}</span></div>`).join('')}</div></div><div><h3>Tres reglas</h3><ol><li><b>Interpretar:</b> lo que falte se pregunta o se declara como supuesto.</li><li><b>Preguntar al cliente:</b> hasta 3 preguntas por etapa, por escrito.</li><li><b>Cuestionar el encargo:</b> el cliente pide una solución; ustedes deciden si es la correcta.</li></ol></div></div></div>`;
  case 'paso':return `<div class="sl paso">${br}${s.tl?`<div class="ptl">${[['Día 0','buscan a alguien'],['Día 10','se postula'],['Día 19','entrevistas'],['Día 22','le dicen que quedó'],['Día 29','exámenes y papeles'],['Día 41','sigue esperando'],['Días 42–56','capacitación'],['Día 57','empieza a trabajar']].map(([d,t])=>`<span><b>${d}</b>${t}</span>`).join('')}</div>`:''}<span class="badge">${s.kick} · ${s.min} min</span><p class="claim">${s.q}</p><p class="hint">${s.h||'Respondan en el chat'} · respondan en el chat · R para revelar</p>${fbBox('Lo que dice el grupo','Escribe aquí lo que responden…')}<div class="verdict"><span class="tag" style="color:#0b4da2">Respuesta</span><p>${s.a}</p>${s.c?`<p class="crit"><b>Criterio:</b> ${s.c}</p>`:''}</div></div>`;
  case 'read1':{const r=READ[s.idx];return `<div class="sl">${br}<span class="badge">${s.kick} · ${s.min} min</span><p class="readref"><a class="refa" href="${r.link}" target="_blank" rel="noopener">${r.ref}</a> <a class="rbtn inline" href="${r.link}" target="_blank" rel="noopener">${r.lab.startsWith('PDF')?'Abrir PDF':'Abrir lectura'} ↗</a></p><p class="sub" style="font-size:1.7cqw;color:#0b2447"><b>Para qué:</b> ${r.para}</p><div class="rcols"><div><h3>Preguntas guía</h3><ol>${r.qs.map(q=>`<li>${q}</li>`).join('')}</ol></div><div><h3>Conversatorio</h3><p>${r.din}</p></div></div></div>`;}
 }return '';}
const fmtClock=sec=>{const n=sec<0;sec=Math.abs(sec);return(n?'−':'')+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');};
function paintTimer(){const c=$('#timerchip'),b=$('#bigclock');if(c){c.textContent=fmtClock(D.left);c.classList.toggle('run',D.run&&D.left>=0);c.classList.toggle('over',D.left<0);}if(b)b.textContent=fmtClock(D.left);}
function stopTimer(){clearInterval(D.timer);D.timer=null;D.run=false;}
function toggleTimer(){const s=DECKS[D.id][D.i];if(!s.min)return;if(D.run)stopTimer();else{D.run=true;D.timer=setInterval(()=>{D.left--;paintTimer();},1000);}paintTimer();}
function railHTML(L,cur){const secs=[...new Set(L.map(x=>x.sec))];return `<div class="rail">${secs.map(x=>`<span class="${x===cur?'on':''}">${x}</span>`).join('')}</div>`;}
function render(dir){const L=DECKS[D.id],s=L[D.i],nx=L[D.i+1];stopTimer();stage.classList.remove('rev');
  stage.innerHTML=`<div class="navzone l" data-nav="-1"></div><div class="navzone r" data-nav="1"></div><div class="slwrap ${dir<0?'back':''}">${slideHTML(s)}</div>${s.min&&s.k!=='brk'?'<div class="timerchip" id="timerchip"></div>':''}${s.k!=='cover'?railHTML(L,s.sec):''}<div class="pagenum">${D.id==='curso'?'Curso':'S'+D.id.slice(1)} · ${D.i+1}/${L.length}</div>`;
  D.left=(s.min||0)*60;paintTimer();$('#dCount').textContent=`${D.i+1} / ${L.length}`;
  $('#dNotesBox').innerHTML=`<b>Diapositiva ${D.i+1} · ${s.sec}.</b> ${s.n||''}${nx&&nx.br?`<div class="nx">Para pasar a la siguiente: «${nx.br}»</div>`:''}`;
  $('#dRev').hidden=!(s.k==='myth'||s.k==='reform'||s.k==='paso');$('#dTimer').hidden=!s.min;
  if(s.k==='sim')simBind('sd',stage);store('deck-'+D.id,String(D.i));
  stage.querySelectorAll('[data-fb]').forEach(el=>el.addEventListener('input',()=>store(el.dataset.fb,el.innerText)));
  stage.querySelectorAll('[data-vote]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();const v=votes(),l=el.dataset.vote;v[l]=Math.max(0,(v[l]||0)+(ev.shiftKey?-1:1));store('poll-'+D.id+'-'+D.i,JSON.stringify(v));
    const mx=Math.max(1,...Object.values(v));stage.querySelectorAll('[data-vote]').forEach(o=>{const n=v[o.dataset.vote]||0;o.querySelector('.vc').textContent=n;o.style.setProperty('--w',Math.round(n/mx*100)+'%');});}));}
function go(n){const L=DECKS[D.id].length,j=Math.max(0,Math.min(L-1,D.i+n));if(j===D.i)return;D.i=j;render(n);}
function openDeck(id){D.id=id;const v=parseInt(store('deck-'+id)||'0',10);D.i=isNaN(v)?0:Math.min(v,DECKS[id].length-1);deck.hidden=false;document.body.style.overflow='hidden';render(1);}
function closeDeck(){stopTimer();deck.hidden=true;document.body.style.overflow='';if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});}
function toggleNotes(){const b=$('#dNotesBox');b.hidden=!b.hidden;deck.classList.toggle('notes-open',!b.hidden);}
function toggleFull(){try{if(document.fullscreenElement)document.exitFullscreen();else deck.requestFullscreen().catch(()=>{});}catch(e){}}
stage.addEventListener('click',e=>{const z=e.target.closest('[data-nav]');if(z)go(+z.dataset.nav);});
$('#dPrev').onclick=()=>go(-1);$('#dNext').onclick=()=>go(1);$('#dRev').onclick=()=>stage.classList.toggle('rev');$('#dTimer').onclick=toggleTimer;$('#dNotes').onclick=toggleNotes;$('#dFull').onclick=toggleFull;$('#dClose').onclick=closeDeck;
document.addEventListener('keydown',e=>{if(deck.hidden)return;if(e.target.matches('input,textarea,[contenteditable]')){if(e.key==='Escape')e.target.blur();return;}
  const k=e.key.toLowerCase();if(k==='arrowright'||k===' '||k==='pagedown'){e.preventDefault();go(1);}else if(k==='arrowleft'||k==='pageup'){e.preventDefault();go(-1);}
  else if(k==='r')stage.classList.toggle('rev');else if(k==='t')toggleTimer();else if(k==='n')toggleNotes();else if(k==='f')toggleFull();else if(k==='escape')closeDeck();else if(k==='home'){D.i=0;render(-1);}});
let tx=null;stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)go(dx<0?1:-1);tx=null;});
route();
</script>
