<style>
:root{--bg:#f5f7fb;--surface:#fff;--ink:#0b2447;--muted:#51607a;--line:#d7deea;--accent:#0b4da2;--accent-soft:#e4edf9;--signal:#8f6700;--signal-soft:#fbf1d2;--gold:#f2b91f;--ok:#1d7552;--ok-soft:#e1f1e9;--bad:#c0392b;--bad-soft:#fbe7e4;--cn:#0e7c86;--cn-soft:#dff3f4;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap}.brand span{color:var(--signal)}
.appname{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.stage{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--cn-soft);color:var(--cn);padding:3px 8px;border-radius:6px;font-weight:600}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.who b{color:var(--ink)}
main{padding-block:24px 80px;display:flex;flex-direction:column;gap:22px}
.label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,2.6vw,24px);display:flex;flex-direction:column;gap:12px;min-width:0}
.card>h2{font-size:21px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card>h2 .n{font-family:var(--mono);font-size:13px;color:var(--cn);font-weight:600}
.lead{color:var(--muted);font-size:14.5px;max-width:78ch}
.note{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],textarea,select{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 11px;font-size:14.5px;width:100%;min-width:0;color:var(--ink);font-weight:400}
textarea{resize:vertical;min-height:70px;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.btn.sm{padding:6px 11px;font-size:13px}
.btn.ai{background:var(--ink);border-color:var(--ink)}

.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:0;text-decoration:underline}

.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;background:#fff}

.login h1{font-size:30px}
.err{color:var(--bad);font-size:13.5px}
.casepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

.aiout{min-height:120px;font-size:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--bg);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.x{border:0;background:none;color:#8a97ad;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}

.banner{border:1px solid var(--signal);background:var(--signal-soft);border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
fieldset.ro{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:22px}

#toast.on{opacity:1;transform:translateX(-50%)}
.chk{display:flex;flex-direction:column;gap:8px}
.chk>div{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;align-items:baseline;font-size:14px}
.chk>div .dot{transform:translateY(1px)}

.svgbox{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:auto}

.cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.foot{font-size:12.5px;color:var(--muted);text-align:center;padding-top:10px}
.mtx th,.mtx td{padding:8px 6px}

.savepill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;background:#fff;white-space:nowrap}
.savepill i{width:9px;height:9px;border-radius:50%;background:#b7c1d1;flex:none}

.sv-idle{color:var(--ok)}.sv-idle i{background:var(--ok)}
.sv-pend,.sv-saving{border-color:#ecd28a;color:var(--signal);background:var(--signal-soft)}.sv-pend i,.sv-saving i{background:#d9a400;animation:blink 1s ease-in-out infinite}
.sv-err{border-color:#efb3aa;color:var(--bad);background:var(--bad-soft)}.sv-err i{background:var(--bad);animation:blink .7s ease-in-out infinite}
.sv-demo{color:var(--muted)}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.savepill i{animation:none!important}}

</style>

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200);}
async function copyTxt(t){try{await navigator.clipboard.writeText(t);toast('Copiado');}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copiado');}catch(x){toast('No se pudo copiar');}a.remove();}}
function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function svgPng(svg,name,scale=2){const xml=new XMLSerializer().serializeToString(svg);const vb=svg.viewBox.baseVal;const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=vb.width*scale;c.height=vb.height*scale;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>dl(name,b),'image/png');};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);}
function svgFile(svg,name){dl(name,new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}));}

function normEmail(v){v=(v||'').trim().toLowerCase();if(v&&!v.includes('@'))v+='@'+CFG.DOMAIN;return v;}
const isAdm=e=>CFG.ADMINS.map(x=>x.toLowerCase()).includes(e);
function allowed(e){return isAdm(e)||(e.endsWith('@'+CFG.DOMAIN)&&CFG.USERS.includes(e.split('@')[0]));}

async function api(path,body){const r=await fetch(CFG.WORKER_URL.replace(/\/$/,'')+path,{method:body?'POST':'GET',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Error '+r.status));return j;}

/* ---- base de datos del curso (JSONBin) ---- */
const binOn=()=>!!(CFG.BIN_ID&&CFG.BIN_KEY);
let _hdr=LS.get('sab-binhdr')||'X-Access-Key';
const binOf=app=>(CFG.BINS&&CFG.BINS[app])||CFG.BIN_ID;
async function binFetch(method,body,bin=binOf(APP.id)){const url=`https://api.jsonbin.io/v3/b/${bin}${method==='GET'?'/latest':''}`;
  for(const h of [_hdr,_hdr==='X-Access-Key'?'X-Master-Key':'X-Access-Key']){
    const r=await fetch(url,{method,cache:'no-store',headers:{[h]:CFG.BIN_KEY,'X-Bin-Meta':'false',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
    if(r.status===401||r.status===403)continue;
    if(h!==_hdr){_hdr=h;LS.set('sab-binhdr',h);}
    if(!r.ok)throw new Error('JSONBin '+r.status);
    if(method!=='GET')return true;const j=await r.json();return j&&j.record&&j.metadata?j.record:j;}
  throw new Error('La clave del BIN no tiene permiso');}
let _q=Promise.resolve();
let _sv=['idle',''];
function setSave(k,t){_sv=[k,t];const el=$('#savepill');if(el){el.className='savepill sv-'+k;el.innerHTML=`<i></i>${t}`;}}
const hhmm=()=>new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
function binUpdate(fn){_q=_q.then(async()=>{let r=await binFetch('GET');if(!r||typeof r!=='object'||Array.isArray(r))r={};fn(r);await binFetch('PUT',r);const t=$('#syncst');if(t)t.textContent='Guardado en la nube a las '+hhmm();if(!_dirty)setSave('ok','Guardado '+hhmm());}).catch(e=>{console.warn(e);const t=$('#syncst');if(t)t.textContent='Sin conexión con la nube: guardado en este navegador';setSave('err','Sin conexión: se reintenta');_dirty=true;});return _q;}
function touchUser(r,app){if(S.slot==='P')return;r.users=r.users||{};const u=r.users[S.email]||{email:S.email,apps:{}};Object.assign(u,{case:S.case,slot:S.slot,name:S.name,last:Date.now()});u.apps=u.apps||{};u.apps[app]=Date.now();r.users[S.email]=u;}
const cloudOn=()=>binOn()&&S.slot!=='P';
let _dirty=false;
function pushCloud(){if(!_dirty||!ST||!cloudOn())return _q;_dirty=false;setSave('saving','Guardando…');const app=APP.id,tk=teamKey(),data=JSON.parse(JSON.stringify(ST));return binUpdate(r=>{r.apps=r.apps||{};r.apps[app]=r.apps[app]||{};r.apps[app][tk]=data;touchUser(r,app);});}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')pushCloud();});
window.addEventListener('pagehide',()=>pushCloud());

/* ---- estado por equipo ---- */
function localKey(){return `sab-${APP.id}-${teamKey()}`;}
async function loadState(){
  let st=LS.get(localKey());
  if(binOn()){try{const r=await binFetch('GET');const d=r&&r.apps&&r.apps[APP.id]&&r.apps[APP.id][teamKey()];if(d&&(!st||(d.upd||0)>(st.upd||0)))st=d;}catch(e){}if(S.slot!=='P')binUpdate(r=>touchUser(r,APP.id));}
  else if(CFG.WORKER_URL){try{const j=await api(`/load?app=${APP.id}&team=${encodeURIComponent(teamKey())}&email=${encodeURIComponent(S.email)}`);if(j&&j.data&&(!st||(j.data.upd||0)>(st.upd||0)))st=j.data;}catch(e){}}
  ST=st||(S.case==='andes'&&S.slot==='P'&&APP.example?APP.example():APP.fresh(curCaseId()));ST.ai=ST.ai||{};
}
let _cloudT=null;
setInterval(()=>{if(_dirty&&!S.doc)pushCloud();},5000);   // autoguardado en la nube cada 5 segundos
function save(){if(ro())return;ST.upd=Date.now();ST.by=S.email;ST.team=S.name;LS.set(localKey(),ST);

  else if(CFG.WORKER_URL){try{const j=await api(`/load?app=${app}&team=${encodeURIComponent(tk)}&email=${encodeURIComponent(S.email)}`);if(j&&j.data&&(!st||(j.data.upd||0)>(st.upd||0)))st=j.data;}catch(e){}}

function setPath(o,p,v){const k=p.split('.');let x=o;for(let i=0;i<k.length-1;i++)x=x[k[i]];x[k[k.length-1]]=v;}
function getPath(o,p){return p.split('.').reduce((x,k)=>x==null?x:x[k],o);}

function aiBox(id){const t=AI[id];const has=!!CFG.WORKER_URL;return `<div class="aibox"><h3>${t.title}</h3><p class="note">${t.desc}</p>
  <div class="row">${has?`<button class="btn ai sm" data-ai="${id}"${ro()?' disabled':''}>Pedir a Claude</button>`:''}<button class="btn ghost sm" data-aicopy="${id}">Copiar prompt${has?'':' para su IA'}</button>${t.after?`<button class="btn ghost sm" data-aiuse="${id}"${ro()?' disabled':''}>${t.afterLabel||'Usar la respuesta'}</button>`:''}</div>
  ${has?'':`<p class="note">Copien el prompt, péguenlo en Claude, ChatGPT o Gemini y traigan la respuesta aquí.</p>`}
  <textarea class="aiout" data-k="ai.${id}" placeholder="${has?'La respuesta de Claude aparece aquí. Pueden editarla.':'Peguen aquí la respuesta de su IA.'}">${esc(ST.ai[id]||'')}</textarea></div>`;}
async function runAI(id,btn){const t=AI[id];const {system,prompt}=t.build();const old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span> Pensando…';
  try{const j=await api('/ai',{email:S.email,app:APP.id,system:system||SYS,prompt});ST.ai[id]=j.text||'';save();const ta=document.querySelector(`[data-k="ai.${id}"]`);if(ta)ta.value=ST.ai[id];if(t.auto&&t.after)t.after(ST.ai[id]);}
  catch(e){toast(e.message||'No se pudo consultar a Claude');}finally{btn.disabled=false;btn.innerHTML=old;}}
function aiPrompt(id){const {system,prompt}=AI[id].build();return (system||SYS)+'\n\n'+prompt;}

async function viewPanel(){let rows=[];try{const j=await api('/list',{app:APP.id,key:S.key});rows=j.items||[];}catch(e){return `<div class="card"><h2>Panel del profesor</h2><p class="err">${esc(e.message)}. Revisa la clave del panel.</p><div class="row"><button class="btn ghost" data-act="back">Volver</button></div></div>`;}

async function route(){header();const app=$('#app');
  if(S.doc&&!S.view){app.innerHTML='<div class="card"><p class="note">Cargando…</p></div>';app.innerHTML=await APP.renderDoc();return;}
  if(!S.email&&!S.doc){app.innerHTML=viewLogin();bindLogin();return;}
  if(!S.case){app.innerHTML=viewTeam();return;}
  if(S.panel){app.innerHTML='<div class="card"><p class="note">Cargando…</p></div>';app.innerHTML=await viewPanel();return;}
  if(!ST){await loadState();if(APP.afterLoad)await APP.afterLoad();}
  app.innerHTML=(S.view?`<div class="banner"><b>Viendo el trabajo de ${esc(S.view.data?.team||S.view.team)}</b><span class="note">Solo lectura.</span><button class="btn sm" data-act="unview">Volver al panel</button></div>`:'')+`<fieldset class="ro"${ro()?' disabled':''}>${APP.render()}</fieldset><p class="foot">${cloudOn()?`Guardado automático cada 5 segundos en la nube del curso: no necesitan guardar. <b><span id="syncst"></span></b>`:S.slot==='P'?'Modo profesor: tus cambios se guardan solo en este navegador.':CFG.WORKER_URL?'Se guarda automáticamente para todo el equipo.':'Se guarda automáticamente en este navegador.'} · Casos ficticios, uso académico.</p>`;
  APP.live&&APP.live();}
function bindLogin(){const dn=$('#dni');if(dn)dn.addEventListener('keydown',e=>{if(e.key==='Enter')$('[data-act=doclogin]').click();});const em=$('#em');em.addEventListener('input',()=>{$('#admk').hidden=!(isAdm(normEmail(em.value))&&CFG.WORKER_URL&&!binOn());});em.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});em.focus();}
function doLogin(){const e=normEmail($('#em').value);if(!allowed(e)){$('#app').innerHTML=viewLogin('Ese correo no está en la lista del curso. Escríbelo como aparece en tu cuenta de La Sabana.');bindLogin();return;}
  S.email=e;S.admin=isAdm(e);S.key=S.admin?($('#ak')?.value||''):'';LS.set('sab-session',{email:e,key:S.key});
  setTeam();route();}
function setTeam(){const t=LS.get('sab-team-'+S.email);if(t&&t.case){S.case=t.case;S.slot=t.slot;S.name=t.name||'';}else if(S.admin){S.case='andes';S.slot='P';S.name='Ejemplo del profesor';}}
const isDemo=()=>S.case==='andes'&&S.slot==='P'&&!S.view;

document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
  const a=b.dataset.act;
  if(a==='login')return doLogin();
  if(a==='doclogin'){const v=($('#dni').value||'').replace(/\D/g,'');const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)))].map(x=>x.toString(16).padStart(2,'0')).join('');if(h!==CFG.DOC_DNI_SHA256){$('#app').innerHTML=viewLogin('DNI docente incorrecto.');bindLogin();return;}S.doc=true;S.email=null;sessionStorage.setItem('sab-doc','1');return route();}
  if(a==='out'&&S.doc){S.doc=false;S.view=null;S.case=null;ST=null;sessionStorage.removeItem('sab-doc');return route();}
  if(a==='unview'&&S.doc){S.view=null;S.case=null;S.slot=null;S.practice=false;ST=null;return route();}
  if(a==='out'||a==='team'){clearTimeout(_cloudT);await pushCloud();}
  if(a==='out'){LS.del('sab-session');Object.assign(S,{email:null,admin:false,key:'',case:null,slot:null,name:'',practice:false,view:null,panel:false});ST=null;return route();}
  if(a==='team'){S.case=null;S.view=null;S.panel=false;ST=null;return route();}
  if(a==='panel'){S.panel=true;return route();}
  if(a==='sync'){_dirty=true;clearTimeout(_cloudT);await pushCloud();return toast('Guardado en la nube');}
  if(a==='reload'){_dirty&&await pushCloud();ST=null;await route();return toast('Actualizado');}
  if(a==='recover')return recoverCloud(b);
  if(a==='reset'){if(!confirmReset(b))return;ST=APP.example();save();return route();}
  if(a==='back'){S.panel=false;S.view=null;S.practice=false;ST=null;return route();}
  if(a==='unview'){S.view=null;S.panel=true;S.practice=false;ST=null;return route();}
  if(a==='teamok'){const p=$('.cpick.on'),sl=$('.seg button.on');if(!p)return toast('Elijan su empresa');S.case=p.dataset.pick;S.slot=sl?sl.dataset.slot:'A';S.name=$('#tn').value.trim();LS.set('sab-team-'+S.email,{case:S.case,slot:S.slot,name:S.name});ST=null;return route();}
  if(b.dataset.pick){document.querySelectorAll('.cpick').forEach(x=>x.classList.toggle('on',x===b));return;}
  if(b.dataset.slot){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));return;}
  if(b.dataset.view){const r=window._panel[+b.dataset.view];S.view=r;S.panel=false;const parts=r.team.split('-');S.practice=parts[0]==='andes';ST=JSON.parse(JSON.stringify(r.data||{}));ST.ai=ST.ai||{};return route();}
  if(b.dataset.ai)return runAI(b.dataset.ai,b);
  if(b.dataset.aicopy)return copyTxt(aiPrompt(b.dataset.aicopy));
  if(b.dataset.aiuse){const id=b.dataset.aiuse;return AI[id].after(ST.ai[id]||'');}
  APP.click&&APP.click(b,e);
});
document.addEventListener('input',e=>{const el=e.target;const k=el.dataset&&el.dataset.k;if(!k||!ST||ro())return;
  let v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.num!==undefined)v=+v||0;setPath(ST,k,v);save();APP.live&&APP.live(el);});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.rerender!==undefined&&!ro())route();});

/* ---- recuperar lo último guardado en la base de datos (por equipo) ---- */
async function recoverCloud(b){if(!cloudOn())return toast('Esta opción es para los equipos (no para el modo ejemplo)');
  if(!b.dataset.armed){b.dataset.armed='1';const o=b.textContent;b.dataset.o=o;b.textContent='¿Seguro? Reemplaza lo de esta pantalla · pulsa otra vez';setTimeout(()=>{if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.textContent=o;}},4000);return;}
  delete b.dataset.armed;b.disabled=true;b.textContent='Buscando en la base de datos…';
  try{await _q;const r=await binFetch('GET');const d=r&&r.apps&&r.apps[APP.id]&&r.apps[APP.id][teamKey()];
    if(!d){b.disabled=false;b.textContent=b.dataset.o;return toast('No hay nada guardado todavía para su equipo');}
    _dirty=false;ST=JSON.parse(JSON.stringify(d));ST.ai=ST.ai||{};LS.set(localKey(),ST);if(APP.afterLoad)await APP.afterLoad();
    setSave('ok','Recuperado '+hhmm());await route();toast(`Recuperado: lo guardó ${(d.by||'su equipo').split('@')[0]} el ${new Date(d.upd||Date.now()).toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'})}`);}
  catch(e){b.disabled=false;b.textContent=b.dataset.o;toast('No pude conectar con la base de datos: intenten de nuevo');}}
function confirmReset(b){if(b.dataset.armed)return true;b.dataset.armed='1';b.textContent='¿Seguro? Pulsa otra vez';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Restablecer ejemplo';}},3000);return false;}
function boot(){if(sessionStorage.getItem('sab-doc')){S.doc=true;document.title=APP.title+' · La Sabana MGDP';return route();}const s=LS.get('sab-session');if(s&&s.email&&allowed(s.email)){S.email=s.email;S.admin=isAdm(s.email);S.key=s.key||'';setTeam();}

let gDB=null,gTimer=null;
const gFmt=t=>t?new Date(t).toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'}):'–';
const gHace=t=>{if(!t)return '';const m=Math.round((Date.now()-t)/60000);return m<1?'hace segundos':m<60?`hace ${m} min`:`hace ${Math.round(m/60)} h`;};
function gTeam(tk){const p=tk.split('-');return {slot:p[p.length-1],cid:p[p.length-2],prac:p.length===3};}
const gEmp=tk=>{const p=gTeam(tk);return (CASES[p.cid]?.corto||p.cid)+(p.prac?' · práctica Andes':'');};

  gDB=DB;const A=(DB.apps&&DB.apps[APP.id])||{},U=DB.users||{};const T=Object.entries(A).sort((a,b)=>a[0].localeCompare(b[0]));
  const all=CFG.USERS.map(u=>u+'@'+CFG.DOMAIN);const nIn=all.filter(e=>U[e]&&U[e].apps&&U[e].apps[APP.id]).length;

   <div class="row"><button class="btn ghost sm" data-gd="refresh">Actualizar</button><button class="btn sm" data-gd="xlsx">Descargar todo (Excel)</button><button class="btn ghost sm" data-gd="txt">Todas las respuestas (TXT)</button></div></div>
   <div class="row">${[[`${nIn} / ${all.length}`,'participantes usaron esta herramienta'],[T.length,'equipos con trabajo'],[T.filter(([,d])=>APP.doc.estado(d)[1]==='g').length,'completos']].map(([v,l])=>`<div class="pill" style="padding:8px 14px;border-radius:12px"><b style="font-family:var(--display);font-size:20px">${v}</b><span class="note">${l}</span></div>`).join('')}</div>
   <p class="note">Se actualiza solo cada 30 segundos. Última lectura: ${new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}.</p></div>
  <div class="card"><h2>Equipos</h2>${T.length?`<div class="tbl"><table><thead><tr><th>Equipo</th><th>Empresa</th><th>Integrantes</th><th>Último guardado</th><th>Entrega</th><th>Avance</th><th></th></tr></thead><tbody>
   ${T.map(([tk,d])=>{const p=gTeam(tk),e=APP.doc.estado(d);const mem=Object.values(U).filter(u=>u.case===p.cid&&u.slot===p.slot).map(u=>u.email.split('@')[0]);
    return `<tr><td><b>${esc(d.team||'Equipo '+p.slot)}</b></td><td>${esc(gEmp(tk))}</td><td style="font-size:12.5px">${esc(mem.join(', ')||'–')}</td><td class="num">${gFmt(d.upd)}<br><span class="note">${gHace(d.upd)}</span></td><td><span class="pill"><span class="dot d-${e[1]}"></span>${e[0]}</span></td><td style="font-size:13px">${esc(APP.doc.brief(d))}</td><td><button class="btn ghost sm" data-gd="ver" data-i="${tk}">Ver</button></td></tr>`;}).join('')}</tbody></table></div>`:'<p class="note">Todavía no hay equipos con trabajo guardado.</p>'}</div>
  <div class="card"><h2>Participantes</h2><div class="tbl"><table><thead><tr><th>Correo</th><th>Empresa</th><th>Equipo</th><th>Último ingreso</th><th>Usó esta herramienta</th></tr></thead><tbody>${all.map(e=>{const u=U[e];return `<tr><td>${esc(e)}</td><td>${u?esc(CASES[u.case]?.corto||u.case):'<span class="note">No ha ingresado</span>'}</td><td>${u?esc(u.slot):''}</td><td class="num">${u?gFmt(u.last):''}</td><td>${u&&u.apps&&u.apps[APP.id]?gFmt(u.apps[APP.id]):''}</td></tr>`;}).join('')}</tbody></table></div></div>`;}
function gSheets(){const A=(gDB.apps&&gDB.apps[APP.id])||{},U=gDB.users||{};const T=Object.entries(A);const all=CFG.USERS.map(u=>u+'@'+CFG.DOMAIN);
  const S1=[['Correo','Ingresó','Empresa','Equipo','Consultora','Último ingreso','Usó esta herramienta']].concat(all.map(e=>{const u=U[e]||{};return [e,u.last?'Sí':'No',CASES[u.case]?.corto||'',u.slot||'',u.name||'',u.last?gFmt(u.last):'',u.apps&&u.apps[APP.id]?gFmt(u.apps[APP.id]):''];}));

  return [['Participantes',S1],['Equipos',S2],...APP.doc.sheets(T)];}
function gLoadX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
async function gXlsx(){const sh=gSheets(),st=new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');try{await gLoadX();const wb=XLSX.utils.book_new();sh.forEach(([n,rows])=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=rows[0].map((h,i)=>({wch:Math.min(60,Math.max(10,...rows.slice(0,60).map(r=>String(r[i]??'').length))+2)}));XLSX.utils.book_append_sheet(wb,ws,n);});XLSX.writeFile(wb,`MGDP-${APP.id}-${st}.xlsx`);}
  catch(e){toast('Sin conexión al generador de Excel: descargo CSV');const q=t=>'"'+String(t??'').replace(/"/g,'""')+'"';sh.forEach(([n,rows],i)=>setTimeout(()=>dl(`MGDP-${APP.id}-${n}-${st}.csv`,new Blob(['﻿'+rows.map(r=>r.map(q).join(';')).join('\n')],{type:'text/csv'})),i*400));}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-gd]');if(!b||!S.doc)return;const a=b.dataset.gd;

  if(a==='ver'){const tk=b.dataset.i,d=gDB.apps[APP.id][tk],p=gTeam(tk);clearTimeout(gTimer);S.view={team:tk,data:d};S.practice=p.prac;S.case=p.cid;S.slot=p.slot;S.name=d.team||'Equipo '+p.slot;ST=JSON.parse(JSON.stringify(d));ST.ai=ST.ai||{};window.scrollTo(0,0);return route();}

/* =====================================================================
   MATRIZ DE RESTRICCIONES · Etapa 3  (misma lógica que Matriz_restricciones.xlsx)
   ===================================================================== */
const CRIT=[['inv','Costo'],['tie','Tiempo'],['per','Personal']];
const ESCALA={inv:['Sin costo adicional: reorganizar lo que ya existe','Bajo: cabe en el presupuesto del área','Medio: requiere aprobación de la gerencia','Alto: requiere aprobación de la junta','Muy alto: inversión mayor o costo recurrente'],
 tie:['Menos de 1 mes','De 1 a 3 meses','De 3 a 6 meses','De 6 a 12 meses','Más de 12 meses'],
 per:['Una o dos personas de un área','Un equipo completo','Dos o tres áreas','Varias áreas, con capacitación','Toda la organización o contratar personal']};
const LV=[['Muy baja restricción','#1d7552','Aplicar ya (fase 1)'],['Baja restricción','#5aa77f','Aplicar ya (fase 1)'],['Media restricción','#c99400','Por fases (fase 2)'],['Muy alta restricción','#c0392b','Postergar o rediseñar']];
const uid=()=>Math.random().toString(36).slice(2,9);
const pesos=()=>PESOS[curCaseId()];
function calc(rows=ST.rows,cid=curCaseId()){const P=PESOS[cid]||PESOS.andes;const R=(rows||[]).filter(r=>!r.fuera).map(r=>{const ok=!!(r.inv&&r.tie&&r.per);return {...r,ok,pt:ok?(r.inv*P.inv+r.tie*P.tie+r.per*P.per)/100:null,lv:null};});
  const v=R.filter(r=>r.ok).map(r=>r.pt);const n=v.length;let st=null;
  // Misma fórmula del Excel: rango = máx − mín; intervalos = 1 + 3,322·log10(n); tamaño = rango/intervalos; R1 parte de 1.
  if(n){const mn=Math.min(...v),mx=Math.max(...v),rg=mx-mn,k=1+3.322*Math.log10(n),c=rg/k,L=[1,1+c,1+2*c,1+3*c],e=1e-9;st={n,mn,mx,rg,k,c,L};
    R.forEach(r=>{if(!r.ok)return;const x=r.pt;r.lv=(x>=L[0]-e&&x<=L[1]+e)?0:(x<=L[2]+e)?1:(x<=L[3]+e)?2:3;});}
  return {R,st};}
function decide(r){if(r.lv==null)return '';if(r.cuello&&r.lv===3)return 'Ataca el cuello: defiéndanla con un plan por fases';if(!r.cuello&&r.lv<=1)return 'Fácil, pero no ataca el cuello: complemento';return LV[r.lv][2];}
const APP={

 fresh(c){const m=CASES[c].mejoras||[];return {rows:m.map(([cat,causa,mejora])=>({id:uid(),cat,causa,mejora,cuello:false,inv:0,tie:0,per:0})),ai:{}};},
 brief(d){const r=d.rows||[];return `${r.length} mejoras · ${r.filter(x=>x.inv&&x.tie&&x.per).length} valoradas`;},
 render(){const c=curCase(),P=pesos();return `
  <div class="card"><span class="label">${esc(c.n)} · cliente: ${esc(c.cliente)}</span><h2><span class="n">01</span>Los pesos del cliente</h2>
   <div class="row">${CRIT.map(([k,l])=>`<span class="pill"><b>${l}</b> ${P[k]}%</span>`).join('')}<span class="note">Los fija el cliente. Si no están de acuerdo, argumenten ante él; aquí no se cambian.</span></div>
   ${S.case==='andes'?'':`<div class="row"><span class="label">Modo</span><div class="seg"><button data-mode="real" class="${S.practice?'':'on'}">Mi caso</button><button data-mode="prac" class="${S.practice?'on':''}">Práctica: Andes Contact</button></div></div>`}
   <details><summary class="link" style="cursor:pointer">Ver la escala de 1 a 5</summary><div class="tbl" style="margin-top:10px"><table><thead><tr><th></th>${CRIT.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${[0,1,2,3,4].map(i=>`<tr><td class="num"><b>${i+1}</b></td>${CRIT.map(([k])=>`<td>${ESCALA[k][i]}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="note" style="margin-top:6px">1 = exige poco, 5 = exige mucho. Un puntaje alto significa que la mejora es más difícil de implementar.</p></details></div>

  <div class="card"><h2><span class="n">02</span>Las mejoras</h2>
   <p class="lead">${S.practice?'Seis mejoras de práctica ya escritas: valórenlas de 1 a 5.':'Sus causas se cargan solas desde su Ishikawa (las descartadas no). Para cada causa, escriban la mejora y valoren de 1 a 5 cuánto exige en costo, tiempo y personal.'}</p>
   <div class="row">${S.practice?'':`<button class="btn gold sm" data-import>Traer lo último del Ishikawa</button>`}<button class="btn ghost sm" data-addrow>+ Agregar mejora</button>${cloudOn()?`<button class="btn ghost sm" data-act="recover" title="Si perdieron el avance en esta computadora, trae lo último que su equipo guardó en la base de datos">⟲ Recuperar lo último guardado</button>`:''}</div>
   <div class="tbl"><table class="mtx" style="min-width:1040px"><thead><tr><th>#</th><th>Espina</th><th style="min-width:150px">Causa que ataca</th><th style="min-width:190px">Mejora propuesta</th><th>¿Cuello?</th>${CRIT.map(([,l])=>`<th>${l}<br><span style="font-weight:400">${pesos()[CRIT.find(c=>c[1]===l)[0]]}%</span></th>`).join('')}<th>Puntaje</th><th>Nivel</th><th></th></tr></thead>
   <tbody>${ST.rows.map((r,i)=>`<tr><td class="num">${i+1}</td><td><select data-k="rows.${i}.cat" style="font-size:13px;padding:6px;min-width:128px;max-width:150px">${CATS.map(([k,n])=>`<option value="${k}"${r.cat===k?' selected':''}>${n}</option>`).join('')}</select></td>
     <td style="font-size:13px">${r.src?`${esc(r.causa)}${r.fuera?'<br><span class="err" style="font-size:12px">Ya no está en su Ishikawa (o la descartaron): bórrenla si no aplica.</span>':'<br><span class="note" style="font-size:11.5px">desde su Ishikawa</span>'}`:`<textarea data-k="rows.${i}.causa" rows="3" style="min-height:0;font-size:13px">${esc(r.causa)}</textarea>`}</td><td><textarea data-k="rows.${i}.mejora" rows="3" style="min-height:0;font-size:13px" placeholder="¿Qué cambia en el proceso?">${esc(r.mejora)}</textarea></td>
     <td style="text-align:center"><input type="checkbox" data-k="rows.${i}.cuello"${r.cuello?' checked':''} style="width:18px;height:18px"></td>
     ${CRIT.map(([k])=>`<td><select data-k="rows.${i}.${k}" data-num style="font-size:14px;padding:6px;width:56px"><option value="0">–</option>${[1,2,3,4,5].map(v=>`<option value="${v}"${r[k]===v?' selected':''} title="${ESCALA[k][v-1]}">${v}</option>`).join('')}</select></td>`).join('')}
     <td class="num" id="pt-${r.id}">–</td><td id="lv-${r.id}" style="min-width:140px"></td><td><button class="x" data-delrow="${r.id}">×</button></td></tr>`).join('')||`<tr><td colspan="11" class="note">Sin mejoras todavía. Importen sus causas del Ishikawa o agreguen una fila.</td></tr>`}</tbody></table></div></div>

  <div class="card"><h2><span class="n">03</span>Resultado</h2>
   <div class="grid2"><div><span class="label">Mejoras ordenadas por restricción</span><div class="svgbox" id="chart" style="margin-top:8px"></div><div class="row" style="margin-top:8px"><button class="btn sm" data-png>Descargar PNG</button><button class="btn ghost sm" data-csv>Descargar CSV</button></div></div>
   <div style="display:flex;flex-direction:column;gap:12px"><div><span class="label">Escala de restricción (se calcula sola)</span><div id="sturges" class="note" style="margin-top:6px"></div></div><div><span class="label">Hoja de ruta sugerida</span><div id="road" style="margin-top:6px;font-size:14px"></div></div></div></div></div>

  <div class="card"><h2><span class="n">04</span>Revisión externa</h2>${aiBox('socio')}</div>

  <div class="card"><h2><span class="n">05</span>Resumen de su matriz</h2>
   <pre id="sum" style="white-space:pre-wrap;font:13px/1.55 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;max-height:300px;overflow:auto"></pre>
   <div class="row"><button class="btn sm" data-copysum>Copiar resumen</button></div></div>

  <div class="card"><h2><span class="n">06</span>Prompt para armar sus diapositivas</h2>
   <p class="lead">Junta lo que tienen en su Ishikawa (problema, hipótesis, causas, causas raíz y descartadas) y en esta matriz (mejoras priorizadas). Pegan el prompt en Claude, ChatGPT o Canva y obtienen un borrador de diapositivas para editar y mejorar.</p>
   <div class="row"><button class="btn gold sm" data-gp="full">Generar el prompt de sus diapositivas</button><span class="note">Un solo prompt con el Ishikawa y la matriz. Sirve en Claude, ChatGPT o Canva.</span></div>
   <textarea id="slideprompt" rows="12" style="font:12.5px/1.5 var(--mono)" placeholder="Pulsen el botón: el prompt aparece aquí y lo pueden editar antes de copiarlo."></textarea>
   <div class="row"><button class="btn sm" data-copyprompt>Copiar prompt</button><span class="note" id="promptlen"></span></div>
   <p class="note">La IA arma un borrador: revisen cada dato contra su trabajo. Lo que falte (proceso actual, métricas, estudios) aparece como [POR COMPLETAR].</p></div>`;},
 live(){const {R,st}=calc();
   R.forEach(r=>{const a=$('#pt-'+r.id),b=$('#lv-'+r.id);if(!a)return;a.textContent=r.ok?r.pt.toFixed(2):'–';b.innerHTML=r.ok?`<span class="pill" style="border-color:${LV[r.lv][1]};color:${LV[r.lv][1]};font-weight:600">${LV[r.lv][0]}</span><br><span class="note" style="font-size:12px">${decide(r)}</span>`:'<span class="note">Falta valorar</span>';});
   const ch=$('#chart');if(ch)ch.innerHTML=chartSVG(R);
   const s=$('#sturges');if(s){if(!st)s.innerHTML='Valoren al menos una mejora en los tres criterios.';else{const f=v=>v.toFixed(2),L=st.L,cnt=i=>R.filter(r=>r.lv===i).length;
     s.innerHTML=`<div class="tbl"><table><thead><tr><th>Intervalo</th><th>Rango</th><th>Clasificación</th><th>Mejoras</th></tr></thead><tbody>${[['R1',`${f(L[0])} ≤ x ≤ ${f(L[1])}`],['R2',`${f(L[1])} < x ≤ ${f(L[2])}`],['R3',`${f(L[2])} < x ≤ ${f(L[3])}`],['R4',`x > ${f(L[3])}`]].map(([r,t],i)=>`<tr><td class="num">${r}</td><td class="num">${t}</td><td><span class="dot" style="background:${LV[i][1]}"></span> ${LV[i][0]}</td><td class="num">${cnt(i)}</td></tr>`).join('')}</tbody></table></div>
     <p style="margin-top:8px">n = ${st.n} mejoras valoradas · Rango = ${f(st.mx)} − ${f(st.mn)} = <b>${f(st.rg)}</b> · N.º de intervalos = 1 + 3,322·log₁₀(${st.n}) = <b>${f(st.k)}</b> · Tamaño = <b>${f(st.c)}</b>. Los intervalos parten de 1, el mínimo posible.</p>${st.n<3?'<p style="color:var(--signal)">Con menos de 3 mejoras valoradas la escala todavía no discrimina.</p>':''}`;}}
   const rd=$('#road');if(rd){const f=[[0,1],[2],[3]].map(ls=>R.filter(r=>r.ok&&ls.includes(r.lv)).sort((a,b)=>a.pt-b.pt));
     rd.innerHTML=['Fase 1 · aplicar ya','Fase 2 · por fases','Postergar o rediseñar'].map((t,i)=>`<p style="margin-top:6px"><b>${t}</b></p>${f[i].length?'<ul style="margin:2px 0;padding-left:18px">'+f[i].map(r=>`<li>${esc(r.mejora||'(sin texto)')}${r.cuello?' <span class="pill" style="font-size:11px">ataca el cuello</span>':''}</li>`).join('')+'</ul>':'<p class="note">—</p>'}`).join('')+
       (R.some(r=>r.ok&&r.lv<=1&&r.cuello)?'':R.some(r=>r.ok)?'<p class="err" style="margin-top:8px">Ninguna mejora de fase 1 ataca el cuello. Revisen si el plan cambia de verdad el resultado.</p>':'');}
   const sm=$('#sum');if(sm)sm.textContent=summary(R,st);},

     return dl('matriz-'+teamKey()+'.csv',new Blob(['﻿'+L.join('\n')],{type:'text/csv'}));}

 }
};
function chartSVG(R){const r=R.filter(x=>x.ok).sort((a,b)=>a.pt-b.pt);const W=640,rh=34,H=Math.max(1,r.length)*rh+40,lx=250,bw=W-lx-60;const F='Arial, Helvetica, sans-serif';
  let g=`<rect width="${W}" height="${H}" fill="#fff"/>`;if(!r.length)g+=`<text x="20" y="30" font-family="${F}" font-size="13" fill="#51607a">Valoren las mejoras para ver el gráfico.</text>`;
  [1,2,3,4,5].forEach(v=>{const x=lx+bw*(v/5);g+=`<line x1="${x}" x2="${x}" y1="6" y2="${H-24}" stroke="#e8edf5"/><text x="${x}" y="${H-8}" text-anchor="middle" font-family="${F}" font-size="11" fill="#51607a">${v}</text>`;});
  r.forEach((x,i)=>{const y=8+i*rh,w=bw*x.pt/5,L=wrapT(x.mejora||'(sin texto)',36).slice(0,2);
    g+=L.map((l,j)=>`<text x="${lx-10}" y="${y+(L.length>1?12:18)+j*13}" text-anchor="end" font-family="${F}" font-size="11.5" fill="#0b2447"${x.cuello?' font-weight="700"':''}>${esc(j===1&&wrapT(x.mejora,36).length>2?l.slice(0,33)+'…':l)}</text>`).join('')+
      `<rect x="${lx}" y="${y+4}" width="${w}" height="20" rx="3" fill="${LV[x.lv][1]}"/><text x="${lx+w+6}" y="${y+18}" font-family="${F}" font-size="12" fill="#0b2447">${x.pt.toFixed(2)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="min-width:0">${g}</svg>`;}
function wrapT(t,n){const w=String(t).split(/\s+/),L=[];let l='';w.forEach(x=>{if((l+' '+x).trim().length>n){if(l)L.push(l);l=x;}else l=(l+' '+x).trim();});if(l)L.push(l);return L;}
function summary(R,st){const c=curCase(),P=pesos();const L=[`MATRIZ DE RESTRICCIONES · ${c.n}`,`Pesos del cliente: costo ${P.inv}% · tiempo ${P.tie}% · personal ${P.per}%`,''];
  R.forEach((r,i)=>L.push(`${i+1}. ${r.mejora||'(sin texto)'}\n   Causa: ${r.causa||'–'} [${CATN[r.cat]}]${r.cuello?' · ataca el cuello':''}\n   Costo ${r.inv||'–'} · Tiempo ${r.tie||'–'} · Personal ${r.per||'–'} → ${r.ok?r.pt.toFixed(2)+' · '+LV[r.lv][0]+' · '+decide(r):'sin valorar'}`));
  return L.join('\n');}
AI.socio={title:'Revisión del socio',desc:'Revisa si sus valoraciones son consistentes, si las mejoras cambian el proceso o solo agregan programas, y si la fase 1 ataca el cuello.',
 build:()=>{const {R,st}=calc();return {prompt:`CASO DEL CLIENTE\n${curCase().ficha}\n\nMATRIZ DEL EQUIPO\n${summary(R,st)}\n\nEscala: 1 = exige poco, 5 = exige mucho. Puntaje alto = más difícil de implementar.\n\nTAREA\n1. Señala hasta 3 valoraciones que parezcan inconsistentes (por ejemplo, algo que involucra a toda la organización con "personas = 1") y por qué.\n2. Indica qué mejoras cambian el proceso y cuáles solo agregan un programa o una campaña.\n3. ¿Las mejoras de fase 1 atacan el cuello de botella? Si no, dilo claro.\n4. Propón en tres líneas cómo ordenarían las fases ante el cliente.`};}};

/* ---- prompt para diapositivas (Ishikawa + matriz) ---- */
const EVP={'':'sin fuente',caso:'dato del caso',estudio:'estudio científico',voces:'voces de grupos de interés',exp:'experiencia profesional',sup:'supuesto'};
function slidePrompt(ik){const c=curCase(),P=pesos(),{R,st}=calc();const team=S.name||('Equipo '+S.slot);
  const C=(ik&&ik.causas)||[],act=C.filter(x=>x.st!=='descartada'),raiz=C.filter(x=>x.st==='raiz'),desc=C.filter(x=>x.st==='descartada');
  const prob=(ik&&ik.efecto)||'[POR COMPLETAR: problema]',hip=(ik&&ik.hip)||'[POR COMPLETAR: hipótesis]';
  const ok=R.filter(r=>r.ok).sort((a,b)=>a.pt-b.pt);const fase=(i)=>ok.filter(r=>i===1?r.lv<=1:i===2?r.lv===2:r.lv===3);
  const mej=r=>`${r.mejora||'(mejora sin texto)'} — causa: ${r.causa||'–'}; costo ${r.inv}, tiempo ${r.tie}, personal ${r.per}; total ${r.pt.toFixed(2)}; ${LV[r.lv][0].toLowerCase()}`;
  const L=[`Actúa como consultor senior de procesos de gestión humana y como diseñador de presentaciones ejecutivas.`,
   `Arma el contenido de una presentación para la dirección de nuestro cliente con la información de abajo. Es un caso ficticio de uso académico (Maestría en Gerencia y Desarrollo de Personas, Universidad de La Sabana).`,
   `REGLAS: no inventes datos, cifras, nombres ni estudios. Usa solo lo que está aquí. Si algo falta, escríbelo como [POR COMPLETAR: qué falta]. Escribe en español, en tono ejecutivo y directo.`,'',
   `CONTEXTO`,`- Cliente: ${c.n} · ${c.cliente}`,`- Proceso: ${c.proceso}`,`- Lo que pidió el cliente: "${c.encargo}"`,`- Consultora: ${team}`,'',
   `PROBLEMA (efecto)`,`- ${prob}`,'',`HIPÓTESIS DEL CUELLO DE BOTELLA`,`- ${hip}`,'',
   `DIAGNÓSTICO: DIAGRAMA DE ISHIKAWA (causa · fuente de evidencia)`];
  if(ik&&act.length)CATS.forEach(([k,n])=>{const l=act.filter(x=>x.cat===k);if(l.length)L.push(`${n}:`,...l.map(x=>`  - ${x.t} · ${EVP[x.ev||'']}${x.st==='raiz'?' · CAUSA RAÍZ':''}`));});else L.push('- [POR COMPLETAR: causas del Ishikawa]');
  L.push('',`CAUSAS RAÍZ (máximo 3)`,...(raiz.length?raiz.map(x=>`- ${x.t} (${CATN[x.cat]}; ${EVP[x.ev||'']})`):['- [POR COMPLETAR]']));
  L.push('',`EXPLICACIONES DESCARTADAS`,...(desc.length?desc.map(x=>`- ${x.t}${x.nota?': '+x.nota:''}`):['- Ninguna registrada']));
  L.push('',`MATRIZ DE RESTRICCIONES`,`- Pesos del cliente: costo ${P.inv}%, tiempo ${P.tie}%, personal ${P.per}%. Escala de 1 (exige poco) a 5 (exige mucho). Total ponderado más alto = más difícil de implementar.`);
  if(st)L.push(`- Escala de restricción (Sturges): muy baja hasta ${st.L[1].toFixed(2)}; baja hasta ${st.L[2].toFixed(2)}; media hasta ${st.L[3].toFixed(2)}; muy alta sobre ${st.L[3].toFixed(2)}.`);
  L.push(`- Mejoras valoradas, de menor a mayor restricción:`,...(ok.length?ok.map(r=>`  - ${mej(r)}`):['  - [POR COMPLETAR: valoren sus mejoras]']));
  const pend=R.filter(r=>!r.ok);if(pend.length)L.push(`- Sin valorar todavía: ${pend.map(r=>r.mejora||r.causa).join('; ')}`);
  L.push('',`HOJA DE RUTA SEGÚN LA MATRIZ`,`- Fase 1 (aplicar ya: muy baja y baja restricción): ${fase(1).map(r=>r.mejora).join('; ')||'—'}`,`- Fase 2 (por fases: media restricción): ${fase(2).map(r=>r.mejora).join('; ')||'—'}`,`- Postergar o rediseñar (muy alta restricción): ${fase(3).map(r=>r.mejora).join('; ')||'—'}`,'',
   `ESTRUCTURA DE LA PRESENTACIÓN (8 diapositivas)`,
   `1. Portada: un título que diga la recomendación en una frase.`,
   `2. El encargo y la pregunta operacional: lo que pidió el cliente, el problema con su dato y por qué miramos el proceso.`,
   `3. Proceso actual: [POR COMPLETAR: mapa con esperas y traspasos]; deja un espacio para el diagrama.`,
   `4. Cuello de botella: la hipótesis en una frase y lo que la sostiene.`,
   `5. Validación: el Ishikawa resumido (las seis espinas), las causas raíz con su fuente y las explicaciones descartadas.`,
   `6. Mejoras priorizadas: la matriz de restricciones como tabla o gráfico de barras, coloreado por nivel de restricción.`,
   `7. Implementación por fases: fase 1, fase 2 y lo que se posterga, con responsables [POR COMPLETAR].`,
   `8. Métricas e impacto: indicadores de proceso, resultado y experiencia con línea base, meta y plazo [POR COMPLETAR].`,'',
   `FORMATO DE SALIDA, para cada diapositiva:`,`- Título (máximo 10 palabras, que sea una afirmación, no un tema).`,`- 3 o 4 viñetas cortas.`,`- Visual sugerido (diagrama, tabla o gráfico) y qué datos lleva.`,`- Notas del expositor (2 o 3 líneas).`,
   `Al final, lista los [POR COMPLETAR] que debemos resolver antes de exponer.`);
  return L.join('\n');}

/* ---- sincronización con el Ishikawa del mismo equipo ---- */
async function syncIk(verbose){if(S.practice||S.slot==='P'||ro())return 0;const ik=await loadOther('ishikawa');
  if(!ik||!ik.causas||!ik.causas.length){if(verbose)toast('Todavía no encuentro causas en su Ishikawa');return verbose?-1:0;}
  const src=ik.causas.filter(x=>x.st!=='descartada');const ids=new Set(src.map(x=>x.id));let ch=0;
  src.forEach(x=>{let r=ST.rows.find(r=>r.src===x.id)||ST.rows.find(r=>!r.src&&r.causa.trim().toLowerCase()===x.t.trim().toLowerCase());
    if(!r){ST.rows.push({id:uid(),src:x.id,cat:x.cat,causa:x.t,mejora:x.mej||'',cuello:x.st==='raiz',inv:x.inv||0,tie:x.tie||0,per:x.per||0});ch++;}
    else{if(!r.src){r.src=x.id;ch++;}if(r.causa!==x.t||r.cat!==x.cat){r.causa=x.t;r.cat=x.cat;ch++;}if(r.fuera){delete r.fuera;ch++;}}});
  ST.rows.forEach(r=>{if(r.src&&!ids.has(r.src)&&!r.fuera){r.fuera=true;ch++;}});
  ST.rows.sort((a,b)=>CATS.findIndex(c=>c[0]===a.cat)-CATS.findIndex(c=>c[0]===b.cat));
  if(ch)save();if(verbose)toast(ch?'Causas actualizadas desde su Ishikawa':'Ya está al día con su Ishikawa');return ch;}
APP.afterLoad=()=>syncIk(false);

 txt(tk,d){const p=gTeam(tk);return calc(d.rows,p.prac?'andes':p.cid).R.map((r,i)=>`${i+1}. ${r.mejora||'–'} (causa: ${r.causa||'–'})${r.cuello?' · ataca el cuello':''} · Inv ${r.inv||'–'} · Tiempo ${r.tie||'–'} · Personas ${r.per||'–'} → ${r.ok?r.pt.toFixed(2)+' · '+LV[r.lv][0]:'sin valorar'}`).join('\n');}};
