async function copyTxt(t){try{await navigator.clipboard.writeText(t);toast('Copiado');}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copiado');}catch(x){toast('No se pudo copiar');}a.remove();}}
function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function svgPng(svg,name,scale=2){const xml=new XMLSerializer().serializeToString(svg);const vb=svg.viewBox.baseVal;const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=vb.width*scale;c.height=vb.height*scale;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>dl(name,b),'image/png');};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);}
function svgFile(svg,name){dl(name,new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}));}
const teamKey=()=>S.practice?`andes-${S.case}-${S.slot}`:`${S.case}-${S.slot}`;
const curCase=()=>CASES[S.practice?'andes':S.case];
const curCaseId=()=>S.practice?'andes':S.case;
const ro=()=>!!S.view;

function normEmail(v){v=(v||'').trim().toLowerCase();if(v&&!v.includes('@'))v+='@'+CFG.DOMAIN;return v;}
const isAdm=e=>CFG.ADMINS.map(x=>x.toLowerCase()).includes(e);
function allowed(e){return isAdm(e)||(e.endsWith('@'+CFG.DOMAIN)&&CFG.USERS.includes(e.split('@')[0]));}

async function api(path,body){const r=await fetch(CFG.WORKER_URL.replace(/\/$/,'')+path,{method:body?'POST':'GET',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Error '+r.status));return j;}

/* ---- base de datos del curso (JSONBin) ---- */
const binOn=()=>!!(CFG.BIN_ID&&CFG.BIN_KEY);
let _hdr=LS.get('sab-binhdr')||'X-Access-Key';
const binOf=app=>(CFG.BINS&&CFG.BINS[app])||CFG.BIN_ID;
async function binFetch(method,body,bin=binOf(APP.id)){const url=`https://api.jsonbin.io/v3/b/${bin}${method==='GET'?'/latest':''}`;
  for(const h of [_hdr,_hdr==='X-Access-Key'?'X-Master-Key':'X-Access-Key']){
    const r=await fetch(url,{method,cache:'no-store',headers:{[h]:CFG.BIN_KEY,'X-Bin-Meta':'false',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
    if(r.status===401||r.status===403)continue;
    if(h!==_hdr){_hdr=h;LS.set('sab-binhdr',h);}
    if(!r.ok)throw new Error('JSONBin '+r.status);
    if(method!=='GET')return true;const j=await r.json();return j&&j.record&&j.metadata?j.record:j;}
  throw new Error('La clave del BIN no tiene permiso');}
let _q=Promise.resolve();
function binUpdate(fn){_q=_q.then(async()=>{let r=await binFetch('GET');if(!r||typeof r!=='object'||Array.isArray(r))r={};fn(r);await binFetch('PUT',r);const t=$('#syncst');if(t)t.textContent='Guardado en la nube a las '+new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});}).catch(e=>{console.warn(e);const t=$('#syncst');if(t)t.textContent='Sin conexión con la nube: guardado en este navegador';});return _q;}
function touchUser(r,app){if(S.slot==='P')return;r.users=r.users||{};const u=r.users[S.email]||{email:S.email,apps:{}};Object.assign(u,{case:S.case,slot:S.slot,name:S.name,last:Date.now()});u.apps=u.apps||{};u.apps[app]=Date.now();r.users[S.email]=u;}
const cloudOn=()=>binOn()&&S.slot!=='P';
let _dirty=false;
function pushCloud(){if(!_dirty||!ST||!cloudOn())return _q;_dirty=false;const app=APP.id,tk=teamKey(),data=JSON.parse(JSON.stringify(ST));return binUpdate(r=>{r.apps=r.apps||{};r.apps[app]=r.apps[app]||{};r.apps[app][tk]=data;touchUser(r,app);});}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')pushCloud();});
window.addEventListener('pagehide',()=>pushCloud());

/* ---- estado por equipo ---- */
function localKey(){return `sab-${APP.id}-${teamKey()}`;}
async function loadState(){
  let st=LS.get(localKey());
  if(binOn()){try{const r=await binFetch('GET');const d=r&&r.apps&&r.apps[APP.id]&&r.apps[APP.id][teamKey()];if(d&&(!st||(d.upd||0)>(st.upd||0)))st=d;}catch(e){}if(S.slot!=='P')binUpdate(r=>touchUser(r,APP.id));}
  else if(CFG.WORKER_URL){try{const j=await api(`/load?app=${APP.id}&team=${encodeURIComponent(teamKey())}&email=${encodeURIComponent(S.email)}`);if(j&&j.data&&(!st||(j.data.upd||0)>(st.upd||0)))st=j.data;}catch(e){}}
  ST=st||(S.case==='andes'&&S.slot==='P'&&APP.example?APP.example():APP.fresh(curCaseId()));ST.ai=ST.ai||{};
}
let _cloudT=null;
setInterval(()=>{if(_dirty&&!S.doc)pushCloud();},5000);   // autoguardado en la nube cada 5 segundos
function save(){if(ro())return;ST.upd=Date.now();ST.by=S.email;ST.team=S.name;LS.set(localKey(),ST);
  if(cloudOn()){_dirty=true;const t=$('#syncst');if(t)t.textContent='Guardando…';}
  else if(CFG.WORKER_URL&&!binOn()){clearTimeout(_cloudT);_cloudT=setTimeout(()=>api('/save',{email:S.email,app:APP.id,team:teamKey(),data:ST}).catch(()=>toast('Sin conexión: guardado solo en este navegador')),1500);}}
async function loadOther(app){ // lee el trabajo del mismo equipo en otra herramienta (p. ej., el Ishikawa desde la matriz)
  const tk=`${S.case}-${S.slot}`;let st=LS.get(`sab-${app}-${tk}`);
  if(binOn()){try{const r=await binFetch('GET',null,binOf(app));const d=r&&r.apps&&r.apps[app]&&r.apps[app][tk];if(d&&(!st||(d.upd||0)>(st.upd||0)))st=d;}catch(e){}}
  else if(CFG.WORKER_URL){try{const j=await api(`/load?app=${app}&team=${encodeURIComponent(tk)}&email=${encodeURIComponent(S.email)}`);if(j&&j.data&&(!st||(j.data.upd||0)>(st.upd||0)))st=j.data;}catch(e){}}
  return st;}

function setPath(o,p,v){const k=p.split('.');let x=o;for(let i=0;i<k.length-1;i++)x=x[k[i]];x[k[k.length-1]]=v;}
function getPath(o,p){return p.split('.').reduce((x,k)=>x==null?x:x[k],o);}

/* ---- IA ---- */
function aiBox(id){const t=AI[id];const has=!!CFG.WORKER_URL;return `<div class="aibox"><h3>${t.title}</h3><p class="note">${t.desc}</p>
  <div class="row">${has?`<button class="btn ai sm" data-ai="${id}"${ro()?' disabled':''}>Pedir a Claude</button>`:''}<button class="btn ghost sm" data-aicopy="${id}">Copiar prompt${has?'':' para su IA'}</button>${t.after?`<button class="btn ghost sm" data-aiuse="${id}"${ro()?' disabled':''}>${t.afterLabel||'Usar la respuesta'}</button>`:''}</div>
  ${has?'':`<p class="note">Copien el prompt, péguenlo en Claude, ChatGPT o Gemini y traigan la respuesta aquí.</p>`}
  <textarea class="aiout" data-k="ai.${id}" placeholder="${has?'La respuesta de Claude aparece aquí. Pueden editarla.':'Peguen aquí la respuesta de su IA.'}">${esc(ST.ai[id]||'')}</textarea></div>`;}
async function runAI(id,btn){const t=AI[id];const {system,prompt}=t.build();const old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span> Pensando…';
  try{const j=await api('/ai',{email:S.email,app:APP.id,system:system||SYS,prompt});ST.ai[id]=j.text||'';save();const ta=document.querySelector(`[data-k="ai.${id}"]`);if(ta)ta.value=ST.ai[id];if(t.auto&&t.after)t.after(ST.ai[id]);}
  catch(e){toast(e.message||'No se pudo consultar a Claude');}finally{btn.disabled=false;btn.innerHTML=old;}}
function aiPrompt(id){const {system,prompt}=AI[id].build();return (system||SYS)+'\n\n'+prompt;}

  ${APP.renderDoc?`<details style="border-top:1px solid var(--line);padding-top:12px"><summary class="link" style="cursor:pointer">Acceso docente</summary><div style="display:flex;flex-direction:column;gap:10px;margin-top:10px"><label class="f">DNI del docente<input type="password" id="dni" inputmode="numeric" autocomplete="off"></label><button class="btn ghost" data-act="doclogin">Entrar como docente</button></div></details>`:''}</div>`;}
function viewTeam(){const t=LS.get('sab-team-'+S.email)||{};const cs=t.case||'',sl=t.slot||(S.admin?'P':'A');

async function viewPanel(){let rows=[];try{const j=await api('/list',{app:APP.id,key:S.key});rows=j.items||[];}catch(e){return `<div class="card"><h2>Panel del profesor</h2><p class="err">${esc(e.message)}. Revisa la clave del panel.</p><div class="row"><button class="btn ghost" data-act="back">Volver</button></div></div>`;}
  rows.sort((a,b)=>(b.data?.upd||0)-(a.data?.upd||0));window._panel=rows;

  <div class="row"><button class="btn ghost" data-act="back">Volver a mi trabajo</button></div></div>`;}

async function route(){header();const app=$('#app');
  if(S.doc&&!S.view){app.innerHTML='<div class="card"><p class="note">Cargando…</p></div>';app.innerHTML=await APP.renderDoc();return;}
  if(!S.email&&!S.doc){app.innerHTML=viewLogin();bindLogin();return;}
  if(!S.case){app.innerHTML=viewTeam();return;}
  if(S.panel){app.innerHTML='<div class="card"><p class="note">Cargando…</p></div>';app.innerHTML=await viewPanel();return;}
  if(!ST){await loadState();if(APP.afterLoad)await APP.afterLoad();}
  app.innerHTML=(S.view?`<div class="banner"><b>Viendo el trabajo de ${esc(S.view.data?.team||S.view.team)}</b><span class="note">Solo lectura.</span><button class="btn sm" data-act="unview">Volver al panel</button></div>`:'')+`<fieldset class="ro"${ro()?' disabled':''}>${APP.render()}</fieldset><p class="foot">${cloudOn()?`Guardado automático cada 5 segundos en la nube del curso: no necesitan guardar. <b><span id="syncst"></span></b>`:S.slot==='P'?'Modo profesor: tus cambios se guardan solo en este navegador.':CFG.WORKER_URL?'Se guarda automáticamente para todo el equipo.':'Se guarda automáticamente en este navegador.'} · Casos ficticios, uso académico.</p>`;
  APP.live&&APP.live();}
function bindLogin(){const dn=$('#dni');if(dn)dn.addEventListener('keydown',e=>{if(e.key==='Enter')$('[data-act=doclogin]').click();});const em=$('#em');em.addEventListener('input',()=>{$('#admk').hidden=!(isAdm(normEmail(em.value))&&CFG.WORKER_URL&&!binOn());});em.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});em.focus();}
function doLogin(){const e=normEmail($('#em').value);if(!allowed(e)){$('#app').innerHTML=viewLogin('Ese correo no está en la lista del curso. Escríbelo como aparece en tu cuenta de La Sabana.');bindLogin();return;}
  S.email=e;S.admin=isAdm(e);S.key=S.admin?($('#ak')?.value||''):'';LS.set('sab-session',{email:e,key:S.key});
  setTeam();route();}
function setTeam(){const t=LS.get('sab-team-'+S.email);if(t&&t.case){S.case=t.case;S.slot=t.slot;S.name=t.name||'';}else if(S.admin){S.case='andes';S.slot='P';S.name='Ejemplo del profesor';}}
const isDemo=()=>S.case==='andes'&&S.slot==='P'&&!S.view;

document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
  const a=b.dataset.act;
  if(a==='login')return doLogin();
  if(a==='doclogin'){const v=($('#dni').value||'').replace(/\D/g,'');const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)))].map(x=>x.toString(16).padStart(2,'0')).join('');if(h!==CFG.DOC_DNI_SHA256){$('#app').innerHTML=viewLogin('DNI docente incorrecto.');bindLogin();return;}S.doc=true;S.email=null;sessionStorage.setItem('sab-doc','1');return route();}
  if(a==='out'&&S.doc){S.doc=false;S.view=null;S.case=null;ST=null;sessionStorage.removeItem('sab-doc');return route();}
  if(a==='unview'&&S.doc){S.view=null;S.case=null;S.slot=null;S.practice=false;ST=null;return route();}
  if(a==='out'||a==='team'){clearTimeout(_cloudT);await pushCloud();}
  if(a==='out'){LS.del('sab-session');Object.assign(S,{email:null,admin:false,key:'',case:null,slot:null,name:'',practice:false,view:null,panel:false});ST=null;return route();}
  if(a==='team'){S.case=null;S.view=null;S.panel=false;ST=null;return route();}
  if(a==='panel'){S.panel=true;return route();}
  if(a==='sync'){_dirty=true;clearTimeout(_cloudT);await pushCloud();return toast('Guardado en la nube');}
  if(a==='reload'){_dirty&&await pushCloud();ST=null;await route();return toast('Actualizado');}
  if(a==='reset'){if(!confirmReset(b))return;ST=APP.example();save();return route();}
  if(a==='back'){S.panel=false;S.view=null;S.practice=false;ST=null;return route();}
  if(a==='unview'){S.view=null;S.panel=true;S.practice=false;ST=null;return route();}
  if(a==='teamok'){const p=$('.cpick.on'),sl=$('.seg button.on');if(!p)return toast('Elijan su empresa');S.case=p.dataset.pick;S.slot=sl?sl.dataset.slot:'A';S.name=$('#tn').value.trim();LS.set('sab-team-'+S.email,{case:S.case,slot:S.slot,name:S.name});ST=null;return route();}
  if(b.dataset.pick){document.querySelectorAll('.cpick').forEach(x=>x.classList.toggle('on',x===b));return;}
  if(b.dataset.slot){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));return;}
  if(b.dataset.view){const r=window._panel[+b.dataset.view];S.view=r;S.panel=false;const parts=r.team.split('-');S.practice=parts[0]==='andes';ST=JSON.parse(JSON.stringify(r.data||{}));ST.ai=ST.ai||{};return route();}
  if(b.dataset.ai)return runAI(b.dataset.ai,b);
  if(b.dataset.aicopy)return copyTxt(aiPrompt(b.dataset.aicopy));
  if(b.dataset.aiuse){const id=b.dataset.aiuse;return AI[id].after(ST.ai[id]||'');}
  APP.click&&APP.click(b,e);
});
document.addEventListener('input',e=>{const el=e.target;const k=el.dataset&&el.dataset.k;if(!k||!ST||ro())return;
  let v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.num!==undefined)v=+v||0;setPath(ST,k,v);save();APP.live&&APP.live(el);});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.rerender!==undefined&&!ro())route();});

function confirmReset(b){if(b.dataset.armed)return true;b.dataset.armed='1';b.textContent='¿Seguro? Pulsa otra vez';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Restablecer ejemplo';}},3000);return false;}

  document.title=APP.title+' · La Sabana MGDP';route();}

   <div class="row"><button class="btn ghost sm" data-gd="refresh">Actualizar</button><button class="btn sm" data-gd="xlsx">Descargar todo (Excel)</button><button class="btn ghost sm" data-gd="txt">Todas las respuestas (TXT)</button></div></div>

function checks(){const C=ST.causas,out=[];const raiz=C.filter(x=>x.st==='raiz'),desc=C.filter(x=>x.st==='descartada');
  const emptyCats=CATS.filter(([k])=>C.filter(x=>x.cat===k&&x.st!=='descartada').length<2).map(c=>c[1]);
  out.push([emptyCats.length?'y':'g',emptyCats.length?`Espinas con menos de dos causas: ${emptyCats.join(', ')}`:'Las seis espinas tienen al menos dos causas']);
  const sinF=C.filter(x=>!x.ev&&x.st!=='descartada').length;out.push([sinF?'y':'g',sinF?`${sinF} causa(s) sin fuente de evidencia`:'Todas las causas tienen fuente']);
  out.push([raiz.length===0?'r':raiz.length>3?'y':'g',raiz.length===0?'Aún no eligen causas raíz':raiz.length>3?`${raiz.length} causas raíz: máximo tres`:`${raiz.length} causa(s) raíz elegida(s)`]);
  raiz.forEach(x=>{const ok=x.ev&&x.ev!=='sup';const w=(x.w||[]).filter(Boolean).length;out.push([ok&&w>=3?'g':ok?'y':'r',`Raíz: ${x.t}`,`${ok?'Fuente: '+EVN[x.ev]:'Se apoya solo en un supuesto: busquen un dato del caso o un estudio'} · ${w} de 5 porqués${x.nota?'':' · falta el dato que la desmentiría'}`]);});
  const dn=desc.filter(x=>!x.nota).length;out.push([desc.length===0?'y':dn?'y':'g',desc.length===0?'Ninguna explicación descartada todavía':`${desc.length} descartada(s)${dn?`, ${dn} sin el dato que la descarta`:', todas con su argumento'}`,desc.length===0?'Validar también es descartar: usen al abogado del diablo.':'']);
  const ent=C.filter(x=>x.st==='raiz'&&x.cat==='entorno').length;if(ent)out.push(['y','Hay una causa raíz en “Entorno y mercado”','La empresa no la controla. ¿Qué parte del proceso la amplifica?']);

function summary(){const c=curCase(),C=ST.causas;const L=[`ISHIKAWA · ${c.n}`,`Resultado: ${ST.efecto}`];if(ST.hip)L.push(`Hipótesis: ${ST.hip}`);

function wrapT(t,n){const w=String(t).split(/\s+/),L=[];let l='';w.forEach(x=>{if((l+' '+x).trim().length>n){if(l)L.push(l);l=x;}else l=(l+' '+x).trim();});if(l)L.push(l);return L;}
const cut=(t,n)=>t.length>n?t.slice(0,n-1)+'…':t;
function fishSVG(d=ST,c=curCase(),label=(S.name||('Equipo '+S.slot))){const W=1240,H=660,SY=320,DX=170,top=62,bot=578,XE=[350,640,930];const col={g:'#1d7552',y:'#d9a400',r:'#c0392b',n:'#b7c1d1'};const F='Arial, Helvetica, sans-serif';
  let g=`<rect width="${W}" height="${H}" fill="#fff"/><line x1="40" y1="${SY}" x2="1000" y2="${SY}" stroke="#0b2447" stroke-width="4"/><path d="M1000 ${SY} l-16 -9 v18 z" fill="#0b2447"/>`;
  const hl=wrapT(d.efecto||'Resultado',24).slice(0,6);g+=`<rect x="1004" y="${SY-92}" width="222" height="184" rx="14" fill="#0b2447"/>`+hl.map((l,i)=>`<text x="1115" y="${SY-(hl.length-1)*10+i*20+5}" text-anchor="middle" font-family="${F}" font-size="15" font-weight="700" fill="#fff">${esc(l)}</text>`).join('');
  CATS.forEach(([k,n],ci)=>{const up=ci<3,xe=XE[ci%3],ye=up?top:bot,x0=xe-DX;
    g+=`<line x1="${x0}" y1="${ye}" x2="${xe}" y2="${SY}" stroke="#0b4da2" stroke-width="2.5"/>`;
    const lw=n.length*7.6+22;g+=`<rect x="${x0-lw/2}" y="${up?ye-34:ye+8}" width="${lw}" height="26" rx="13" fill="#e4edf9"/><text x="${x0}" y="${up?ye-16:ye+26}" text-anchor="middle" font-family="${F}" font-size="13.5" font-weight="700" fill="#0b2447">${esc(n)}</text>`;
    const l=(d.causas||[]).filter(x=>x.cat===k),show=l.slice(0,7),N=Math.max(show.length,1);
    show.forEach((x,i)=>{const t=0.12+(i+0.5)*(0.78/N);const px=x0+DX*t,py=ye+(SY-ye)*t;const rz=x.st==='raiz',ds=x.st==='descartada';
      g+=`<line x1="${px-6}" y1="${py}" x2="${px}" y2="${py}" stroke="#8a97ad"/><circle cx="${px}" cy="${py}" r="${rz?6.5:4.5}" fill="${col[EVC[x.ev||'']]}"${rz?' stroke="#f2b91f" stroke-width="3"':''}/>
      ${(()=>{let L=wrapT(x.t,rz?29:32);if(L.length>2)L=[L[0],cut(L.slice(1).join(' '),rz?29:32)];const y0=L.length>1?py-2:py+4;return L.map((l,j)=>`<text x="${px-10}" y="${y0+j*13}" text-anchor="end" font-family="${F}" font-size="${rz?12:11}" font-weight="${rz?700:400}" fill="${ds?'#9aa5b8':'#0b2447'}"${ds?' text-decoration="line-through"':''}>${esc(l)}</text>`).join('');})()}`;});
    if(l.length>7)g+=`<text x="${xe-30}" y="${up?SY-14:SY+22}" font-family="${F}" font-size="11" fill="#51607a">+${l.length-7} más</text>`;
    if(!l.length)g+=`<text x="${x0+DX*.5-8}" y="${ye+(SY-ye)*.5+4}" text-anchor="end" font-family="${F}" font-size="11.5" fill="#9aa5b8" font-style="italic">sin causas todavía</text>`;});
  g+=`<text x="40" y="${H-14}" font-family="${F}" font-size="12" fill="#51607a">${esc(c.n)} · ${esc(label)} · Ishikawa del cuello de botella</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de Ishikawa">${g}</svg>`;}

/* =====================================================================
   VALORACIÓN DE MEJORAS · matriz de restricciones (misma fórmula del Excel)
   Total ponderado = Σ puntaje × peso. Intervalos (Sturges):
   rango = máx − mín; n.º intervalos = 1 + 3,322·log10(n); tamaño = rango / n.º intervalos;
   R1: 1 ≤ x ≤ 1+t (muy baja) · R2: ≤ 1+2t (baja) · R3: ≤ 1+3t (media) · R4: x > 1+3t (muy alta)
   ===================================================================== */
const CRIT=[['inv','Inversión'],['tie','Tiempo'],['per','Personas']];
const ESCALA={inv:['Sin costo adicional: reorganizar lo que existe','Bajo: cabe en el presupuesto del área','Medio: requiere aprobación de gerencia','Alto: requiere aprobación de la junta','Muy alto: inversión mayor o costo recurrente'],
 tie:['Menos de 1 mes','De 1 a 3 meses','De 3 a 6 meses','De 6 a 12 meses','Más de 12 meses'],
 per:['Una o dos personas de un área','Un equipo completo','Dos o tres áreas','Varias áreas, con capacitación','Toda la organización o contratar']};
const LVL=[['Muy baja restricción','#1d7552'],['Baja restricción','#4f9a72'],['Media restricción','#c99400'],['Muy alta restricción','#c0392b']];
function mcalc(d,cid){const P=PESOS[cid]||PESOS.andes;const C=(d.causas||[]).filter(x=>x.st!=='descartada').sort((a,b)=>(a.st==='raiz'?0:1)-(b.st==='raiz'?0:1)||CATS.findIndex(c=>c[0]===a.cat)-CATS.findIndex(c=>c[0]===b.cat));
  const R=C.map(x=>{const ok=!!(x.inv&&x.tie&&x.per);return {x,ok,pt:ok?(x.inv*P.inv+x.tie*P.tie+x.per*P.per)/100:null,lv:null};});
  const v=R.filter(r=>r.ok).map(r=>r.pt),n=v.length;let st=null;
  if(n){const mx=Math.max(...v),mn=Math.min(...v),rg=mx-mn,k=1+3.322*Math.log10(n),t=rg/k,L=[1,1+t,1+2*t,1+3*t];st={n,mx,mn,rg,k,t,L};
    const e=1e-9;R.forEach(r=>{if(!r.ok)return;const x=r.pt;r.lv=(x>=L[0]-e&&x<=L[1]+e)?0:(x>L[1]+e&&x<=L[2]+e)?1:(x>L[2]+e&&x<=L[3]+e)?2:3;});}
  return {R,st,P};}
function matSection(){const P=PESOS[curCaseId()]||PESOS.andes;const {R}=mcalc(ST,curCaseId());
  return `<div class="card"><h2><span class="n">06</span>Valoración de mejoras · matriz de restricciones</h2>
  <p class="lead">Para cada causa vigente, la mejora que proponen. Valoren de 1 a 5 cuánto exige en inversión, tiempo y personas (1 = poco, 5 = mucho). El total y el nivel de restricción se calculan solos.</p>
  <div class="row"><span class="label">Pesos del cliente</span>${CRIT.map(([k,l])=>`<span class="pill"><b>${l}</b> ${P[k]}%</span>`).join('')}<span class="note">Los fija el cliente: no se modifican.</span></div>
  <details><summary class="link" style="cursor:pointer">Ver la escala de 1 a 5</summary><div class="tbl" style="margin-top:8px"><table><thead><tr><th></th>${CRIT.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${[0,1,2,3,4].map(i=>`<tr><td class="num"><b>${i+1}</b></td>${CRIT.map(([k])=>`<td>${ESCALA[k][i]}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>
  ${R.length?`<div class="tbl"><table class="mtx" style="min-width:1000px"><thead><tr><th>Espina</th><th style="min-width:190px">Causa</th><th style="min-width:230px">Mejora propuesta</th>${CRIT.map(([k,l])=>`<th>${l}<br><span style="font-weight:400">${P[k]}%</span></th>`).join('')}<th>Total pond.</th><th>Nivel de restricción</th></tr></thead><tbody>
   ${R.map(r=>{const x=r.x,i=ST.causas.indexOf(x);return `<tr${x.st==='raiz'?' style="background:#fffaf0"':''}><td style="font-size:12.5px">${CATN[x.cat]}${x.st==='raiz'?'<br><span class="pill" style="font-size:11px;border-color:var(--gold)">causa raíz</span>':''}</td><td style="font-size:13px">${esc(x.t)}</td>
    <td><textarea data-k="causas.${i}.mej" rows="2" style="min-height:0;font-size:13px" placeholder="¿Qué cambia en el proceso?">${esc(x.mej||'')}</textarea></td>
    ${CRIT.map(([k])=>`<td><select data-k="causas.${i}.${k}" data-num style="width:58px;padding:6px">${['–',1,2,3,4,5].map((v,j)=>`<option value="${j}"${(x[k]||0)===j?' selected':''}${j?` title="${ESCALA[k][j-1]}"`:''}>${v}</option>`).join('')}</select></td>`).join('')}
    <td class="num" id="mpt-${x.id}">–</td><td id="mlv-${x.id}" style="min-width:150px"></td></tr>`;}).join('')}</tbody></table></div>
   <div class="grid2"><div><span class="label">Escala de restricción (se calcula sola)</span><div class="tbl" style="margin-top:8px"><table><thead><tr><th>Intervalo</th><th>Rango</th><th>Clasificación</th><th>Mejoras</th></tr></thead><tbody id="mscale"></tbody></table></div></div>
   <div><span class="label">Cálculo</span><div id="mparams" class="chk" style="margin-top:8px;font-size:14px"></div></div></div>`
  :`<p class="note">Aún no hay causas vigentes. Agréguenlas en la sección 02.</p>`}</div>`;}
function matLive(){const {R,st}=mcalc(ST,curCaseId());
  R.forEach(r=>{const a=$('#mpt-'+r.x.id),b=$('#mlv-'+r.x.id);if(!a)return;a.textContent=r.ok?r.pt.toFixed(2):'–';b.innerHTML=r.ok?`<span class="pill" style="border-color:${LVL[r.lv][1]};color:${LVL[r.lv][1]};font-weight:700">${LVL[r.lv][0]}</span>`:'<span class="note">Falta valorar</span>';});
  const sc=$('#mscale'),pa=$('#mparams');if(!sc)return;
  if(!st){sc.innerHTML='<tr><td colspan="4" class="note">Valoren al menos una mejora.</td></tr>';pa.innerHTML='';return;}
  const f=v=>v.toFixed(2),cnt=i=>R.filter(r=>r.lv===i).length,L=st.L;
  sc.innerHTML=[['R1',`${f(L[0])} ≤ x ≤ ${f(L[1])}`],['R2',`${f(L[1])} < x ≤ ${f(L[2])}`],['R3',`${f(L[2])} < x ≤ ${f(L[3])}`],['R4',`x > ${f(L[3])}`]].map(([r,t],i)=>`<tr><td class="num">${r}</td><td class="num">${t}</td><td><span class="dot" style="background:${LVL[i][1]}"></span> ${LVL[i][0]}</td><td class="num">${cnt(i)}</td></tr>`).join('');
  pa.innerHTML=[[`Mejoras valoradas (n): <b>${st.n}</b> de ${R.length}`],[`Rango = máx − mín = ${f(st.mx)} − ${f(st.mn)} = <b>${f(st.rg)}</b>`],[`N.º de intervalos = 1 + 3,322 · log₁₀(${st.n}) = <b>${f(st.k)}</b>`],[`Tamaño del intervalo = ${f(st.rg)} / ${f(st.k)} = <b>${f(st.t)}</b>`],[`Los intervalos parten de 1, el mínimo posible de la escala.`]].map(([t])=>`<div style="grid-template-columns:minmax(0,1fr)"><span>${t}</span></div>`).join('')+(st.n<3?`<p class="note" style="color:var(--signal)">Con menos de 3 mejoras valoradas la escala todavía no discrimina: sigan valorando.</p>`:'');}

const hace=t=>{if(!t)return '';const m=Math.round((Date.now()-t)/60000);return m<1?'hace segundos':m<60?`hace ${m} min`:`hace ${Math.round(m/60)} h`;};
function pTeam(tk){const p=tk.split('-');return {slot:p[p.length-1],cid:p[p.length-2],prac:p.length===3};}
function estado(d){const C=d.causas||[];if(!C.length)return ['Sin empezar','n'];const act=C.filter(x=>x.st!=='descartada');const esp=CATS.every(([k])=>act.filter(x=>x.cat===k).length>=2);const raiz=C.some(x=>x.st==='raiz');return esp&&raiz?['Completo · entregado','g']:['En progreso','y'];}

    return (d.causas||[]).map(x=>{const r=m.get(x.id);return [d.team||'Equipo '+p.slot,CASES[p.cid]?.corto||p.cid,CATN[x.cat]||x.cat,x.t,EVN3[x.ev||''],STN[x.st]||x.st,...[0,1,2,3,4].map(j=>(x.w||[])[j]||''),x.nota||''];});}));
  return [['Participantes',S1],['Equipos',S2],['Causas',S3]];}
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
async function docXlsx(){const sh=docSheets(),st=new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');try{await loadXLSX();const wb=XLSX.utils.book_new();sh.forEach(([n,rows])=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=rows[0].map((h,i)=>({wch:Math.min(60,Math.max(10,...rows.slice(0,60).map(r=>String(r[i]??'').length))+2)}));XLSX.utils.book_append_sheet(wb,ws,n);});XLSX.writeFile(wb,`MGDP-ishikawa-${st}.xlsx`);}
  catch(e){toast('Sin conexión al generador de Excel: descargo CSV');const q=t=>'"'+String(t??'').replace(/"/g,'""')+'"';sh.forEach(([n,rows],i)=>setTimeout(()=>dl(`MGDP-${n}-${st}.csv`,new Blob(['﻿'+rows.map(r=>r.map(q).join(';')).join('\n')],{type:'text/csv'})),i*400));}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-dd]');if(!b||!S.doc)return;const a=b.dataset.dd;
  if(a==='refresh')return route();
  if(a==='xlsx')return docXlsx();
  if(a==='png')return teamPng(b.dataset.i);
  if(a==='pngall'){Object.keys(_DB.apps?.ishikawa||{}).filter(tk=>!pTeam(tk).prac).forEach((tk,i)=>setTimeout(()=>teamPng(tk),i*700));return;}
  if(a==='ver'){const tk=b.dataset.i,d=_DB.apps.ishikawa[tk],p=pTeam(tk);clearTimeout(_docT);S.view={team:tk,data:d};S.case=p.cid;S.slot=p.slot;S.name=d.team||'Equipo '+p.slot;S.practice=false;ST=JSON.parse(JSON.stringify(d));ST.ai=ST.ai||{};window.scrollTo(0,0);return route();}
});
