<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notas finales · Consultoría y Rediseño de Procesos · La Sabana</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#f5f7fb;--surface:#fff;--ink:#0b2447;--muted:#51607a;--line:#d7deea;--accent:#0b4da2;--accent-soft:#e4edf9;--gold:#f2b91f;--signal:#8f6700;--signal-soft:#fbf1d2;--ok:#1d7552;
--display:"Source Serif 4",Georgia,serif;--body:"Instrument Sans","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0}
p{margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* acceso */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:16px}
.gate h1{font-size:26px}
.gate p{color:var(--muted);font-size:14.5px}
.gate label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.gate input{font:inherit;border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--bg);color:var(--ink)}
.gate input:focus{outline:none;border-color:var(--accent);background:#fff}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:10px 16px;font-weight:600;font-size:14.5px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);filter:none}
.btn:disabled{opacity:.6;cursor:wait}
.err{color:#b3261e;font-size:13.5px;min-height:1.2em}

/* página */
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap}
.brand span{color:var(--signal)}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.nav a{color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:600;padding:6px 10px;border-radius:8px;white-space:nowrap}
.nav a:hover{background:var(--bg);color:var(--ink)}
.who{font-size:12.5px;color:var(--muted);white-space:nowrap}
.who button{border:0;background:none;color:var(--accent);font-weight:600;padding:0 0 0 8px}
main{padding:26px 0 80px;display:flex;flex-direction:column;gap:38px}
.hero{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:16px;padding:clamp(22px,4vw,38px);display:flex;flex-direction:column;gap:12px}
.hero h1{font-size:clamp(26px,4.4vw,40px);max-width:22ch}
.hero .sub{color:var(--muted);font-size:15.5px;max-width:64ch}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
section{display:flex;flex-direction:column;gap:14px;scroll-margin-top:70px}
section>h2{font-size:24px}
section>.lead{color:var(--muted);max-width:70ch}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
th{white-space:nowrap}
th.wrapok{white-space:normal}
td.final{font-family:var(--mono);font-weight:600;font-size:15px;text-align:center;color:var(--ink);background:var(--signal-soft)}
td.mail{color:var(--muted);font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid3{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.card b.w{font-family:var(--display);font-size:30px;color:var(--signal);line-height:1}
.card h3{font-size:17px}
.card p{font-size:14px;color:var(--muted)}
.note{font-size:13.5px;color:var(--muted)}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.team{display:flex;flex-direction:column;gap:18px}
.team-h{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.team-h h3{font-size:22px}
.team-h .case{color:var(--muted);font-size:14px;margin-top:4px}
.team-h .people{font-size:14px;margin-top:8px}
.scores{display:flex;gap:10px}
.score{border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center;min-width:96px;background:var(--bg)}
.score b{display:block;font-family:var(--mono);font-size:22px}
.score span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
@media (max-width:640px){.team-h{grid-template-columns:minmax(0,1fr)}}
.rub h4{font-family:var(--display);font-size:18px;margin:0 0 8px}
table.rubric{min-width:860px;font-size:13.5px}
table.rubric td:first-child{font-weight:600;min-width:170px}
table.rubric td:first-child small{display:block;font-family:var(--mono);font-weight:400;color:var(--accent);font-size:12px}
table.rubric td.lv{color:var(--muted);width:19%}
table.rubric td.hit{color:var(--ink);background:var(--signal-soft);box-shadow:inset 0 0 0 2px #c99400}
table.rubric td.hit::before{content:"✓ Nivel obtenido";display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--signal);margin-bottom:3px}
table.rubric td.n{font-family:var(--mono);font-weight:600;text-align:center;width:60px}
table.rubric tr.tot td{background:var(--bg);font-weight:700}
.lvl{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.lvl.s{background:#e1f1e9;color:var(--ok)}
.foot{border-top:1px solid var(--line);padding-top:16px;font-size:13px;color:var(--muted)}
.print-only{display:none}

@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;font-size:10px;line-height:1.35}
  .wrap{max-width:none;padding:0}
  .hero{gap:4px}.hero h1{font-size:20px;max-width:none}.hero .sub{font-size:11px}
  section{gap:6px}section>h2{font-size:16px}section>.lead,.note{font-size:10px}
  th,td{padding:4px 7px}th{font-size:8.5px}table{font-size:9.5px}
  td.final{font-size:10.5px}
  .card{padding:8px}.card b.w{font-size:18px}.card h3{font-size:12px}.card p{font-size:9.5px}
  .grid3{grid-template-columns:repeat(3,1fr);gap:8px}
  .team{gap:8px}.team-h{padding:8px 10px}.team-h h3{font-size:15px}.team-h .case,.team-h .people{font-size:10px;margin-top:2px}
  .score{padding:4px 8px;min-width:70px}.score b{font-size:14px}
  .rub h4{font-size:12px;margin-bottom:4px}
  table.rubric{font-size:9px}table.rubric td:first-child{min-width:0;width:17%}
  table.rubric td.hit::before{font-size:7.5px;margin-bottom:1px}
  #conversatorios{break-before:page}
  .foot{font-size:9px;padding-top:6px}
  td.mail{font-size:9px}
  table.rubric td:first-child small{font-size:8.5px!important}
  .top,.actions,.tabs,.no-print{display:none!important}
  .print-only{display:block}
  main{padding:0;gap:18px}
  .hero{border:0;padding:0}
  .team[hidden]{display:flex!important}
  .team{break-before:page}
  .tbl{overflow:visible;border-color:#bbb}
  table.rubric{min-width:0}
  table.rubric td.hit{box-shadow:none;outline:2px solid #c99400;outline-offset:-2px}
  tr{break-inside:avoid}
}
</style>
</head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const te=new TextEncoder(),td=new TextDecoder();
async function idOf(m){const h=await crypto.subtle.digest('SHA-256',te.encode('sabana-notas:'+m));return [...new Uint8Array(h)].slice(0,8).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function unlock(mail){
  const m=mail.trim().toLowerCase();const w=VAULT.keys[await idOf(m)];if(!w)return null;
  const base=await crypto.subtle.importKey('raw',te.encode(m),'PBKDF2',false,['deriveKey']);
  const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(w.salt),iterations:VAULT.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(w.iv)},kek,b64(w.ct));
  const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(VAULT.iv)},k,b64(VAULT.ct));
  return JSON.parse(td.decode(pt));
}
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const f1=v=>Number(v).toFixed(1).replace('.',',');
const pct=v=>Math.round(v*100)+'%';
const LV={5:'Sobresaliente',4:'Bueno',3:'Aceptable',2:'Insuficiente'};
const lvl=v=>`<span class="lvl${v===5?' s':''}">${v} · ${LV[v]}</span>`;

function render(D,mail){
  const P=D.pesos;
  const rows=D.estudiantes.map((s,i)=>`<tr><td class="num c">${i+1}</td><td>${esc(s.n)}</td><td class="mail">${esc(s.correo)}</td><td>${esc(s.equipo)}</td><td class="num c">${f1(s.avance)}</td><td class="num c">${f1(s.expo)}</td><td class="num c">${f1(s.conv)}</td><td class="final">${f1(s.final)}</td></tr>`).join('');

  const lvCells=(texts,got)=>texts.map((t,k)=>`<td class="lv${5-k===got?' hit':''}">${esc(t)}</td>`).join('');
  const teams=D.equipos.map((t,ti)=>{
    const people=D.estudiantes.filter(s=>s.equipo===t.nombre).map(s=>esc(s.n)).join(' · ');
    const ex=D.expo.notas[t.nombre],av=D.avance.notas[t.nombre];
    const exRows=D.expo.criterios.map((c,i)=>`<tr><td>${esc(c.n)}<small>${pct(c.w)}</small></td>${lvCells(c.lv,ex[i])}<td class="n">${ex[i]}</td></tr>`).join('');
    const avRows=D.avance.etapas.map(([e,d],i)=>`<tr><td>${esc(e)}<small style="font-family:var(--body);color:var(--muted);font-size:12.5px;margin-top:3px">${esc(d)}</small></td>${lvCells(D.avance.rubrica[i],av[i])}<td class="n">${av[i]}</td></tr>`).join('');
    return `<div class="team" id="team${ti}" ${ti?'hidden':''}>
      <div class="team-h"><div><span class="label">Consultora</span><h3>${esc(t.nombre)}</h3><p class="case">Caso: ${esc(t.caso)}</p><p class="people">${people}</p></div>
        <div class="scores"><div class="score"><b>${f1(D.avance.nota[t.nombre])}</b><span>Avance</span></div><div class="score"><b>${f1(D.expo.nota[t.nombre])}</b><span>Exposición</span></div></div></div>
      <div class="rub"><h4>Exposición final · ${pct(P.expo)} de la nota</h4>
        <div class="tbl"><table class="rubric"><thead><tr><th>Criterio</th><th>5 · Sobresaliente</th><th>4 · Bueno</th><th>3 · Aceptable</th><th>2 · Insuficiente</th><th class="c">Nivel</th></tr></thead>
        <tbody>${exRows}<tr class="tot"><td colspan="5">Nota de la exposición (promedio ponderado)</td><td class="n">${f1(D.expo.nota[t.nombre])}</td></tr></tbody></table></div></div>

        <tbody>${avRows}<tr class="tot"><td colspan="5">Nota del avance (promedio de las tres etapas)</td><td class="n">${f1(D.avance.nota[t.nombre])}</td></tr></tbody></table></div></div>
    </div>`;}).join('');

  const CL=Object.fromEntries(D.conv.niveles.map(([v,l])=>[v,l]));
  const conv=D.estudiantes.map(s=>{const v=D.conv.notas[s.n];return `<tr><td>${esc(s.n)}</td><td>${esc(s.equipo)}</td><td><span class="lvl${v===5?' s':''}">${esc(CL[v]||'')}</span></td><td class="num c">${f1(v)}</td></tr>`;}).join('');
  const convLv=D.conv.niveles.map(([v,a,b])=>`<tr><td style="white-space:nowrap;font-weight:600">${esc(a)}</td><td>${esc(b)}</td><td class="num c">${v}</td></tr>`).join('');

  document.getElementById('app').innerHTML=`
  <header class="top"><div class="wrap"><div class="brand">La Sabana <span>·</span> MGDP</div>
    <nav class="nav"><a href="#notas">Notas</a><a href="#calculo">Base de cálculo</a><a href="#rubricas">Rúbricas</a><a href="#conversatorios">Conversatorios</a></nav>
    <div class="who">${esc(mail)}<button id="out" type="button">Salir</button></div></div></header>
  <main class="wrap">
    <div class="hero"><span class="label">Universidad de La Sabana · ${esc(D.programa)}</span>
      <h1>${esc(D.curso)}</h1>
      <p class="sub">Notas finales y rúbricas diligenciadas por consultora. Profesor: ${esc(D.profesor)}. Sesiones del ${esc(D.periodo)}.</p>
      <div class="actions"><button class="btn" id="dlx" type="button">Descargar Excel</button><button class="btn ghost" id="dlp" type="button">Descargar PDF</button></div>
      <p class="note no-print">El Excel trae las mismas notas con sus fórmulas. El PDF incluye la tabla de notas y las rúbricas de las tres consultoras.</p>
    </div>

    <section id="notas"><h2>Notas finales</h2>
      <p class="lead">Escala de 0,0 a 5,0. La nota final combina el avance del trabajo, la exposición final y los conversatorios de las lecturas.</p>
      <div class="tbl"><table><thead><tr><th class="c">N.°</th><th>Estudiante</th><th>Correo</th><th>Consultora</th><th class="c">Avance (${pct(P.avance)})</th><th class="c">Exposición (${pct(P.expo)})</th><th class="c">Conversatorios (${pct(P.conv)})</th><th class="c">Nota final</th></tr></thead><tbody>${rows}</tbody></table></div>
    </section>

    <section id="calculo"><h2>Base de cálculo</h2>
      <div class="grid3">
        <div class="card"><b class="w">${pct(P.avance)}</b><h3>Avance del trabajo</h3><p>Grupal. Se califica el avance entregado en cada una de las tres etapas del curso con la rúbrica del avance. La nota es el promedio de las tres etapas.</p></div>
        <div class="card"><b class="w">${pct(P.expo)}</b><h3>Exposición final</h3><p>Grupal. Se califica con la rúbrica presentada en la primera sesión: seis criterios, cada uno con su peso.</p></div>
        <div class="card"><b class="w">${pct(P.conv)}</b><h3>Conversatorios</h3><p>Individual. Se califica la participación en los conversatorios de Hammer, Rousseau y Barends, y Kotter.</p></div>
      </div>
      <p class="note">Escala de 0,0 a 5,0. En el avance y la exposición, cada criterio recibe un nivel: 5 Sobresaliente, 4 Bueno, 3 Aceptable o 2 Insuficiente. En los conversatorios, la nota es 5, 4 o 2 según la rúbrica de participación. Las notas de cada componente y la nota final se redondean a un decimal.</p>
    </section>

    <section id="rubricas"><h2>Rúbricas por consultora</h2>
      <p class="lead">El nivel que obtuvo cada consultora está marcado en la rúbrica.</p>
      <div class="tabs" role="tablist">${D.equipos.map((t,i)=>`<button role="tab" aria-selected="${i===0}" data-t="${i}" type="button">${esc(t.nombre)}</button>`).join('')}</div>
      ${teams}
    </section>

    <section id="conversatorios"><h2>Conversatorios de las lecturas</h2>
      <p class="lead">Un conversatorio por etapa, al inicio de cada sábado.</p>
      <div class="tbl"><table><thead><tr><th>Estudiante</th><th>Consultora</th><th>Participación</th><th class="c">Nota</th></tr></thead><tbody>${conv}</tbody></table></div>
      <h3 style="font-size:18px;margin-top:6px">Rúbrica de participación</h3><div class="tbl"><table><thead><tr><th>Nivel</th><th>Descripción</th><th class="c">Nota</th></tr></thead><tbody>${convLv}</tbody></table></div>
    </section>

    <p class="foot">${esc(D.profesor)} · Profesor visitante · alexissr@unisabana.edu.co</p>
  </main>`;

  document.getElementById('out').onclick=()=>{try{sessionStorage.removeItem('sabana-notas')}catch(e){}location.reload();};
  document.getElementById('dlp').onclick=()=>window.print();
  document.getElementById('dlx').onclick=()=>{const blob=new Blob([b64(D.xlsx)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=D.xlsxName;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);};
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.setAttribute('aria-selected',x===b));document.querySelectorAll('.team').forEach((el,i)=>el.hidden=String(i)!==b.dataset.t);});
}

async function enter(mail,quiet){
  const btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;btn.textContent='Verificando…';err.textContent='';
  let D=null;try{D=await unlock(mail);}catch(e){D=null;}
  btn.disabled=false;btn.textContent='Entrar';
  if(!D){if(!quiet)err.textContent='Este correo no tiene acceso a las notas. Revisa que esté bien escrito.';return;}
  try{sessionStorage.setItem('sabana-notas',mail.trim().toLowerCase())}catch(e){}
  document.getElementById('gate').hidden=true;document.getElementById('app').hidden=false;render(D,mail.trim().toLowerCase());
}
document.getElementById('gateForm').addEventListener('submit',e=>{e.preventDefault();enter(document.getElementById('mail').value);});
try{const s=sessionStorage.getItem('sabana-notas');if(s)enter(s,true);}catch(e){}
</script>
</body>
</html>
